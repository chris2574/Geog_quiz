<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港地理 Quest｜題庫 Firebase 測試</title><style>
:root{--ink:#14233f;--blue:#2475d9;--gold:#ffc833;--green:#2faf69;--red:#e74b5b;--card:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#dff4ff;color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}.wrap{max-width:1080px;margin:28px auto;padding:0 16px}.box{background:var(--card);border:4px solid var(--ink);border-radius:14px;padding:22px;box-shadow:7px 7px #80b2d5;margin-bottom:18px}h1{color:var(--blue);margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.field{display:block;font-weight:bold;margin:11px 0}.field input,.field select,.field textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:2px solid #91a7c1;border-radius:7px;background:#fff;font:inherit}.field textarea{min-height:70px}button{padding:10px 13px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 3px #123d77;margin:3px}button.gold{background:var(--gold);color:#4b3100;box-shadow:0 3px #a66f00}button.danger{background:var(--red);box-shadow:0 3px #9f2736}.hidden{display:none!important}.status{white-space:pre-wrap;padding:10px;border-radius:7px;background:#edf3f7;min-height:42px}.ok{background:#e2f5e9;color:#12613a}.error{background:#ffe2e6;color:#a61d32}.hint{font-size:.9em;color:#496078;line-height:1.5}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #a9b6c5;padding:8px;text-align:left;vertical-align:top}th{background:#d9efff}.small{font-size:.85em}code{background:#edf3f7;padding:2px 4px;border-radius:4px}@media(max-width:600px){.wrap{margin:12px auto}.box{padding:15px}}
</style></head><body><main class="wrap"><section class="box"><h1>🗺️ 題庫 Firebase 測試頁</h1><p class="hint">此頁不會改動主遊戲的 <code>index.html</code>。用途是測試教師能否新增、修改和刪除 Firestore <code>questions</code>，以及學生能否依年級讀取題目。</p><div id="status" class="status">正在載入 Firebase SDK…</div></section><section id="loginBox" class="box"><h2>教師登入</h2><div class="grid"><label class="field">教師 Firebase 電郵<input id="email" type="email" autocomplete="username"></label><label class="field">密碼<input id="password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')teacherLogin()"></label></div><button class="gold" onclick="teacherLogin()">教師登入</button></section><section id="teacherBox" class="hidden"><section class="box"><h2>✅ 教師題庫管理</h2><p id="teacherInfo" class="hint"></p><button onclick="logout()">登出</button></section><section class="box"><h2 id="formTitle">新增題目至 Firestore</h2><input id="editId" type="hidden"><div class="grid"><label class="field">適用年級<select id="grade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">題型<select id="type"><option value="single">單選題</option><option value="multi">多項選擇題</option><option value="open">開放式題目</option></select></label><label class="field">課題<input id="topic" placeholder="例如：天氣與氣候"></label><label class="field">難度<select id="difficulty"><option>基本</option><option>進階</option><option>挑戰</option></select></label></div><label class="field">題目內容<textarea id="text" placeholder="輸入題幹"></textarea></label><label class="field">選項（每行一項；開放式題可留空）<textarea id="options" placeholder="東南季風&#10;西北季風&#10;極地東風"></textarea></label><label class="field">正確答案（多項選擇以 | 分隔）<input id="answer" placeholder="例如：東南季風"></label><button class="gold" onclick="saveQuestion()">儲存至 Firebase</button><button id="cancelEdit" class="hidden" onclick="resetForm()">取消修改</button></section><section class="box"><h2>雲端題庫</h2><label class="field">檢視年級<select id="filterGrade" onchange="loadQuestions()"><option value="all">全部年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><button onclick="loadQuestions()">重新讀取題庫</button><div id="questionList" class="hint">尚未讀取。</div></section></section><section id="studentBox" class="box"><h2>學生年級讀取測試</h2><p class="hint">不用登入教師也可測試讀取；選擇一個年級後，頁面會只顯示該年級的 Firestore 題目。</p><label class="field">學生年級<select id="studentGrade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><button onclick="studentRead()">讀取指定年級題庫</button><div id="studentList" class="hint">尚未讀取。</div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>
let auth,db,currentUser=null;const status=document.getElementById('status');
function show(t,type){status.textContent=t;status.className='status '+(type||'')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function err(e){const x={'auth/invalid-credential':'電郵或密碼不正確。','permission-denied':'Firestore Rules 拒絕存取。','failed-precondition':'Firestore 尚未準備好。'};return (x[e.code]||e.code||'錯誤')+'\n'+(e.message||'')}
try{firebase.initializeApp({apiKey:'AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4',authDomain:'hk-geography-quest.firebaseapp.com',projectId:'hk-geography-quest',storageBucket:'hk-geography-quest.firebasestorage.app',messagingSenderId:'418307975863',appId:'1:418307975863:web:6e8c259e0ba723d7ec3b32'});auth=firebase.auth();db=firebase.firestore();show('Firebase 已載入。可登入教師帳戶，或先使用下方的學生年級讀取測試。','ok')}catch(e){show('Firebase 初始化失敗：\n'+e.message,'error')}
async function teacherLogin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){show('請輸入教師電郵和密碼。','error');return}show('正在登入及驗證教師 role…');try{const cred=await auth.signInWithEmailAndPassword(email,password),snap=await db.collection('users').doc(cred.user.uid).get();if(!snap.exists||String(snap.data().role||'').toLowerCase()!=='teacher'){await auth.signOut();show('已登入 Authentication，但此帳戶的 Firestore profile 不是 role: teacher。','error');return}currentUser={uid:cred.user.uid,...snap.data()};document.getElementById('loginBox').classList.add('hidden');document.getElementById('teacherBox').classList.remove('hidden');document.getElementById('teacherInfo').textContent='教師：'+(currentUser.displayName||'')+'；UID：'+currentUser.uid;show('✅ 教師身份已驗證。現在可新增、修改、刪除雲端題目。','ok');loadQuestions()}catch(e){show(err(e),'error')}}
async function logout(){await auth.signOut();currentUser=null;document.getElementById('teacherBox').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');show('已登出。')}
function getForm(){const type=document.getElementById('type').value,raw=document.getElementById('options').value.split('\n').map(x=>x.trim()).filter(Boolean),answer=document.getElementById('answer').value.trim();return{grade:Number(document.getElementById('grade').value),type,topic:document.getElementById('topic').value.trim()||'未分類',difficulty:document.getElementById('difficulty').value,text:document.getElementById('text').value.trim(),options:raw,answer:type==='multi'?answer.split('|').map(x=>x.trim()).filter(Boolean):answer,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:currentUser.uid}}
async function saveQuestion(){if(!currentUser){show('請先登入教師帳戶。','error');return}const data=getForm();if(!data.text||(!data.answer&&data.type!=='open')){show('請至少填寫題目和正確答案；開放式題目可保留正確答案空白。','error');return}try{const editId=document.getElementById('editId').value;if(editId){await db.collection('questions').doc(editId).update(data);show('✅ 題目已更新至 Firebase。','ok')}else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();data.createdBy=currentUser.uid;await db.collection('questions').add(data);show('✅ 新題目已加入 Firebase questions collection。','ok')}resetForm();loadQuestions()}catch(e){show(err(e),'error')}}
function resetForm(){document.getElementById('editId').value='';document.getElementById('formTitle').textContent='新增題目至 Firestore';document.getElementById('grade').value='1';document.getElementById('type').value='single';document.getElementById('topic').value='';document.getElementById('difficulty').value='基本';document.getElementById('text').value='';document.getElementById('options').value='';document.getElementById('answer').value='';document.getElementById('cancelEdit').classList.add('hidden')}
async function loadQuestions(){const out=document.getElementById('questionList');out.textContent='正在讀取 Firestore questions…';try{let snap=await db.collection('questions').get(),grade=document.getElementById('filterGrade').value,rows=[];snap.forEach(d=>{let q=d.data();if(grade==='all'||String(q.grade)===grade)rows.push({id:d.id,...q})});rows.sort((a,b)=>(a.grade-b.grade)||String(a.topic).localeCompare(String(b.topic)));out.innerHTML=rows.length?`<table><tr><th>年級</th><th>課題／題目</th><th>題型</th><th>答案</th>${currentUser?'<th>操作</th>':''}</tr>${rows.map(q=>`<tr><td>中${esc(q.grade)}</td><td><b>${esc(q.topic)}</b><br>${esc(q.text)}</td><td>${esc(q.type)}</td><td>${esc(Array.isArray(q.answer)?q.answer.join(' | '):q.answer||'開放式')}</td>${currentUser?`<td><button onclick="editQuestion('${q.id}')">修改</button><button class="danger" onclick="deleteQuestion('${q.id}')">刪除</button></td>`:''}</tr>`).join('')}</table>`:'此篩選下未有題目。'}catch(e){out.textContent=err(e);out.className='error'}}
async function editQuestion(id){try{const s=await db.collection('questions').doc(id).get(),q=s.data();document.getElementById('editId').value=id;document.getElementById('formTitle').textContent='修改題目：'+id;document.getElementById('grade').value=q.grade;document.getElementById('type').value=q.type;document.getElementById('topic').value=q.topic||'';document.getElementById('difficulty').value=q.difficulty||'基本';document.getElementById('text').value=q.text||'';document.getElementById('options').value=(q.options||[]).join('\n');document.getElementById('answer').value=Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'');document.getElementById('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}catch(e){show(err(e),'error')}}
async function deleteQuestion(id){if(!confirm('確定刪除這條題目？'))return;try{await db.collection('questions').doc(id).delete();show('✅ 題目已從 Firebase 刪除。','ok');loadQuestions()}catch(e){show(err(e),'error')}}
async function studentRead(){const g=document.getElementById('studentGrade').value,out=document.getElementById('studentList');out.textContent='正在讀取中'+g+'題庫…';try{const snap=await db.collection('questions').where('grade','==',Number(g)).get(),rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));out.innerHTML=rows.length?`<p class="ok">成功讀取中${g}題庫，共 ${rows.length} 題。</p><ol>${rows.map(q=>`<li><b>${esc(q.text)}</b><br><span class="small">課題：${esc(q.topic)}；題型：${esc(q.type)}</span></li>`).join('')}</ol>`:`中${g}暫時未有雲端題目。請以教師帳戶新增題目。`}catch(e){out.textContent=err(e);out.className='error'}}
</script></body></html>
