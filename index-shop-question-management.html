<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港地理 Quest｜商店及題庫管理</title><style>:root{--ink:#14233f;--blue:#2475d9;--gold:#ffc833;--green:#2faf69;--red:#e74b5b;--card:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#dff4ff;color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:bold;box-shadow:0 3px #123d77;margin:3px}.danger{background:var(--red)}.soft{background:#eaf4ff;color:var(--ink);box-shadow:0 3px #9bb8d2}.gold{background:var(--gold);color:#4b3100;box-shadow:0 3px #a66f00}.screen{min-height:100vh;padding:20px}.login{max-width:520px;margin:8vh auto;background:var(--card);padding:25px;border:4px solid var(--ink);box-shadow:8px 8px #80b2d5;border-radius:14px}.logo{text-align:center;font-size:2em;font-weight:900;color:var(--blue)}.field{display:block;margin:12px 0;font-weight:bold}.field input,.field select,.field textarea{display:block;width:100%;padding:10px;margin-top:6px;border:2px solid #91a7c1;border-radius:7px;background:#fff}.field textarea{min-height:75px}.error{min-height:22px;color:#b21f34;font-weight:bold;white-space:pre-wrap}.topbar{position:sticky;top:0;z-index:4;background:#fffdf5;border-bottom:4px solid var(--ink);display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 18px}.topbar .brand{font-weight:900;font-size:1.2em;margin-right:auto}.page{max-width:1180px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:16px;box-shadow:5px 5px #9ec3dc}.hero{height:220px;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(#83d4ff 0 60%,#82c767 60%);padding:26px;color:#fff;text-shadow:2px 2px #19365b}.hero h1{margin:0 0 10px}.sync-status{display:inline-block;background:#e2f5e9;color:#12613a;border:1px solid #75c799;border-radius:5px;padding:5px 8px}.sync-status.warn,.empty{background:#fff4d4;color:#704f00;border:2px solid #e3bd57;border-radius:8px;padding:15px}table{width:100%;border-collapse:collapse;background:#fff;font-size:.9em}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left;vertical-align:top}th{background:#d9efff}.hint{font-size:.87em;color:#496078}@media(max-width:600px){.screen{padding:12px}.topbar .brand{width:100%}.login{margin:3vh auto}}
</style></head><body><div id="app"></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const config={apiKey:"AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4",authDomain:"hk-geography-quest.firebaseapp.com",projectId:"hk-geography-quest",storageBucket:"hk-geography-quest.firebasestorage.app",messagingSenderId:"418307975863",appId:"1:418307975863:web:6e8c259e0ba723d7ec3b32"};const app=initializeApp(config),auth=getAuth(app),fs=getFirestore(app);let me=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function err(e){return (e?.code||'操作失敗')+'\n'+(e?.message||'未知 Firebase 錯誤')}function view(h){$('app').innerHTML=h}
function login(){view(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><h2>教師 Firebase 登入</h2><label class="field">教師電郵<input id="email" type="email"></label><label class="field">密碼<input id="pass" type="password" onkeydown="if(event.key==='Enter')doLogin()"></label><div id="error" class="error"></div><button class="gold" style="width:100%" onclick="doLogin()">登入</button></section></main>`)}window.doLogin=async()=>{try{const c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value),p=await getDoc(doc(fs,'users',c.user.uid));if(!p.exists()||p.data().role!=='teacher')throw new Error('此帳戶不是教師。');me={uid:c.user.uid,email:c.user.email};panel()}catch(e){$('error').textContent=err(e)}};window.logout=async()=>{await signOut(auth);me=null;login()};function panel(){view(`<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button onclick="tab('questions')">題庫／編輯</button><button onclick="tab('shop')">商店管理</button><button class="danger" onclick="logout()">登出</button></header><main class="page"><section class="hero"><h1>👩‍🏫 教師控制台</h1><p>Firebase 題庫及商品同步</p><span class="sync-status">${esc(me.email)}</span></section><div id="content"></div></main>`);tab('questions')}
window.tab=async t=>{const c=$('content');if(t==='questions'){c.innerHTML=`<section class="card"><h2 id="qTitle">新增雲端題目</h2><input id="qId" type="hidden"><div class="grid"><label class="field">年級<select id="qGrade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">題型<select id="qType"><option value="single">單選題</option><option value="multi">多項選擇題</option><option value="open">開放式題目</option></select></label><label class="field">課題<input id="qTopic"></label><label class="field">難度<select id="qDiff"><option>基本</option><option>進階</option><option>挑戰</option></select></label></div><label class="field">題目<textarea id="qText"></textarea></label><label class="field">選項（每行一項）<textarea id="qOpts"></textarea></label><label class="field">答案（多項以 | 分隔）<input id="qAns"></label><button class="gold" onclick="saveQ()">儲存題目</button><button class="soft" onclick="resetQ()">取消修改</button></section><section class="card"><h2>Firestore questions</h2><select id="qFilter" onchange="loadQ()"><option value="all">全部年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select><button onclick="loadQ()">重新讀取</button><div id="qList" class="hint">正在讀取…</div></section>`;loadQ();return}c.innerHTML=`<section class="card"><h2 id="sTitle">新增商店商品</h2><input id="sId" type="hidden"><div class="grid"><label class="field">商品名稱<input id="sName"></label><label class="field">價格<input id="sCost" type="number" min="0" step="1"></label></div><label class="field">說明<textarea id="sDesc"></textarea></label><label class="field">圖片網址<input id="sImg" type="url"></label><button class="gold" onclick="saveS()">儲存商品</button><button class="soft" onclick="resetS()">取消修改</button></section><section class="card"><h2>Firestore shopItems</h2><button onclick="loadS()">重新讀取</button><div id="sList" class="hint">正在讀取…</div></section>`;loadS()};
window.saveQ=async()=>{try{const type=$('qType').value,a=$('qAns').value.trim(),q={grade:Number($('qGrade').value),type,topic:$('qTopic').value.trim()||'未分類',difficulty:$('qDiff').value,text:$('qText').value.trim(),options:$('qOpts').value.split('\n').map(x=>x.trim()).filter(Boolean),answer:type==='multi'?a.split('|').map(x=>x.trim()).filter(Boolean):a,updatedAt:serverTimestamp(),updatedBy:me.uid};if(!q.text)throw Error('請輸入題目。');if(type!=='open'&&(!q.options.length||!q.answer))throw Error('需要選項及答案。');if($('qId').value)await updateDoc(doc(fs,'questions',$('qId').value),q);else await addDoc(collection(fs,'questions'),{...q,createdAt:serverTimestamp(),createdBy:me.uid});resetQ();await loadQ();alert('題目已同步。')}catch(e){alert(err(e))}};window.resetQ=()=>{if(!$('qId'))return;$('qId').value='';$('qTitle').textContent='新增雲端題目';$('qGrade').value='1';$('qType').value='single';$('qTopic').value='';$('qDiff').value='基本';$('qText').value='';$('qOpts').value='';$('qAns').value=''};window.loadQ=async()=>{const out=$('qList');if(!out)return;try{const f=$('qFilter').value,s=await getDocs(collection(fs,'questions')),a=s.docs.map(d=>({id:d.id,...d.data()})).filter(q=>f==='all'||String(q.grade)===f);out.innerHTML=a.length?`<table><tr><th>年級</th><th>題目</th><th>答案</th><th>操作</th></tr>${a.map(q=>`<tr><td>中${q.grade}</td><td>${esc(q.text)}<br><span class="hint">${esc(q.topic||'')}</span></td><td>${esc(Array.isArray(q.answer)?q.answer.join(' | '):q.answer||'開放式')}</td><td><button onclick="editQ('${q.id}')">修改</button><button class="danger" onclick="delQ('${q.id}')">刪除</button></td></tr>`).join('')}</table>`:'<div class="empty">沒有題目。</div>'}catch(e){out.innerHTML='<p class="error">'+esc(err(e))+'</p>'}};window.editQ=async id=>{const s=await getDoc(doc(fs,'questions',id));if(!s.exists())return;const q=s.data();$('qId').value=id;$('qTitle').textContent='修改題目：'+id;$('qGrade').value=q.grade;$('qType').value=q.type||'single';$('qTopic').value=q.topic||'';$('qDiff').value=q.difficulty||'基本';$('qText').value=q.text||'';$('qOpts').value=(q.options||[]).join('\n');$('qAns').value=Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'');scrollTo({top:0,behavior:'smooth'})};window.delQ=async id=>{if(!confirm('確定刪除題目？'))return;await deleteDoc(doc(fs,'questions',id));loadQ()};
window.saveS=async()=>{try{const name=$('sName').value.trim(),cost=Number($('sCost').value),p={name,cost,desc:$('sDesc').value.trim(),img:$('sImg').value.trim(),updatedAt:serverTimestamp(),updatedBy:me.uid};if(!name||!Number.isInteger(cost)||cost<0)throw Error('請輸入商品名稱及有效價格。');if($('sId').value)await updateDoc(doc(fs,'shopItems',$('sId').value),p);else await addDoc(collection(fs,'shopItems'),{...p,createdAt:serverTimestamp(),createdBy:me.uid});resetS();loadS();alert('商品已同步。')}catch(e){alert(err(e))}};window.resetS=()=>{if(!$('sId'))return;$('sId').value='';$('sTitle').textContent='新增商店商品';$('sName').value='';$('sCost').value='';$('sDesc').value='';$('sImg').value=''};window.loadS=async()=>{const o=$('sList');if(!o)return;try{const s=await getDocs(collection(fs,'shopItems')),a=s.docs.map(d=>({id:d.id,...d.data()}));o.innerHTML=a.length?`<table><tr><th>商品</th><th>價格</th><th>說明</th><th>操作</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cost)}</td><td>${esc(x.desc||'')}</td><td><button onclick="editS('${x.id}')">修改</button><button class="danger" onclick="delS('${x.id}')">刪除</button></td></tr>`).join('')}</table>`:'<div class="empty">尚未有商品。</div>'}catch(e){o.innerHTML='<p class="error">'+esc(err(e))+'</p>'}};window.editS=async id=>{const s=await getDoc(doc(fs,'shopItems',id));if(!s.exists())return;const x=s.data();$('sId').value=id;$('sTitle').textContent='修改商品：'+id;$('sName').value=x.name||'';$('sCost').value=x.cost??'';$('sDesc').value=x.desc||'';$('sImg').value=x.img||'';scrollTo({top:0,behavior:'smooth'})};window.delS=async id=>{if(!confirm('確定刪除商品？'))return;await deleteDoc(doc(fs,'shopItems',id));loadS()};login();
</script></body></html>
