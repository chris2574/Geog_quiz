<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>香港地理 Quest — Firebase 教師登入版</title><style>
:root{--ink:#14233f;--blue:#2475d9;--gold:#ffc833;--green:#2faf69;--red:#e74b5b;--card:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#dff4ff;color:var(--ink);font-family:ui-monospace,Consolas,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:bold;box-shadow:0 3px 0 #123d77}button:active{transform:translateY(2px);box-shadow:0 1px 0 #123d77}.danger{background:var(--red)}.soft{background:#eaf4ff;color:var(--ink);box-shadow:0 3px 0 #9bb8d2}.gold{background:var(--gold);color:#4b3100;box-shadow:0 3px 0 #a66f00}.screen{min-height:100vh;padding:20px}.login{max-width:520px;margin:8vh auto;background:var(--card);padding:25px;border:4px solid var(--ink);box-shadow:8px 8px 0 #80b2d5;border-radius:14px}.logo{text-align:center;font-size:2em;font-weight:900;color:var(--blue)}.tabs,.tools,.hud{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0}.tabs button{flex:1}.field{display:block;margin:12px 0;font-weight:bold}.field input,.field select,.field textarea{display:block;width:100%;padding:10px;margin-top:6px;border:2px solid #91a7c1;border-radius:7px;background:#fff}.hint{font-size:.87em;color:#496078}.error{min-height:22px;color:#b21f34;font-weight:bold}.topbar{position:sticky;top:0;z-index:4;background:#fffdf5;border-bottom:4px solid var(--ink);display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 18px}.topbar .brand{font-weight:900;font-size:1.2em;margin-right:auto}.topbar button{padding:7px 9px}.page{max-width:1180px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:16px;box-shadow:5px 5px 0 #9ec3dc}.card h2,.card h3{margin-top:0}.hero{height:250px;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(#83d4ff 0 60%,#82c767 60%);position:relative;padding:26px;color:#fff;text-shadow:2px 2px #19365b}.hero:before{content:"";position:absolute;inset:auto 8% 20px 8%;height:65px;background:#5d9a58;clip-path:polygon(0 100%,18% 30%,28% 70%,45% 0,60% 70%,75% 20%,100% 100%)}.hero h1,.hero p{position:relative;z-index:1;margin:0 0 10px}.hero .hero-badge{position:relative;z-index:1;display:inline-block;background:#fff;color:var(--ink);padding:5px 8px;border-radius:5px;border:2px solid var(--ink);margin:0;text-shadow:none;line-height:1.15;white-space:nowrap}.badge{display:inline-block;background:#fff;color:var(--ink);padding:4px 7px;border-radius:5px;border:2px solid var(--ink);margin:3px}.ticker{background:#152b50;color:#fff;padding:9px;border-radius:7px;white-space:nowrap;overflow:hidden}.map{height:530px;position:relative;overflow:hidden;background:linear-gradient(#7fd4ff 0 30%,#8ed176 30% 100%);border:4px solid var(--ink);border-radius:12px}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,#64b457 32px 34px),repeating-linear-gradient(90deg,transparent 0 31px,#64b457 32px 34px);opacity:.42}.road{position:absolute;background:#dfc482;border:3px solid #987c49;border-radius:20px}.player,.npc,.monster,.sign{position:absolute;z-index:2;text-align:center;font-size:34px;line-height:36px;user-select:none}.player{transition:left .09s,top .09s}.npc,.monster{cursor:pointer}.sign{font-size:27px}.mapnote{position:absolute;z-index:3;bottom:10px;left:10px;background:#fffdf5;border:2px solid var(--ink);padding:7px;border-radius:6px}.move{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:13px}.move button{padding:10px}.move button:first-child{grid-column:2}.move button:last-child{grid-column:2}.modal{position:fixed;z-index:10;inset:0;background:#0009;display:grid;place-items:center;padding:14px}.dialog{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:#fffdf5;border:4px solid var(--ink);border-radius:12px;padding:20px}.answers{display:grid;gap:10px}.answers button{text-align:left}.bar{height:16px;background:#d5e3ed;border:2px solid var(--ink);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}.urgent{animation:flash .65s infinite;background:#ffdae0!important}@keyframes flash{50%{background:#ff3652!important;color:#fff}}table{width:100%;border-collapse:collapse;background:#fff;font-size:.9em}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left;vertical-align:top}th{background:#d9efff}.chat{height:240px;overflow:auto;background:#edf7ff;border:2px solid #8eacc7;padding:8px;border-radius:7px}.msg{padding:7px;margin:6px 0;background:#fff;border-radius:6px}.msg.mine{background:#d5f3df;margin-left:15%}.bannerimg{max-height:180px;max-width:100%;object-fit:cover;border-radius:7px}.question-media{max-width:100%;max-height:210px;border:2px solid var(--ink);border-radius:6px;cursor:zoom-in}.announcement{background:#fff5c7;border-left:5px solid var(--gold);padding:10px;border-radius:5px}.comic-panel{position:relative;overflow:hidden;background:#071328;border:4px solid var(--ink);border-radius:12px;min-height:360px}.comic-panel img{width:100%;display:block;max-height:62vh;object-fit:contain;background:#061126}.comic-caption{position:absolute;top:14px;left:14px;right:14px;background:linear-gradient(90deg,#071328f5,#071328cf);border-left:5px solid var(--gold);color:#fff;padding:12px 14px;border-radius:6px;text-shadow:1px 1px #000;z-index:2}.comic-caption h2{margin:0 0 5px;color:#ffe184;font-size:1.15em}.comic-caption p{margin:0;line-height:1.5}.comic-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.comic-progress{font-weight:bold}.comic-intro{background:linear-gradient(135deg,#132b58,#356bc0);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:24px;text-align:center}.comic-intro h1{color:#ffe184}.comic-page-label{display:inline-block;background:#ffe184;color:#14233f;border:2px solid #14233f;border-radius:5px;padding:4px 8px;font-weight:bold;margin-bottom:10px}.sync-status{font-size:.85em;padding:5px 8px;border-radius:5px;background:#e2f5e9;color:#12613a;border:1px solid #75c799}.sync-status.warn{background:#fff4d4;color:#7d5600;border-color:#e3bd57}@media(max-width:600px){.screen{padding:12px}.topbar{padding:9px}.topbar .brand{width:100%}.map{height:430px}.hero{height:205px;padding:18px}.hero h1{font-size:1.35em}.hero p{font-size:.86em}.hero .hero-badge{font-size:.82em;max-width:100%;overflow:hidden;text-overflow:ellipsis}.login{margin:3vh auto}.comic-caption{top:8px;left:8px;right:8px;padding:8px 10px;font-size:.82em}.comic-caption h2{font-size:1em}.comic-panel img{min-height:310px;object-fit:cover}.comic-controls{flex-wrap:wrap}}
</style></head><body><div id="app"></div><div id="modal"></div><script>
const KEY='hkgeoquest_v3';const COMIC=[{kind:'intro',title:'《願望之石：地理 Quest 的開始》',text:'在香港這座山海相連的城市裡，地理不只是課本上的知識，而是一場等待被發現的冒險。傳說中，願望之石會因為好奇心、合作和愛護環境而發光。'},{img:'dreamina-2026-08-16-7070-Beautiful-anime-style-mystery-adventure.jpg',title:'第一頁：圖書館裡的發現',text:'放學後，兩位學生在地理圖書館跟老師研究一個神秘的發光儀器。老師說：「這是願望之石的導航儀；它會帶領願意探索世界的人發現線索。」'},{img:'dreamina-2026-08-16-2782-Dynamic-anime-style-key-visual-manga-sp.jpg',title:'第二頁：怪盜現身',text:'當夜幕降臨校園，神秘怪盜霧影狐趁大家不注意，把閃耀的願望之石帶走了！他留下訊息：「想找回它，就用地理知識走遍每一條線索吧！」'},{img:'dreamina-2026-08-16-8059-Dynamic-anime-action-scene-shonen-manga.jpg',title:'第三頁：知識風暴',text:'翌日，怪盜留下的混亂線索化成「紙頁風暴」！主角明白，不能靠蠻力解決問題；要冷靜閱讀資料、辨認地圖符號，並與同學合作。'},{img:'dreamina-2026-08-16-9466-Dramatic-anime-climax-scene-dark-fantas.jpg',title:'第四頁：追向地理世界',text:'循著導航儀的光芒，主角看見霧影狐把願望之石帶往迷霧世界的入口。下一步，就是進入中一、中二或中三級地圖，完成任務、收集線索，讓願望之石重現光芒！'}];const base={banners:[],news:[{id:'n1',title:'香港天文台天氣資訊',date:'2026-08-16',cat:'天氣與氣候',summary:'閱讀天氣資料，思考天氣如何影響日常生活與戶外活動。'}],questions:{1:[],2:[],3:[]},shop:[],settings:{temp:'30°C',humidity:'78%',rain:'0 mm',warning:'暫無特別天氣警告'}};let db=JSON.parse(localStorage.getItem(KEY)||'null')||base,me=null,game=null,bannerTimer=null,comicPage=0;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){return new Date().toISOString().slice(0,10)}function app(h){document.getElementById('app').innerHTML=h}function modal(h){document.getElementById('modal').innerHTML=h?`<div class="modal"><div class="dialog">${h}</div></div>`:''}function closeModal(){modal('')}async function waitFirebase(){if(window.firebaseServices)return window.firebaseServices;return new Promise(resolve=>window.addEventListener('firebase-ready',()=>resolve(window.firebaseServices),{once:true}))}function accountEmail(name){let bytes=new TextEncoder().encode(name.trim().normalize('NFKC').toLowerCase()),hex=[...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');return 'student_'+hex+'@hkgeographyquest.student'}function firebaseError(e){const code=typeof e?.code==='string'?e.code:'';const message=typeof e?.message==='string'?e.message:'未知 Firebase 錯誤';const maps={'auth/email-already-in-use':'此姓名帳戶已存在。','auth/invalid-credential':'帳戶名稱／電郵或密碼不正確。','auth/wrong-password':'帳戶名稱／電郵或密碼不正確。','auth/user-not-found':'帳戶名稱／電郵或密碼不正確。','auth/weak-password':'密碼強度不足。','auth/network-request-failed':'網絡連線失敗，請再試一次。','permission-denied':'沒有資料庫存取權限，請檢查 Firestore Rules。'};return (maps[code]||'操作失敗：'+(code||'未知錯誤'))+'\nFirebase: '+message}async function loadProfile(uid){let f=await waitFirebase(),snap=await f.getDoc(f.doc(f.firestore,'users',uid));return snap.exists()?snap.data():null}async function syncProfile(){if(!me?.uid||me.role==='teacher')return;let f=await waitFirebase();await f.updateDoc(f.doc(f.firestore,'users',me.uid),{coins:me.coins||0,purchases:me.purchases||[],checkInDate:me.checkin||'',updatedAt:f.serverTimestamp()})}async function loadSharedShop(){try{let f=await waitFirebase(),snap=await f.getDocs(f.collection(f.firestore,'shopItems'));if(!snap.empty){db.shop=snap.docs.map(d=>({id:d.id,...d.data()}));save()}return db.shop}catch(e){return db.shop}}
function loginPage(){app(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><p class="hint">8-bit 地理冒險學習平台 · 尋回被怪盜偷走的願望之石！</p><div class="tabs"><button onclick="loginTab('student')">學生登入</button><button class="soft" onclick="loginTab('reg')">學生申請帳戶</button><button class="gold" onclick="loginTab('teacher')">教師登入</button></div><div id="auth"></div></section></main>`);loginTab('student')}function loginTab(t){if(t==='teacher'){auth.innerHTML=`<h2>教師 Firebase 登入</h2><label class="field">教師電郵<input id="tEmail" type="email" autocomplete="username"></label><label class="field">密碼<input id="tPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')teacherLogin()"></label><div id="err" class="error"></div><button style="width:100%" class="gold" onclick="teacherLogin()">教師登入</button>`;return}auth.innerHTML=t==='student'?`<label class="field">學生姓名／帳戶<input id="liUser" autocomplete="username"></label><label class="field">密碼<input id="liPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')studentLogin()"></label><div id="err" class="error"></div><button style="width:100%" onclick="studentLogin()">登入（Enter）</button>`:`<label class="field">學生姓名<input id="rName"></label><label class="field">班別<select id="rClass">${['1A','1B','2A','2B','3A','3B'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">密碼<input id="rPass" type="password"></label><div id="err" class="error"></div><button style="width:100%" onclick="register()">申請帳戶</button>`}async function sessionLogin(cred){let p=await loadProfile(cred.user.uid);if(!p){await signOut(firebaseServices.auth);throw{code:'permission-denied',message:'找不到 users profile'}}me={uid:cred.user.uid,name:p.displayName||cred.user.email,role:String(p.role||'student').toLowerCase(),className:p.className||'',grade:Number(p.grade||0),coins:Number(p.coins||0),checkin:p.checkInDate||'',purchases:p.purchases||[],email:cred.user.email};if(me.role==='teacher')teacherHome();else home()}async function studentLogin(){let u=liUser.value.trim(),p=liPass.value;if(!u||!p){err.textContent='請輸入帳戶名稱和密碼。';return}try{let f=await waitFirebase();await sessionLogin(await f.signInWithEmailAndPassword(f.auth,accountEmail(u),p))}catch(e){err.textContent=firebaseError(e)}}async function teacherLogin(){let email=tEmail.value.trim(),p=tPass.value;if(!email||!p){err.textContent='請輸入教師電郵和密碼。';return}try{let f=await waitFirebase();await sessionLogin(await f.signInWithEmailAndPassword(f.auth,email,p))}catch(e){err.textContent=firebaseError(e)}}async function register(){let name=rName.value.trim(),cl=rClass.value,p=rPass.value;if(name.length<2||p.length<6){err.textContent='請輸入有效姓名及至少六位密碼。';return}try{let f=await waitFirebase(),cred=await f.createUserWithEmailAndPassword(f.auth,accountEmail(name),p),g=Number(cl[0]);await f.setDoc(f.doc(f.firestore,'users',cred.user.uid),{displayName:name,className:cl,grade:g,role:'student',coins:2,purchases:[],checkInDate:'',createdAt:f.serverTimestamp(),updatedAt:f.serverTimestamp()});await sessionLogin(cred)}catch(e){err.textContent=firebaseError(e)}}function nav(){return `<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button class="soft" onclick="${me.role==='teacher'?'teacherHome()':'home()'}">主頁</button>${me.role==='teacher'?'<button class="gold" onclick="teacherPanel()">教師控制台</button>':'<button class="soft" onclick="openChat()">聊天</button><button class="gold" onclick="dailyCheckin()">每天簽到</button>'}<button class="danger" onclick="logout()">登出</button></header>`}async function logout(){let f=await waitFirebase();await f.signOut(f.auth);me=null;loginPage()}function teacherHome(){app(nav()+`<main class="page"><section class="hero"><h1>教師首頁</h1><p>你好，${esc(me.name)}。你的 Firebase 教師身份已驗證。</p><span class="hero-badge">🔒 教師權限</span></section><section class="card"><h2>👩‍🏫 教師控制台</h2><button class="gold" onclick="teacherPanel()">前往教師控制台</button></section></main>`)}function home(){clearInterval(bannerTimer);game=null;app(nav()+`<main class="page"><section class="hero"><h1>探索我們的城市與自然</h1><p>💡 由地圖、數據與故事開始你的地理旅程。</p><span class="hero-badge">香港自然景觀</span></section><div class="ticker">📢 香港天文台天氣資訊　｜　探索城市與自然的關係</div><section class="grid" style="margin-top:16px"><article class="card"><h2>📖 漫畫式劇情</h2><p>怪盜「霧影狐」偷走了願望之石。與同伴合作、解開地理線索，找回它吧。</p><button onclick="openComic(0)">閱讀故事</button> <button class="gold" onclick="startGame()">開始冒險</button></article><article class="card"><h2>🌦️ 香港即時天氣（教師示範）</h2><p>氣溫：<b>${data.settings.temp}</b>　濕度：<b>${data.settings.humidity}</b></p></article><article class="card"><h2>📰 地理新聞速報</h2><div class="announcement"><b>${data.news[0].title}</b><p>${data.news[0].summary}</p></div></article></section><section class="card" style="margin-top:16px"><h2>🧭 我的地圖</h2><p><b>${esc(me.name)}</b>（${esc(me.className)}） <span class="sync-status">☁️ Firebase 帳戶已同步</span></p><p><span class="badge">💰 ${me.coins} 金幣</span><span class="badge">❤️ 3 生命</span></p><button class="gold" onclick="startGame()">進入中${me.grade}地圖</button> <button class="soft" onclick="shop()">🛒 商店</button></section></main>`)}
function teacherPanel(){app(nav()+`<main class="page"><h1>👩‍🏫 教師控制台</h1><p><span class="sync-status">🔒 Firebase 教師權限已確認</span></p><div class="tools"><button onclick="teacherTab('overview')">控制台總覽</button><button onclick="teacherTab('questions')">題庫／編輯</button><button onclick="teacherTab('news')">新聞速報</button><button onclick="teacherTab('results')">學生成績</button><button onclick="teacherTab('chat')">私訊回覆</button><button onclick="teacherTab('shop')">商店管理</button></div><div id="teacherContent"></div></main>`);teacherTab('overview')}
async function teacherTab(tab){const c=document.getElementById('teacherContent');if(!c)return;if(tab==='shop'){c.innerHTML=`<section class="card"><h2 id="shopEditorTitle">新增商店商品</h2><input id="shopEditId" type="hidden"><div class="grid"><label class="field">商品名稱<input id="shopName" placeholder="例如：探險家帽章"></label><label class="field">價格（金幣）<input id="shopCost" type="number" min="0" step="1" placeholder="例如：100"></label></div><label class="field">商品說明<textarea id="shopDesc" placeholder="例如：給認真觀察者的獎勵"></textarea></label><label class="field">圖片網址（可留空）<input id="shopImg" type="url" placeholder="https://..."></label><button class="gold" onclick="saveShopItem()">儲存商品</button><button id="shopCancelEdit" class="soft" onclick="resetShopEditor()">取消修改</button><p class="hint">商品會儲存到 Firestore <code>shopItems</code>。學生端重新開啟商店後會讀取最新商品。</p></section><section class="card"><h2>雲端商店商品</h2><button onclick="loadShopManagement()">重新讀取商品</button><div id="shopManageList" class="hint">正在讀取 Firestore shopItems…</div></section>`;await loadShopManagement();return}const text={overview:['控制台總覽','教師 Firebase 登入已完成。'],questions:['題庫／編輯','題庫功能將使用 Firestore questions collection。'],news:['新聞速報','新聞速報雲端同步將在後續版本啟用。'],results:['學生成績','成績及題目分析雲端同步將在後續版本啟用。'],chat:['私訊回覆','一對一私訊雲端同步將在後續版本啟用。']}[tab]||['控制台','請選擇功能。'];c.innerHTML=`<section class="card"><h2>${text[0]}</h2><p>${text[1]}</p><p class="hint">目前登入帳戶：${esc(me.email||'')}；角色：${esc(me.role)}</p></section>`}
async function saveShopItem(){try{if(!me||me.role!=='teacher')throw new Error('沒有教師權限。');const f=await waitFirebase(),name=document.getElementById('shopName').value.trim(),costText=document.getElementById('shopCost').value.trim(),desc=document.getElementById('shopDesc').value.trim(),img=document.getElementById('shopImg').value.trim(),cost=Number(costText);if(!name)throw new Error('請輸入商品名稱。');if(costText===''||!Number.isFinite(cost)||cost<0||!Number.isInteger(cost))throw new Error('價格必須是 0 或以上的整數。');const payload={name,cost,desc,img,updatedAt:f.serverTimestamp(),updatedBy:me.uid},editId=document.getElementById('shopEditId').value;if(editId)await f.updateDoc(f.doc(f.firestore,'shopItems',editId),payload);else await f.addDoc(f.collection(f.firestore,'shopItems'),{...payload,createdAt:f.serverTimestamp(),createdBy:me.uid});resetShopEditor();await loadShopManagement();alert('商品已儲存。')}catch(e){alert(e.message&&!e.code?e.message:firebaseError(e))}}function resetShopEditor(){if(!document.getElementById('shopEditId'))return;document.getElementById('shopEditId').value='';document.getElementById('shopEditorTitle').textContent='新增商店商品';document.getElementById('shopName').value='';document.getElementById('shopCost').value='';document.getElementById('shopDesc').value='';document.getElementById('shopImg').value=''}async function loadShopManagement(){const out=document.getElementById('shopManageList');if(!out)return;out.textContent='正在讀取 Firestore shopItems…';try{const f=await waitFirebase(),snap=await f.getDocs(f.collection(f.firestore,'shopItems')),items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(a.cost)||0)-(Number(b.cost)||0)||String(a.name||'').localeCompare(String(b.name||'')));if(!items.length){out.innerHTML='<p class="hint">尚未有商品。請在上方新增第一件商品。</p>';return}out.innerHTML=`<table><tr><th>商品</th><th>價格</th><th>說明</th><th>文件 ID</th><th>操作</th></tr>${items.map(s=>`<tr><td><b>${esc(s.name||'未命名商品')}</b>${s.img?`<br><a href="${esc(s.img)}" target="_blank" rel="noopener">查看圖片</a>`:''}</td><td>💰 ${esc(s.cost)}</td><td>${esc(s.desc||'')}</td><td class="hint">${esc(s.id)}</td><td><button onclick="editShopItem('${s.id}')">修改</button><button class="danger" onclick="deleteShopItem('${s.id}')">刪除</button></td></tr>`).join('')}</table>`}catch(e){out.innerHTML=`<p class="error">${esc(firebaseError(e))}</p>`}}async function editShopItem(id){try{const f=await waitFirebase(),snap=await f.getDoc(f.doc(f.firestore,'shopItems',id));if(!snap.exists())throw new Error('找不到此商品。');const s=snap.data();document.getElementById('shopEditId').value=id;document.getElementById('shopEditorTitle').textContent='修改商店商品：'+id;document.getElementById('shopName').value=s.name||'';document.getElementById('shopCost').value=Number.isFinite(Number(s.cost))?Number(s.cost):'';document.getElementById('shopDesc').value=s.desc||'';document.getElementById('shopImg').value=s.img||'';window.scrollTo({top:0,behavior:'smooth'})}catch(e){alert(e.message&&!e.code?e.message:firebaseError(e))}}async function deleteShopItem(id){if(!confirm('確定要刪除這件商品嗎？此動作不能復原。'))return;try{const f=await waitFirebase();await f.deleteDoc(f.doc(f.firestore,'shopItems',id));alert('商品已刪除。');await loadShopManagement()}catch(e){alert(firebaseError(e))}}
function openComic(p){comicPage=Math.max(0,Math.min(COMIC.length-1,p));const x=COMIC[comicPage],body=x.kind?`<div class="comic-intro"><h1>${esc(x.title)}</h1><p>${esc(x.text)}</p></div>`:`<div class="comic-panel"><img src="${x.img}" alt="${esc(x.title)}"><div class="comic-caption"><h2>${esc(x.title)}</h2><p>${esc(x.text)}</p></div></div>`;modal(`${body}<div class="comic-controls"><button class="soft" onclick="${comicPage?'openComic('+(comicPage-1)+')':'closeModal()'}">${comicPage?'← 上一頁':'關閉'}</button><span class="comic-progress">第 ${comicPage+1}/${COMIC.length} 頁</span><button class="gold" onclick="${comicPage===COMIC.length-1?'closeModal()':'openComic('+(comicPage+1)+')'}">${comicPage===COMIC.length-1?'開始冒險！':'下一頁 →'}</button></div>`)}function tutorial(){modal('<h2>🎮 新手引導</h2><p>用方向鍵或手機按鈕移動，點擊怪物作答。</p><button onclick="closeModal()">明白了！</button>')}async function startGame(){const f=await waitFirebase();let s=await f.getDocs(f.query(f.collection(f.firestore,'questions'),f.where('grade','==',Number(me.grade)))),qs=s.docs.map(d=>({id:d.id,...d.data()}));if(!qs.length){modal(`<h2>中${me.grade}題庫尚未準備好</h2><p>請通知教師新增 questions 的 grade: ${me.grade} 題目。</p><button onclick="closeModal()">關閉</button>`);return}game={x:45,y:70,lives:3,score:0,coins:0,idx:0,qs};app(nav()+`<main class="page"><div class="hud"><span class="badge" id="life">❤️ ❤️ ❤️</span><span class="badge" id="score">⭐ 分數：0</span><span class="badge" id="coin">💰 本局金幣：0</span><span class="badge" id="prog">進度：0/${qs.length}</span><button class="soft" onclick="shop()">商店</button><button class="soft" onclick="home()">返回主頁</button></div><div class="map"><div class="road" style="left:5%;top:42%;width:88%;height:32px"></div><div class="road" style="left:47%;top:10%;width:32px;height:76%"></div><div class="sign" style="left:7%;top:29%">🪧<div class="hint">中${me.grade}地理島</div></div><div class="npc" style="left:18%;top:58%" onclick="clue()">🦉<div class="hint">貓頭鷹老師</div></div><div class="monster" style="left:72%;top:65%" onclick="encounter()">👾<div class="hint">迷途小怪</div></div><div class="player" id="player" style="left:45%;top:70%">🧑‍🚀</div><div class="mapnote">點擊怪物開始作答；點擊 NPC 取得線索。</div></div><div class="move"><button onclick="move(0,-1)">▲</button><button onclick="move(-1,0)">◀</button><button onclick="move(1,0)">▶</button><button onclick="move(0,1)">▼</button></div></main>`)}function move(dx,dy){if(!game)return;game.x=Math.max(2,Math.min(92,game.x+dx*4));game.y=Math.max(2,Math.min(88,game.y+dy*4));const p=document.getElementById('player');if(p){p.style.left=game.x+'%';p.style.top=game.y+'%'}}function clue(){modal('<h2>🦉 地理線索</h2><p>仔細觀察天氣、地圖、自然環境與人類活動。</p><button onclick="closeModal()">繼續探索</button>')}function encounter(){if(game&&game.idx<game.qs.length)ask(game.qs[game.idx])}function ask(q){modal(`<h2>⚔️ 地理挑戰</h2><p><b>${esc(q.text)}</b></p><div class="answers">${(q.options||[]).map((o,i)=>`<button onclick="answer(${i})">${esc(o)}</button>`).join('')}</div>`)}function answer(i){const q=game.qs[game.idx],ok=(q.options||[])[i]===q.answer;game.idx++;if(ok){game.coins+=50;game.score+=100;modal('<h2>✨ 答對了！</h2><button onclick="closeModal()">繼續</button>')}else{game.lives--;modal('<h2>💫 再接再厲！</h2><p>正確答案：'+esc(q.answer)+'</p><button onclick="closeModal()">繼續</button>')}if(game.idx>=game.qs.length)setTimeout(finish,300)}function finish(){me.coins+=game.coins;syncProfile();game=null;modal('<h2>🏆 完成！</h2><p>金幣已同步。</p><button onclick="home()">返回主頁</button>')}async function dailyCheckin(){if(me.checkin===today()){modal('<h2>今天已簽到</h2><button onclick="closeModal()">關閉</button>');return}me.checkin=today();me.coins+=2;await syncProfile();modal('<h2>🎁 簽到成功</h2><button onclick="home()">太好了</button>')}async function shop(){modal('<h2>🛒 商店</h2><p>正在讀取商品…</p>');await loadSharedShop();modal(`<h2>🛒 商店</h2><p>你的金幣：${me.coins}</p><div class="grid">${db.shop.map(s=>`<div class="card"><b>${esc(s.name)}</b><p>${esc(s.desc||'')}</p><span class="badge">💰 ${s.cost}</span><br><button onclick="buy('${s.id}')">購買</button></div>`).join('')}</div><button class="soft" onclick="closeModal()">關閉</button>`)}async function buy(id){const s=db.shop.find(x=>x.id===id);if(!s||me.coins<s.cost){alert('金幣不足或商品不存在。');return}me.coins-=s.cost;me.purchases.push(id);await syncProfile();shop()}function readNews(){modal('<h2>📰 香港天文台天氣資訊</h2><p>'+data.news[0].summary+'</p><button onclick="closeModal()">關閉</button>')}function openChat(){modal('<h2>💬 聊天</h2><p>私訊功能稍後啟用。</p><button onclick="closeModal()">關閉</button>')}loginPage();
</script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,collection,getDocs,updateDoc,addDoc,deleteDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4",authDomain:"hk-geography-quest.firebaseapp.com",projectId:"hk-geography-quest",storageBucket:"hk-geography-quest.firebasestorage.app",messagingSenderId:"418307975863",appId:"1:418307975863:web:6e8c259e0ba723d7ec3b32"};try{const firebaseApp=initializeApp(firebaseConfig),auth=getAuth(firebaseApp),firestore=getFirestore(firebaseApp);window.firebaseServices={auth,firestore,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,doc,setDoc,getDoc,collection,getDocs,updateDoc,addDoc,deleteDoc,query,where,serverTimestamp};window.dispatchEvent(new Event('firebase-ready'))}catch(error){console.error('Firebase initialization failed:',error)}</script></body></html>
