<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港地理 Quest｜題庫及商店管理版</title><style>:root{--ink:#14233f;--blue:#2475d9;--gold:#ffc833;--green:#2faf69;--red:#e74b5b;--card:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#dff4ff;color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:bold;box-shadow:0 3px #123d77;margin:3px}.danger{background:var(--red)}.soft{background:#eaf4ff;color:var(--ink);box-shadow:0 3px #9bb8d2}.gold{background:var(--gold);color:#4b3100;box-shadow:0 3px #a66f00}.screen{min-height:100vh;padding:20px}.login{max-width:520px;margin:8vh auto;background:var(--card);padding:25px;border:4px solid var(--ink);box-shadow:8px 8px #80b2d5;border-radius:14px}.logo{text-align:center;font-size:2em;font-weight:900;color:var(--blue)}.tabs,.tools{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0}.tabs button{flex:1}.field{display:block;margin:12px 0;font-weight:bold}.field input,.field select,.field textarea{display:block;width:100%;padding:10px;margin-top:6px;border:2px solid #91a7c1;border-radius:7px;background:#fff}.field textarea{min-height:75px}.hint{font-size:.87em;color:#496078}.error{min-height:22px;color:#b21f34;font-weight:bold;white-space:pre-wrap}.topbar{position:sticky;top:0;z-index:4;background:#fffdf5;border-bottom:4px solid var(--ink);display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 18px}.topbar .brand{font-weight:900;font-size:1.2em;margin-right:auto}.page{max-width:1180px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:16px;box-shadow:5px 5px #9ec3dc}.hero{height:220px;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(#83d4ff 0 60%,#82c767 60%);padding:26px;color:#fff;text-shadow:2px 2px #19365b}.hero h1{margin:0 0 10px}.hero-badge,.badge,.sync-status{display:inline-block;background:#fff;color:var(--ink);padding:5px 8px;border-radius:5px;border:2px solid var(--ink);margin:3px}.sync-status{background:#e2f5e9;color:#12613a;border-color:#75c799}.sync-status.warn{background:#fff4d4;color:#7d5600;border-color:#e3bd57}table{width:100%;border-collapse:collapse;background:#fff;font-size:.9em}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left;vertical-align:top}th{background:#d9efff}.empty{padding:15px;background:#fff4d4;border:2px solid #e3bd57;border-radius:8px;color:#704f00}@media(max-width:600px){.screen{padding:12px}.topbar .brand{width:100%}.login{margin:3vh auto}}
</style></head><body><div id="app"></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const appConfig={apiKey:"AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4",authDomain:"hk-geography-quest.firebaseapp.com",projectId:"hk-geography-quest",storageBucket:"hk-geography-quest.firebasestorage.app",messagingSenderId:"418307975863",appId:"1:418307975863:web:6e8c259e0ba723d7ec3b32"};const firebaseApp=initializeApp(appConfig),auth=getAuth(firebaseApp),firestore=getFirestore(firebaseApp);let me=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function firebaseError(e){const code=typeof e?.code==='string'?e.code:'';return (code||'操作失敗')+'\n'+(typeof e?.message==='string'?e.message:'未知 Firebase 錯誤')}function appView(h){$('app').innerHTML=h}
function login(){appView(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><div class="tabs"><button class="gold" onclick="showLogin()">教師登入</button></div><label class="field">教師 Firebase 電郵<input id="email" type="email"></label><label class="field">密碼<input id="password" type="password" onkeydown="if(event.key==='Enter')doLogin()"></label><div id="error" class="error"></div><button class="gold" style="width:100%" onclick="doLogin()">登入</button></section></main>`)}window.showLogin=login;window.doLogin=async()=>{const e=$('email').value.trim(),p=$('password').value;if(!e||!p){$('error').textContent='請輸入電郵及密碼。';return}try{const cred=await signInWithEmailAndPassword(auth,e,p),profile=await getDoc(doc(firestore,'users',cred.user.uid));if(!profile.exists()||String(profile.data().role).toLowerCase()!=='teacher')throw new Error('此帳戶不是教師帳戶。');me={uid:cred.user.uid,email:cred.user.email,role:'teacher'};teacherPanel()}catch(x){$('error').textContent=firebaseError(x)}};window.logout=async()=>{await signOut(auth);me=null;login()};
function teacherPanel(){appView(`<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button onclick="teacherTab('overview')">控制台總覽</button><button onclick="teacherTab('questions')">題庫／編輯</button><button onclick="teacherTab('shop')">商店管理</button><button class="danger" onclick="logout()">登出</button></header><main class="page"><section class="hero"><h1>👩‍🏫 教師控制台</h1><p>Firebase 教師權限已確認。</p><span class="sync-status">${esc(me.email)}</span></section><div id="teacherContent"></div></main>`);teacherTab('overview')}
window.teacherTab=async function(tab){const c=$('teacherContent');if(!c)return;if(tab==='questions'){c.innerHTML=`<section class="card"><h2 id="questionEditorTitle">新增雲端題目</h2><input id="questionEditId" type="hidden"><div class="grid"><label class="field">適用年級<select id="questionGrade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">題型<select id="questionType"><option value="single">單選題</option><option value="multi">多項選擇題</option><option value="open">開放式題目</option></select></label><label class="field">課題<input id="questionTopic" placeholder="例如：天氣及氣候"></label><label class="field">難度<select id="questionDifficulty"><option>基本</option><option>進階</option><option>挑戰</option></select></label></div><label class="field">題目內容<textarea id="questionText"></textarea></label><label class="field">選項（每行一項）<textarea id="questionOptions"></textarea></label><label class="field">正確答案（多項選擇以 | 分隔）<input id="questionAnswer"></label><button class="gold" onclick="saveQuestionItem()">儲存題目</button><button class="soft" onclick="resetQuestionEditor()">取消修改</button></section><section class="card"><h2>雲端題庫</h2><label class="field">篩選年級<select id="questionFilter" onchange="loadQuestionItems()"><option value="all">全部年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><button onclick="loadQuestionItems()">重新讀取題庫</button><div id="questionManageList" class="hint">正在讀取…</div></section>`;await loadQuestionItems();return}if(tab==='shop'){c.innerHTML=`<section class="card"><h2 id="shopEditorTitle">新增商店商品</h2><input id="shopEditId" type="hidden"><div class="grid"><label class="field">商品名稱<input id="shopName"></label><label class="field">價格（金幣）<input id="shopCost" type="number" min="0" step="1"></label></div><label class="field">商品說明<textarea id="shopDesc"></textarea></label><label class="field">圖片網址<input id="shopImg" type="url"></label><button class="gold" onclick="saveShopItem()">儲存商品</button><button class="soft" onclick="resetShopEditor()">取消修改</button></section><section class="card"><h2>雲端商店商品</h2><button onclick="loadShopManagement()">重新讀取商品</button><div id="shopManageList" class="hint">正在讀取…</div></section>`;await loadShopManagement();return}c.innerHTML='<section class="card"><h2>控制台總覽</h2><p>題庫與商店均已接入 Firestore。</p></section>'};
window.saveQuestionItem=async()=>{try{const type=$('questionType').value,answerText=$('questionAnswer').value.trim(),payload={grade:Number($('questionGrade').value),type,topic:$('questionTopic').value.trim()||'未分類',difficulty:$('questionDifficulty').value,text:$('questionText').value.trim(),options:$('questionOptions').value.split('\n').map(x=>x.trim()).filter(Boolean),answer:type==='multi'?answerText.split('|').map(x=>x.trim()).filter(Boolean):answerText,updatedAt:serverTimestamp(),updatedBy:me.uid};if(!payload.text)throw new Error('請輸入題目內容。');if(type!=='open'&&(!payload.options.length||!payload.answer))throw new Error('單選題或多項選擇題需要選項和答案。');const id=$('questionEditId').value;if(id)await updateDoc(doc(firestore,'questions',id),payload);else await addDoc(collection(firestore,'questions'),{...payload,createdAt:serverTimestamp(),createdBy:me.uid});resetQuestionEditor();await loadQuestionItems();alert('題目已儲存。')}catch(e){alert(firebaseError(e))}};window.resetQuestionEditor=()=>{if(!$('questionEditId'))return;$('questionEditId').value='';$('questionEditorTitle').textContent='新增雲端題目';$('questionGrade').value='1';$('questionType').value='single';$('questionTopic').value='';$('questionDifficulty').value='基本';$('questionText').value='';$('questionOptions').value='';$('questionAnswer').value=''};
window.loadQuestionItems=async()=>{const out=$('questionManageList');if(!out)return;try{const snap=await getDocs(collection(firestore,'questions')),filter=$('questionFilter').value,items=snap.docs.map(d=>({id:d.id,...d.data()})).filter(q=>filter==='all'||String(q.grade)===filter).sort((a,b)=>(a.grade-b.grade)||String(a.topic||'').localeCompare(String(b.topic||'')));out.innerHTML=items.length?`<table><tr><th>年級</th><th>課題／題目</th><th>類型</th><th>答案</th><th>操作</th></tr>${items.map(q=>`<tr><td>中${esc(q.grade)}</td><td><b>${esc(q.topic)}</b><br>${esc(q.text)}</td><td>${esc(q.type)}</td><td>${esc(Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'開放式'))}</td><td><button onclick="editQuestionItem('${q.id}')">修改</button><button class="danger" onclick="deleteQuestionItem('${q.id}')">刪除</button></td></tr>`).join('')}</table>`:'<div class="empty">此篩選下沒有題目。</div>'}catch(e){out.innerHTML='<p class="error">'+esc(firebaseError(e))+'</p>'}};window.editQuestionItem=async id=>{try{const s=await getDoc(doc(firestore,'questions',id));if(!s.exists())throw new Error('找不到題目。');const q=s.data();$('questionEditId').value=id;$('questionEditorTitle').textContent='修改題目：'+id;$('questionGrade').value=q.grade;$('questionType').value=q.type||'single';$('questionTopic').value=q.topic||'';$('questionDifficulty').value=q.difficulty||'基本';$('questionText').value=q.text||'';$('questionOptions').value=(q.options||[]).join('\n');$('questionAnswer').value=Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'');scrollTo({top:0,behavior:'smooth'})}catch(e){alert(firebaseError(e))}};window.deleteQuestionItem=async id=>{if(!confirm('確定刪除這條題目？'))return;try{await deleteDoc(doc(firestore,'questions',id));await loadQuestionItems();alert('題目已刪除。')}catch(e){alert(firebaseError(e))}};
window.saveShopItem=async()=>{try{const name=$('shopName').value.trim(),cost=Number($('shopCost').value),payload={name,cost,desc:$('shopDesc').value.trim(),img:$('shopImg').value.trim(),updatedAt:serverTimestamp(),updatedBy:me.uid};if(!name||!Number.isInteger(cost)||cost<0)throw new Error('請輸入商品名稱及有效整數價格。');const id=$('shopEditId').value;if(id)await updateDoc(doc(firestore,'shopItems',id),payload);else await addDoc(collection(firestore,'shopItems'),{...payload,createdAt:serverTimestamp(),createdBy:me.uid});resetShopEditor();await loadShopManagement();alert('商品已儲存。')}catch(e){alert(firebaseError(e))}};window.resetShopEditor=()=>{if(!$('shopEditId'))return;$('shopEditId').value='';$('shopEditorTitle').textContent='新增商店商品';$('shopName').value='';$('shopCost').value='';$('shopDesc').value='';$('shopImg').value=''};window.loadShopManagement=async()=>{const out=$('shopManageList');if(!out)return;try{const s=await getDocs(collection(firestore,'shopItems')),items=s.docs.map(d=>({id:d.id,...d.data()}));out.innerHTML=items.length?`<table><tr><th>商品</th><th>價格</th><th>說明</th><th>操作</th></tr>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cost)}</td><td>${esc(x.desc||'')}</td><td><button onclick="editShopItem('${x.id}')">修改</button><button class="danger" onclick="deleteShopItem('${x.id}')">刪除</button></td></tr>`).join('')}</table>`:'<div class="empty">尚未有商品。</div>'}catch(e){out.innerHTML='<p class="error">'+esc(firebaseError(e))+'</p>'}};window.editShopItem=async id=>{const s=await getDoc(doc(firestore,'shopItems',id));if(!s.exists())return;const x=s.data();$('shopEditId').value=id;$('shopEditorTitle').textContent='修改商品：'+id;$('shopName').value=x.name||'';$('shopCost').value=x.cost||'';$('shopDesc').value=x.desc||'';$('shopImg').value=x.img||'';scrollTo({top:0,behavior:'smooth'})};window.deleteShopItem=async id=>{if(!confirm('確定刪除商品？'))return;await deleteDoc(doc(firestore,'shopItems',id));await loadShopManagement()};login();
</script></body></html>
