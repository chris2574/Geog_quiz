<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港地理 Quest｜Firebase 教師登入修復版</title><style>
:root{--ink:#14233f;--blue:#2475d9;--gold:#ffc833;--green:#2faf69;--red:#e74b5b;--card:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#dff4ff;color:var(--ink);font-family:ui-monospace,Consolas,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:bold;box-shadow:0 3px 0 #123d77}button:active{transform:translateY(2px);box-shadow:0 1px 0 #123d77}.soft{background:#eaf4ff;color:var(--ink);box-shadow:0 3px 0 #9bb8d2}.gold{background:var(--gold);color:#4b3100;box-shadow:0 3px 0 #a66f00}.danger{background:var(--red)}.screen{min-height:100vh;padding:20px}.login{max-width:540px;margin:7vh auto;background:var(--card);padding:25px;border:4px solid var(--ink);box-shadow:8px 8px 0 #80b2d5;border-radius:14px}.logo{text-align:center;font-size:2em;font-weight:900;color:var(--blue)}.tabs,.tools,.hud{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0}.tabs button{flex:1}.field{display:block;margin:12px 0;font-weight:bold}.field input,.field select,.field textarea{display:block;width:100%;padding:10px;margin-top:6px;border:2px solid #91a7c1;border-radius:7px;background:#fff}.hint{font-size:.87em;color:#496078}.error{min-height:24px;color:#b21f34;font-weight:bold;white-space:pre-wrap}.ok{color:#12613a;background:#e2f5e9;border:1px solid #75c799;padding:9px;border-radius:6px}.topbar{position:sticky;top:0;z-index:4;background:#fffdf5;border-bottom:4px solid var(--ink);display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 18px}.topbar .brand{font-weight:900;font-size:1.2em;margin-right:auto}.page{max-width:1120px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:16px;box-shadow:5px 5px 0 #9ec3dc}.hero{height:230px;border:4px solid var(--ink);border-radius:12px;background:linear-gradient(#83d4ff 0 60%,#82c767 60%);position:relative;padding:26px;color:#fff;text-shadow:2px 2px #19365b;overflow:hidden}.hero:after{content:"";position:absolute;bottom:20px;left:8%;right:8%;height:64px;background:#5d9a58;clip-path:polygon(0 100%,18% 30%,28% 70%,45% 0,60% 70%,75% 20%,100% 100%)}.hero>*{position:relative;z-index:1}.badge{display:inline-block;background:#fff;color:var(--ink);padding:4px 7px;border-radius:5px;border:2px solid var(--ink);margin:3px}.sync{font-size:.85em;padding:5px 8px;border-radius:5px;background:#e2f5e9;color:#12613a;border:1px solid #75c799}.modal{position:fixed;z-index:10;inset:0;background:#0009;display:grid;place-items:center;padding:14px}.dialog{max-width:700px;width:100%;max-height:90vh;overflow:auto;background:#fffdf5;border:4px solid var(--ink);border-radius:12px;padding:20px}.map{height:440px;position:relative;overflow:hidden;background:linear-gradient(#7fd4ff 0 30%,#8ed176 30% 100%);border:4px solid var(--ink);border-radius:12px}.player,.npc,.monster{position:absolute;font-size:34px;text-align:center;cursor:pointer}.player{transition:left .1s,top .1s}.road{position:absolute;background:#dfc482;border:3px solid #987c49;border-radius:20px}.move{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:12px}.move button{padding:10px}.move button:first-child{grid-column:2}.move button:last-child{grid-column:2}.answers{display:grid;gap:9px}.bar{height:16px;background:#d5e3ed;border:2px solid var(--ink);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.urgent{animation:flash .65s infinite}@keyframes flash{50%{background:#ff3652;color:#fff}}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left}th{background:#d9efff}.chat{height:220px;overflow:auto;background:#edf7ff;border:2px solid #8eacc7;padding:8px;border-radius:7px}.comic-panel{position:relative;overflow:hidden;background:#071328;border:4px solid var(--ink);border-radius:12px}.comic-panel img{width:100%;max-height:60vh;object-fit:contain;display:block}.comic-caption{position:absolute;top:12px;left:12px;right:12px;background:#071328e8;border-left:5px solid var(--gold);color:#fff;padding:10px;border-radius:6px}.comic-caption h2{color:#ffe184;margin:0 0 4px}.comic-caption p{margin:0}.comic-controls{display:flex;justify-content:space-between;gap:8px;margin-top:10px;align-items:center}.hidden{display:none!important}@media(max-width:600px){.screen{padding:12px}.login{margin:3vh auto}.topbar .brand{width:100%}.hero{height:200px}.map{height:380px}.comic-caption{font-size:.8em}}
</style></head><body><div id="app"></div><div id="modal"></div><script type="module">
import {initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,collection,getDocs,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4",authDomain:"hk-geography-quest.firebaseapp.com",projectId:"hk-geography-quest",storageBucket:"hk-geography-quest.firebasestorage.app",messagingSenderId:"418307975863",appId:"1:418307975863:web:6e8c259e0ba723d7ec3b32"};
const fb={};let firebaseInitError=null;try{fb.app=initializeApp(firebaseConfig);fb.auth=getAuth(fb.app);fb.db=getFirestore(fb.app);fb.ready=true}catch(e){firebaseInitError=e;fb.ready=false}
const KEY='hkgeoquest_v4';const base={shop:[{id:'s1',name:'探險家帽章',cost:80,desc:'像素探險家紀念飾品'},{id:'s2',name:'地圖放大鏡',cost:120,desc:'給認真觀察者的獎勵'}],questions:{1:[{id:'q1',text:'香港夏季普遍炎熱潮濕，主要受哪一種季風影響？',options:['東南季風','西北季風','極地東風','信風'],answer:'東南季風'},{id:'q2',text:'地圖上的圖例主要有甚麼用途？',options:['說明符號意思','量度溫度','記錄人物名稱','改變比例'],answer:'說明符號意思'}],2:[{id:'q3',text:'河流上游通常有甚麼特徵？',options:['坡度較陡、流速較快','河道最闊','沉積最多','水流靜止'],answer:'坡度較陡、流速較快'}],3:[{id:'q4',text:'可持續發展最強調甚麼？',options:['兼顧現在需要與未來世代','只追求短期利潤','完全停止發展','只重視單一群體'],answer:'兼顧現在需要與未來世代'}]}};let db=JSON.parse(localStorage.getItem(KEY)||'null')||base,me=null,game=null,comicPage=0;
const COMIC=[{title:'《願望之石：地理 Quest 的開始》',text:'在香港這座山海相連的城市裡，願望之石會因為好奇心、合作和愛護環境而發光。',intro:true},{img:'dreamina-2026-08-16-7070-Beautiful-anime-style-mystery-adventure.jpg',title:'第一頁：圖書館裡的發現',text:'學生和老師研究神秘的發光導航儀。'},{img:'dreamina-2026-08-16-2782-Dynamic-anime-style-key-visual-manga-sp.jpg',title:'第二頁：怪盜現身',text:'霧影狐帶走了願望之石，留下地理線索。'}];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const modal=h=>$('modal').innerHTML=h?`<div class="modal"><div class="dialog">${h}</div></div>`:'';const closeModal=()=>modal('');const today=()=>new Date().toISOString().slice(0,10);
function studentEmail(name){let b=new TextEncoder().encode(name.trim().normalize('NFKC').toLowerCase()),h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return 'student_'+h+'@hkgeographyquest.student'}
function errText(e){let map={'auth/invalid-credential':'帳戶／電郵或密碼不正確。','auth/user-not-found':'帳戶／電郵或密碼不正確。','auth/wrong-password':'帳戶／電郵或密碼不正確。','auth/email-already-in-use':'此學生帳戶已存在。','auth/network-request-failed':'網絡連線失敗。','permission-denied':'Firestore Rules 拒絕存取。'};return map[e?.code]||`${e?.code||'錯誤'}：${e?.message||'未知錯誤'}`}
async function profile(uid){let s=await getDoc(doc(fb.db,'users',uid));return s.exists()?s.data():null}
function renderLogin(tab='student',note=''){app(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><p class="hint">8-bit 地理冒險學習平台 · 尋回被怪盜偷走的願望之石！</p><div class="tabs"><button onclick="renderLogin('student')">學生登入</button><button class="soft" onclick="renderLogin('register')">學生申請帳戶</button><button class="gold" onclick="renderLogin('teacher')">教師登入</button></div><div id="auth"></div></section></main>`);let body='';if(tab==='teacher')body=`<h2>教師 Firebase 登入</h2><label class="field">教師電郵<input id="email" type="email" autocomplete="username"></label><label class="field">密碼<input id="pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')teacherLogin()"></label><div id="status" class="error">${esc(note)}</div><button class="gold" style="width:100%" onclick="teacherLogin()">教師登入</button><p class="hint">此修復版本會顯示實際 UID 和錯誤，方便檢查權限。</p>`;else if(tab==='register')body=`<label class="field">學生姓名（中文或英文）<input id="name"></label><label class="field">班別<select id="cls">${['1A','1B','1C','1D','2A','2B','2C','2D','3A','3B','3C','3D'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">密碼<input id="pass" type="password"></label><div id="status" class="error">${esc(note)}</div><button style="width:100%" onclick="registerStudent()">申請帳戶</button>`;else body=`<label class="field">學生姓名<input id="name"></label><label class="field">密碼<input id="pass" type="password" onkeydown="if(event.key==='Enter')studentLogin()"></label><div id="status" class="error">${esc(note)}</div><button style="width:100%" onclick="studentLogin()">登入</button>`;$('auth').innerHTML=body}
async function teacherLogin(){let email=$('email').value.trim(),pass=$('pass').value;if(!email||!pass){$('status').textContent='請輸入電郵和密碼。';return}$('status').textContent='正在登入 Firebase…';try{let cred=await signInWithEmailAndPassword(fb.auth,email,pass);$('status').textContent='Firebase 登入成功，正在讀取教師 profile…';let p=await profile(cred.user.uid);if(!p){await signOut(fb.auth);$('status').textContent=`找不到 users/${cred.user.uid} 文件。請確認 Firestore document ID 完全相同。`;return}if(String(p.role||'').toLowerCase()!=='teacher'){await signOut(fb.auth);$('status').textContent=`角色不是 teacher。目前 role：${p.role||'未設定'}；UID：${cred.user.uid}`;return}me={uid:cred.user.uid,email,name:p.displayName||'地理老師',role:'teacher',className:p.className||'教師',grade:p.grade||0,coins:p.coins||0};teacherHome()}catch(e){$('status').textContent=errText(e)}}
async function studentLogin(){let name=$('name').value.trim(),pass=$('pass').value;if(!name||!pass){$('status').textContent='請輸入姓名和密碼。';return}try{let c=await signInWithEmailAndPassword(fb.auth,studentEmail(name),pass),p=await profile(c.user.uid);if(!p)throw{code:'permission-denied',message:'找不到學生 profile'};me={uid:c.user.uid,name:p.displayName,role:'student',className:p.className,grade:p.grade,coins:p.coins||0,purchases:p.purchases||[],checkInDate:p.checkInDate||''};studentHome()}catch(e){$('status').textContent=errText(e)}}
async function registerStudent(){let name=$('name').value.trim(),cls=$('cls').value,pass=$('pass').value;if(!/^[A-Za-z\u4e00-\u9fff][A-Za-z\u4e00-\u9fff .'-]{1,39}$/.test(name)){$('status').textContent='姓名需為 2–40 個中英文字符。';return}if(!/(?=.*[A-Za-z])(?=(?:.*\d){6,}).{7,}/.test(pass)){$('status').textContent='密碼需要至少一個英文字及六位數字。';return}try{let c=await createUserWithEmailAndPassword(fb.auth,studentEmail(name),pass),grade=+cls[0];await setDoc(doc(fb.db,'users',c.user.uid),{displayName:name,className:cls,grade,role:'student',coins:2,purchases:[],checkInDate:'',createdAt:serverTimestamp()});me={uid:c.user.uid,name,role:'student',className:cls,grade,coins:2,purchases:[],checkInDate:''};studentHome()}catch(e){$('status').textContent=errText(e)}}
async function logout(){await signOut(fb.auth);me=null;renderLogin()}
function nav(){return `<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button class="soft" onclick="${me.role==='teacher'?'teacherHome()':'studentHome()'}">主頁</button>${me.role==='teacher'?'<button class="gold" onclick="teacherPanel()">教師控制台</button>':'<button class="soft" onclick="shop()">🛒 商店</button>'}<button class="danger" onclick="logout()">登出</button></header>`}
function teacherHome(){app(nav()+`<main class="page"><section class="hero"><h1>教師首頁</h1><p>你好，${esc(me.name)}。Firebase 教師身份已驗證。</p><span class="badge">UID：${esc(me.uid)}</span></section><section class="grid" style="margin-top:16px"><article class="card"><h2>👩‍🏫 教師控制台</h2><p>只有 Firestore profile 中 role = teacher 的使用者可進入。</p><button class="gold" onclick="teacherPanel()">前往教師控制台</button></article><article class="card"><h2>☁️ 帳戶狀態</h2><p class="ok">已成功以 Firebase Authentication 和 Firestore 教師 profile 登入。</p></article></section></main>`)}
function teacherPanel(){app(nav()+`<main class="page"><h1>👩‍🏫 教師控制台</h1><p class="ok">🔒 教師權限已確認：${esc(me.email)}</p><div class="tools"><button onclick="teacherSection('overview')">總覽</button><button onclick="teacherSection('questions')">題庫／編輯</button><button onclick="teacherSection('news')">新聞速報</button><button onclick="teacherSection('results')">學生成績</button><button onclick="teacherSection('chat')">私訊回覆</button><button onclick="teacherSection('shop')">商店管理</button></div><div id="content"></div></main>`);teacherSection('overview')}
function teacherSection(x){let data={overview:['總覽','教師 Firebase 登入及角色權限已完成。'],questions:['題庫／編輯','下一版本會接入 Firebase 題庫。'],news:['新聞速報','下一版本會接入 Firebase 新聞速報。'],results:['學生成績','下一版本會接入 Firebase 遊玩紀錄與分析。'],chat:['私訊回覆','下一版本會接入 Firebase 一對一私訊。'],shop:['商店管理','共用商店資料目前可使用 Firestore shopItems collection。']}[x];$('content').innerHTML=`<section class="card"><h2>${data[0]}</h2><p>${data[1]}</p></section>`}
function studentHome(){app(nav()+`<main class="page"><section class="hero"><h1>香港自然景觀：山海相連</h1><p>💡 留意山地、海岸與人類活動的關係。</p><span class="badge">香港自然景觀</span></section><section class="grid" style="margin-top:16px"><article class="card"><h2>📖 漫畫式劇情</h2><p>怪盜霧影狐偷走願望之石。與同伴合作、解開地理線索吧！</p><button onclick="comic(0)">閱讀故事</button> <button class="gold" onclick="startGame()">開始冒險</button></article><article class="card"><h2>🧭 我的地圖</h2><p><b>${esc(me.name)}</b>（${esc(me.className)}）</p><p><span class="badge">💰 ${me.coins||0} 金幣</span><span class="badge">中${me.grade}</span></p><button class="gold" onclick="startGame()">進入中${me.grade}地圖</button> <button class="soft" onclick="shop()">🛒 商店</button></article></section></main>`)}
function comic(i){let x=COMIC[i],b=x.intro?`<section class="card"><h1>${esc(x.title)}</h1><p>${esc(x.text)}</p></section>`:`<div class="comic-panel"><img src="${x.img}" alt="${esc(x.title)}"><div class="comic-caption"><h2>${esc(x.title)}</h2><p>${esc(x.text)}</p></div></div>`;modal(`${b}<div class="comic-controls"><button class="soft" onclick="${i?'comic('+(i-1)+')':'closeModal()'}">${i?'← 上一頁':'關閉'}</button><b>第 ${i+1}/${COMIC.length} 頁</b><button class="gold" onclick="${i<COMIC.length-1?'comic('+(i+1)+')':'closeModal()'}">${i<COMIC.length-1?'下一頁 →':'開始冒險！'}</button></div>`)}
function startGame(){let qs=base.questions[me.grade]||[];game={x:45,y:70,lives:3,score:0,coins:0,i:0,qs};app(nav()+`<main class="page"><div class="hud"><span class="badge" id="life">❤️❤️❤️</span><span class="badge" id="score">⭐ 0</span><span class="badge" id="coin">💰 0</span><button class="soft" onclick="studentHome()">返回主頁</button></div><div class="map"><div class="road" style="left:5%;top:45%;width:88%;height:30px"></div><div class="npc" style="left:18%;top:60%" onclick="modal('<h2>🦉 線索</h2><p>仔細觀察地圖、天氣和人類活動的關係。</p><button onclick=closeModal()>繼續</button>')">🦉<div class="hint">貓頭鷹老師</div></div><div class="monster" style="left:70%;top:55%" onclick="ask()">👾<div class="hint">迷途小怪</div></div><div class="player" id="player" style="left:45%;top:70%">🧑‍🚀</div></div><div class="move"><button onclick="move(0,-1)">▲</button><button onclick="move(-1,0)">◀</button><button onclick="move(1,0)">▶</button><button onclick="move(0,1)">▼</button></div></main>`)}
function move(dx,dy){game.x=Math.max(2,Math.min(92,game.x+dx*4));game.y=Math.max(2,Math.min(88,game.y+dy*4));$('player').style.left=game.x+'%';$('player').style.top=game.y+'%'}function ask(){if(game.i>=game.qs.length){finish();return}let q=game.qs[game.i],t=30;modal(`<h2>⚔️ 地理挑戰</h2><div id="timer">⏱️ 30 秒</div><div class="bar"><i id="bar" style="width:100%"></i></div><p><b>${esc(q.text)}</b></p><div class="answers">${q.options.map(o=>`<button onclick="answer('${q.id}','${encodeURIComponent(o)}')">${esc(o)}</button>`).join('')}</div>`);window.timer=setInterval(()=>{t--;let el=$('timer');if(!el)return clearInterval(window.timer);el.textContent='⏱️ '+t+' 秒';$('bar').style.width=t/30*100+'%';if(t<=10)el.className='urgent';if(t<=0){clearInterval(window.timer);answer(q.id,'',true)}},1000)}function answer(qid,v,timeout){clearInterval(window.timer);let q=game.qs.find(q=>q.id===qid),ok=decodeURIComponent(v||'')===q.answer;game.i++;if(ok){game.score+=100;game.coins+=50;modal('<h2>✨ 答對了！</h2><p>獲得 50 金幣。</p><button onclick="closeModal()">繼續</button>')}else{game.lives--;modal(`<h2>${timeout?'⏰ 時間到了！':'💫 再接再厲！'}</h2><p>答案：${esc(q.answer)}</p><button onclick="${game.lives?'closeModal()':'startGame()'}">繼續</button>`)}$('life').textContent='❤️'.repeat(game.lives)+'🖤'.repeat(3-game.lives);$('score').textContent='⭐ '+game.score;$('coin').textContent='💰 '+game.coins;if(game.i>=game.qs.length&&game.lives)setTimeout(finish,300)}async function finish(){me.coins+=game.coins;try{await updateDoc(doc(fb.db,'users',me.uid),{coins:me.coins,updatedAt:serverTimestamp()})}catch(e){}modal(`<h2>🏆 完成！</h2><p>本局獲得 ${game.coins} 金幣。</p><button onclick="studentHome()">返回主頁</button>`)}
async function shop(){let items=db.shop;try{let s=await getDocs(collection(fb.db,'shopItems'));if(!s.empty)items=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}modal(`<h2>🛒 地理商店</h2><p>金幣：${me.coins}</p><div class="grid">${items.map(x=>`<div class="card"><b>${esc(x.name)}</b><p>${esc(x.desc||'')}</p><span class="badge">💰 ${x.cost}</span></div>`).join('')}</div><button onclick="closeModal()">關閉</button>`)}
if(!fb.ready)renderLogin('teacher','Firebase 初始化失敗：'+firebaseInitError?.message);else renderLogin();
</script></body></html>
