;padding:26px;color:#fff;text-shadow:2px 2px #19365b}.hero:before{content:"";position:absolute;inset:auto 8% 20px 8%;height:65px;background:#5d9a58;clip-path:polygon(0 100%,18% 30%,28% 70%,45% 0,60% 70%,75% 20%,100% 100%)}.hero h1,.hero p{position:relative;z-index:1;margin:0 0 10px}.hero .hero-badge{position:relative;z-index:1;display:inline-block;background:#fff;color:var(--ink);padding:5px 8px;border-radius:5px;border:2px solid var(--ink);margin:0;text-shadow:none;line-height:1.15;white-space:nowrap}.badge{display:inline-block;background:#fff;color:var(--ink);padding:4px 7px;border-radius:5px;border:2px solid var(--ink);margin:3px}.ticker{background:#152b50;color:#fff;padding:9px;border-radius:7px;white-space:nowrap;overflow:hidden}.map{height:530px;position:relative;overflow:hidden;background:linear-gradient(#7fd4ff 0 30%,#8ed176 30% 100%);border:4px solid var(--ink);border-radius:12px}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,#64b457 32px 34px),repeating-linear-gradient(90deg,transparent 0 31px,#64b457 32px 34px);opacity:.42}.road{position:absolute;background:#dfc482;border:3px solid #987c49;border-radius:20px}.player,.npc,.monster,.sign{position:absolute;z-index:2;text-align:center;font-size:34px;line-height:36px;user-select:none}.player{transition:left .09s,top .09s}.npc,.monster{cursor:pointer}.sign{font-size:27px}.mapnote{position:absolute;z-index:3;bottom:10px;left:10px;background:#fffdf5;border:2px solid var(--ink);padding:7px;border-radius:6px}.move{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:13px}.move button{padding:10px}.move button:first-child{grid-column:2}.move button:last-child{grid-column:2}.modal{position:fixed;z-index:10;inset:0;background:#0009;display:grid;place-items:center;padding:14px}.dialog{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:#fffdf5;border:4px solid var(--ink);border-radius:12px;padding:20px}.answers{display:grid;gap:10px}.answers button{text-align:left}.bar{height:16px;background:#d5e3ed;border:2px solid var(--ink);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}.urgent{animation:flash .65s infinite;background:#ffdae0!important}@keyframes flash{50%{background:#ff3652!important;color:#fff}}table{width:100%;border-collapse:collapse;background:#fff;font-size:.9em}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left}th{background:#d9efff}.chat{height:240px;overflow:auto;background:#edf7ff;border:2px solid #8eacc7;padding:8px;border-radius:7px}.msg{padding:7px;margin:6px 0;background:#fff;border-radius:6px}.msg.mine{background:#d5f3df;margin-left:15%}.bannerimg{max-height:180px;max-width:100%;object-fit:cover;border-radius:7px}.question-media{max-width:100%;max-height:210px;border:2px solid var(--ink);border-radius:6px;cursor:zoom-in}.announcement{background:#fff5c7;border-left:5px solid var(--gold);padding:10px;border-radius:5px}.comic-panel{position:relative;overflow:hidden;background:#071328;border:4px solid var(--ink);border-radius:12px;min-height:360px}.comic-panel img{width:100%;display:block;max-height:62vh;object-fit:contain;background:#061126}.comic-caption{position:absolute;top:14px;left:14px;right:14px;background:linear-gradient(90deg,#071328f5,#071328cf);border-left:5px solid var(--gold);color:#fff;padding:12px 14px;border-radius:6px;text-shadow:1px 1px #000;z-index:2}.comic-caption h2{margin:0 0 5px;color:#ffe184;font-size:1.15em}.comic-caption p{margin:0;line-height:1.5}.comic-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.comic-progress{font-weight:bold}.comic-intro{background:linear-gradient(135deg,#132b58,#356bc0);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:24px;text-align:center}.comic-intro h1{color:#ffe184}.comic-page-label{display:inline-block;background:#ffe184;color:#14233f;border:2px solid #14233f;border-radius:5px;padding:4px 8px;font-weight:bold;margin-bottom:10px}.sync-status{font-size:.85em;padding:5px 8px;border-radius:5px;background:#e2f5e9;color:#12613a;border:1px solid #75c799}.sync-status.warn{background:#fff4d4;color:#7d5600;border-color:#e3bd57}@media(max-width:600px){.screen{padding:12px}.topbar{padding:9px}.topbar .brand{width:100%}.map{height:430px}.hero{height:205px;padding:18px}.hero h1{font-size:1.35em}.hero p{font-size:.86em}.hero .hero-badge{font-size:.82em;max-width:100%;overflow:hidden;text-overflow:ellipsis}.login{margin:3vh auto}.comic-caption{top:8px;left:8px;right:8px;padding:8px 10px;font-size:.82em}.comic-caption h2{font-size:1em}.comic-panel img{min-height:310px;object-fit:cover}.comic-controls{flex-wrap:wrap}}
</style></head><body><div id="app"></div><div id="modal"></div><script>
const KEY='hkgeoquest_v3';
const COMIC=[{kind:'intro',title:'《願望之石：地理 Quest 的開始》',text:'在香港這座山海相連的城市裡，地理不只是課本上的知識，而是一場等待被發現的冒險。傳說中，願望之石會因為好奇心、合作和愛護環境而發光。'},{img:'dreamina-2026-08-16-7070-Beautiful-anime-style-mystery-adventure.jpg',title:'第一頁：圖書館裡的發現',text:'放學後，兩位學生在地理圖書館跟老師研究一個神秘的發光儀器。老師說：「這是願望之石的導航儀；它會帶領願意探索世界的人發現線索。」'},{img:'dreamina-2026-08-16-2782-Dynamic-anime-style-key-visual-manga-sp.jpg',title:'第二頁：怪盜現身',text:'當夜幕降臨校園，神秘怪盜霧影狐趁大家不注意，把閃耀的願望之石帶走了！他留下訊息：「想找回它，就用地理知識走遍每一條線索吧！」'},{img:'dreamina-2026-08-16-8059-Dynamic-anime-action-scene-shonen-manga.jpg',title:'第三頁：知識風暴',text:'翌日，怪盜留下的混亂線索化成「紙頁風暴」！主角明白，不能靠蠻力解決問題；要冷靜閱讀資料、辨認地圖符號，並與同學合作。'},{img:'dreamina-2026-08-16-9466-Dramatic-anime-climax-scene-dark-fantas.jpg',title:'第四頁：追向地理世界',text:'循著導航儀的光芒，主角看見霧影狐把願望之石帶往迷霧世界的入口。下一步，就是進入中一、中二或中三級地圖，完成任務、收集線索，讓願望之石重現光芒！'}];
const base={banners:[{id:'b1',title:'香港自然景觀：山海相連',tip:'留意山地、海岸與人類活動的關係。',alt:'香港山海景觀像素橫幅',grade:'all',img:''},{id:'b2',title:'探索我們的城市與自然',tip:'由地圖、數據與故事開始你的地理旅程。',alt:'香港地理探索',grade:'all',img:''}],news:[{id:'n1',title:'香港天文台天氣資訊',date:'2026-08-16',source:'香港天文台',url:'https://www.hko.gov.hk/',summary:'閱讀天氣資料，思考天氣如何影響日常生活與戶外活動。',cat:'天氣與氣候',grade:'all',judge:'天氣資料可以幫助我們規劃戶外活動。',answer:'正確'}],questions:{1:[{id:'q1',topic:'香港自然環境',difficulty:'基本',type:'single',text:'香港夏季普遍炎熱潮濕，主要受哪一種季風影響？',options:['東南季風','西北季風','極地東風','信風'],answer:'東南季風',media:'',alt:''},{id:'q2',topic:'地圖技能',difficulty:'基本',type:'single',text:'地圖上的圖例主要有甚麼用途？',options:['說明符號意思','量度溫度','記錄人物名稱','改變比例'],answer:'說明符號意思',media:'',alt:''}],2:[{id:'q3',topic:'河流地貌',difficulty:'基本',type:'single',text:'河流上游通常有甚麼特徵？',options:['坡度較陡、流速較快','河道最闊','沉積最多','水流靜止'],answer:'坡度較陡、流速較快',media:'',alt:''},{id:'q4',topic:'天氣與氣候',difficulty:'基本',type:'single',text:'「今日有驟雨」最適合描述為甚麼？',options:['天氣','氣候','植被','人口'],answer:'天氣',media:'',alt:''}],3:[{id:'q5',topic:'城市問題',difficulty:'基本',type:'single',text:'哪一項最能紓緩繁忙市區的空氣污染？',options:['使用公共交通工具','增加私家車使用','露天焚燒垃圾','長開引擎'],answer:'使用公共交通工具',media:'',alt:''},{id:'q6',topic:'可持續發展',difficulty:'基本',type:'single',text:'可持續發展最強調甚麼？',options:['兼顧現在需要與未來世代','只追求短期利潤','完全停止發展','只重視單一群體'],answer:'兼顧現在需要與未來世代',media:'',alt:''}]},runs:[],messages:[],shop:[{id:'s1',name:'探險家帽章',cost:80,desc:'像素探險家紀念飾品',img:''},{id:'s2',name:'地圖放大鏡',cost:120,desc:'給認真觀察者的獎勵',img:''}],settings:{temp:'30°C',humidity:'78%',rain:'0 mm',warning:'暫無特別天氣警告',music:['NMIXX（示範音樂清單）','TWICE（示範音樂清單）','像素冒險 BGM']}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||base,me=null,game=null,bannerIndex=0,bannerTimer=null,comicPage=0,shopSyncReady=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function id(){return Math.random().toString(36).slice(2,10)}function now(){return new Date().toLocaleString('zh-Hant-HK')}function today(){return new Date().toISOString().slice(0,10)}function forbidden(t){return /粗口|色情|性愛|淫|屌|仆街|f+u+c+k|shit/i.test(t||'')}function app(h){document.getElementById('app').innerHTML=h}function modal(h){document.getElementById('modal').innerHTML=h?`<div class="modal"><div class="dialog">${h}</div></div>`:''}function closeModal(){modal('')}
async function waitFirebase(){if(window.firebaseServices)return window.firebaseServices;return new Promise(resolve=>window.addEventListener('firebase-ready',()=>resolve(window.firebaseServices),{once:true}))}function accountEmail(name){let bytes=new TextEncoder().encode(name.trim().normalize('NFKC').toLowerCase()),hex=[...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');return 'student_'+hex+'@hkgeographyquest.student'}function firebaseError(e){let m={'auth/email-already-in-use':'此姓名帳戶已存在，請登入或聯絡老師。','auth/invalid-credential':'帳戶名稱／電郵或密碼不正確。','auth/wrong-password':'帳戶名稱／電郵或密碼不正確。','auth/user-not-found':'帳戶名稱／電郵或密碼不正確。','auth/weak-password':'密碼強度不足。','auth/network-request-failed':'網絡連線失敗，請再試一次。','permission-denied':'沒有資料庫存取權限，請檢查 Firestore Rules。'};return m[e.code]||('操作失敗：'+(e.message||e.code||'未知錯誤'))}
async function loadProfile(uid){let f=await waitFirebase(),snap=await f.getDoc(f.doc(f.firestore,'users',uid));return snap.exists()?snap.data():null}async function createStudentProfile(uid,d){let f=await waitFirebase();await f.setDoc(f.doc(f.firestore,'users',uid),{displayName:d.name,className:d.className,grade:d.grade,role:'student',coins:2,purchases:[],checkInDate:'',createdAt:f.serverTimestamp(),updatedAt:f.serverTimestamp()})}async function syncProfile(){if(!me?.uid||me.role==='teacher')return;let f=await waitFirebase();await f.updateDoc(f.doc(f.firestore,'users',me.uid),{coins:me.coins||0,purchases:me.purchases||[],checkInDate:me.checkin||'',updatedAt:f.serverTimestamp()})}
async function loadSharedShop(){try{let f=await waitFirebase(),snap=await f.getDocs(f.collection(f.firestore,'shopItems'));if(!snap.empty){db.shop=snap.docs.map(d=>({id:d.id,...d.data()}));save()}shopSyncReady=true;return db.shop}catch(e){shopSyncReady=false;return db.shop}}
function loginPage(){app(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><p class="hint">8-bit 地理冒險學習平台 · 尋回被怪盜偷走的願望之石！</p><div class="tabs"><button onclick="loginTab('student')">學生登入</button><button class="soft" onclick="loginTab('reg')">學生申請帳戶</button><button class="gold" onclick="loginTab('teacher')">教師登入</button></div><div id="auth"></div></section></main>`);loginTab('student')}
function loginTab(t){if(t==='teacher'){auth.innerHTML=`<h2>教師 Firebase 登入</h2><label class="field">教師電郵<input id="tEmail" type="email" autocomplete="username" placeholder="輸入 Firebase Authentication 電郵"></label><label class="field">密碼<input id="tPass" type="password" autocomplete="current-password" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')teacherLogin()"></label><div id="err" class="error"></div><button style="width:100%" class="gold" onclick="teacherLogin()">教師登入</button><p class="hint">只有 Firestore profile 的 role 為 teacher 才可開啟控制台。</p>`;return}auth.innerHTML=t==='student'?`<label class="field">學生姓名／帳戶<input id="liUser" autocomplete="username" placeholder="輸入註冊時的姓名"></label><label class="field">密碼<input id="liPass" type="password" autocomplete="current-password" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')studentLogin()"></label><div id="err" class="error"></div><button style="width:100%" onclick="studentLogin()">登入（Enter）</button><p class="hint">帳戶資料會安全地與 Firebase 同步。</p>`:`<label class="field">學生姓名（中文或英文）<input id="rName" placeholder="例如：陳小明／test"></label><label class="field">班別<select id="rClass">${['1A','1B','1C','1D','2A','2B','2C','2D','3A','3B','3C','3D'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">密碼<input id="rPass" type="password" placeholder="至少一個英文字及六位數字" onkeydown="if(event.key==='Enter')register()"></label><div id="err" class="error"></div><button style="width:100%" onclick="register()">申請帳戶</button><p class="hint">可使用中文、英文或中英文混合姓名；班別會自動決定可進入的年級地圖。</p>`}
async function sessionLogin(cred){let profile=await loadProfile(cred.user.uid);if(!profile){let f=await waitFirebase();await f.signOut(f.auth);throw{code:'permission-denied',message:'找不到使用者 profile'}}me={uid:cred.user.uid,name:profile.displayName||'使用者',username:profile.displayName||'',role:profile.role||'student',className:profile.className||'',grade:profile.grade||0,coins:profile.coins||0,checkin:profile.checkInDate||'',purchases:profile.purchases||[],email:cred.user.email};if(me.role==='teacher')teacherHome();else home()}
async function studentLogin(){let u=liUser.value.trim(),p=liPass.value;if(!u||!p){err.textContent='請輸入帳戶名稱和密碼。';return}err.textContent='正在登入…';try{let f=await waitFirebase(),cred=await f.signInWithEmailAndPassword(f.auth,accountEmail(u),p);await sessionLogin(cred)}catch(e){err.textContent=firebaseError(e)}}
async function teacherLogin(){let email=tEmail.value.trim(),p=tPass.value;if(!email||!p){err.textContent='請輸入教師電郵和密碼。';return}err.textContent='正在驗證教師身份…';try{let f=await waitFirebase(),cred=await f.signInWithEmailAndPassword(f.auth,email,p);await sessionLogin(cred)}catch(e){err.textContent=firebaseError(e)}}
async function register(){let name=rName.value.trim(),cl=rClass.value,p=rPass.value;if(!/^[A-Za-z\u4e00-\u9fff][A-Za-z\u4e00-\u9fff .'-]{1,39}$/.test(name)){err.textContent='請輸入 2 至 40 個中文字或英文字；可包含空格、句點、連字號或撇號。';return}if(!/(?=.*[A-Za-z])(?=(?:.*\d){6,}).{7,}/.test(p)){err.textContent='密碼需要至少一個英文字及六位數字。';return}err.textContent='正在建立 Firebase 帳戶…';try{let f=await waitFirebase(),cred=await f.createUserWithEmailAndPassword(f.auth,accountEmail(name),p),g=+cl[0];await createStudentProfile(cred.user.uid,{name,className:cl,grade:g});me={uid:cred.user.uid,name,username:name,role:'student',className:cl,grade:g,coins:2,checkin:'',purchases:[]};home()}catch(e){err.textContent=firebaseError(e)}}
function nav(){return `<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button class="soft" onclick="${me.role==='teacher'?'teacherHome()':'home()'}">主頁</button>${me.role==='teacher'?`<button class="gold" onclick="teacherPanel()">教師控制台</button>`:`<><button class="soft" onclick="openChat()">聊天</button><button class="gold" onclick="dailyCheckin()">每天簽到</button></>`}<button class="danger" onclick="logout()">登出</button></header>`}async function logout(){try{let f=await waitFirebase();await f.signOut(f.auth)}catch(e){}me=null;closeModal();loginPage()}
function teacherHome(){clearInterval(bannerTimer);app(nav()+`<main class="page"><section class="hero"><h1>教師首頁</h1><p>你好，${esc(me.name)}。你的 Firebase 教師身份已驗證。</p><span class="hero-badge">🔒 教師權限</span></section><section class="grid" style="margin-top:16px"><article class="card"><h2>👩‍🏫 教師控制台</h2><p>只有 role 為 teacher 的 Firebase 帳戶可見和開啟此功能。</p><button class="gold" onclick="teacherPanel()">前往教師控制台</button></article><article class="card"><h2>☁️ 雲端狀態</h2><p><span class="sync-status">已以教師身份登入 Firebase</span></p><p class="hint">下一階段將把題庫、新聞、成績和私訊接入 Firestore。</p></article></section></main>`)}
function home(){closeModal();document.onkeydown=null;clearInterval(window.activeTimer);clearInterval(bannerTimer);game=null;app(nav()+`<main class="page"><section class="hero" id="hero"></section><div class="ticker" id="ticker"></div><section class="grid" style="margin-top:16px"><article class="card"><h2>📖 漫畫式劇情</h2><p>怪盜「霧影狐」偷走了能實現美好願望的願望之石，並把它藏在三個地理世界！與同伴合作、解開地理線索，找回願望之石吧。</p><button onclick="openComic(0)">閱讀故事</button> <button onclick="tutorial()">新手引導</button> <button class="gold" onclick="startGame()">開始冒險</button></article><article class="card"><h2>🌦️ 香港即時天氣（教師示範）</h2><p>氣溫：<b>${esc(db.settings.temp)}</b>　濕度：<b>${esc(db.settings.humidity)}</b></p><p>雨量：<b>${esc(db.settings.rain)}</b>　警告：<b>${esc(db.settings.warning)}</b></p></article><article class="card"><h2>📰 地理新聞速報</h2>${db.news.slice(0,3).map(n=>`<div class="announcement"><b>${esc(n.title)}</b><br><span class="hint">${esc(n.date)} · ${esc(n.cat)}</span><p>${esc(n.summary)}</p><button class="soft" onclick="readNews('${n.id}')">閱讀及判斷</button></div>`).join('')}</article></section><section class="card" style="margin-top:16px"><h2>🧭 我的地圖</h2><p><b>${esc(me.name)}</b>（${me.className}） <span class="sync-status">☁️ Firebase 帳戶已同步</span></p><p>只可進入中${me.grade}地圖，確保題目配合你的學習進度。</p><p><span class="badge">💰 ${me.coins||0} 金幣</span><span class="badge">❤️ 3 生命</span></p><button class="gold" onclick="startGame()">進入中${me.grade}地圖</button> <button class="soft" onclick="shop()">🛒 商店</button></section></main>`);renderBanner();bannerTimer=setInterval(renderBanner,5000)}
function renderBanner(){let bs=db.banners.filter(x=>x.grade==='all'||x.grade===(me.grade||1)),b=bs[bannerIndex%Math.max(1,bs.length)]||db.banners[0];bannerIndex++;let h=document.getElementById('hero');if(!h)return;h.innerHTML=`<h1>${esc(b.title)}</h1><p>💡 ${esc(b.tip)}</p><span class="hero-badge">香港自然景觀</span>`;let t=document.getElementById('ticker');if(t)t.textContent='📢 '+db.news.map(n=>n.title).join('　｜　')}
function teacherPanel(){if(me.role!=='teacher'){alert('沒有教師權限。');return}app(nav()+`<main class="page"><h1>👩‍🏫 教師控制台</h1><p><span class="sync-status">🔒 Firebase 教師權限已確認</span></p><div class="tools"><button onclick="teacherTab('overview')">控制台總覽</button><button onclick="teacherTab('questions')">題庫／編輯</button><button onclick="teacherTab('news')">新聞速報</button><button onclick="teacherTab('results')">學生成績</button><button onclick="teacherTab('chat')">私訊回覆</button><button onclick="teacherTab('shop')">商店管理</button></div><div id="teacherContent"></div></main>`);teacherTab('overview')}
function teacherTab(tab){let c=document.getElementById('teacherContent');let text={overview:['控制台總覽','教師 Firebase 登入已完成。下一個版本會把題庫、新聞、成績和私訊逐項接入 Firestore。'],questions:['題庫／編輯','題庫雲端同步將在下一階段啟用。'],news:['新聞速報','新聞速報雲端同步將在下一階段啟用。'],results:['學生成績','成績及題目分析雲端同步將在下一階段啟用。'],chat:['私訊回覆','一對一私訊雲端同步將在下一階段啟用。'],shop:['商店管理','商店功能已使用 Firestore 同步。請由學生端或舊同步商店版本測試商品；完整教師商店介面將在後續版本整合。']}[tab];c.innerHTML=`<section class="card"><h2>${text[0]}</h2><p>${text[1]}</p><p class="hint">目前登入帳戶：${esc(me.email||'')}；角色：${esc(me.role)}</p></section>`}
function openComic(p){comicPage=Math.max(0,Math.min(COMIC.length-1,p));let x=COMIC[comicPage],body=x.kind==='intro'?`<div class="comic-intro"><div class="comic-page-label">故事背景</div><h1>${esc(x.title)}</h1><p>${esc(x.text)}</p></div>`:`<div class="comic-panel"><img src="${x.img}" alt="${esc(x.title)}"><div class="comic-caption"><h2>${esc(x.title)}</h2><p>${esc(x.text)}</p></div></div>`;modal(`${body}<div class="comic-controls"><button class="soft" onclick="${comicPage===0?'closeModal()':`openComic(${comicPage-1})`}">${comicPage===0?'關閉':'← 上一頁'}</button><span class="comic-progress">第 ${comicPage+1}／${COMIC.length} 頁</span><button class="gold" onclick="${comicPage===COMIC.length-1?'closeModal()':`openComic(${comicPage+1})`}">${comicPage===COMIC.length-1?'開始冒險！':'下一頁 →'}</button></div>`)}
function tutorial(){modal(`<h2>🎮 新手引導</h2><ol><li>用 WASD／方向鍵／手機按鈕移動角色。</li><li>靠近 🦉 NPC 取得三個地理線索；靠近可愛怪物作答。</li><li>每題限時 30 秒；答對得 50 金幣。錯誤或超時會先扣分，再扣生命。</li></ol><button onclick="closeModal()">明白了！</button>`)}
function startGame(){clearInterval(bannerTimer);let qs=db.questions[me.grade]||[];game={x:45,y:70,lives:3,score:0,coins:0,idx:0,clues:0,answered:[],qs:[...qs].sort(()=>Math.random()-.5)};app(nav()+`<main class="page"><div class="hud"><span class="badge" id="life">❤️ ❤️ ❤️</span><span class="badge" id="score">⭐ 分數：0</span><span class="badge" id="coin">💰 本局金幣：0</span><span class="badge" id="prog">進度：0/${qs.length}</span><button class="soft" onclick="shop()">商店</button><button class="soft" onclick="openComic(0)">漫畫</button><button class="soft" onclick="home()">返回主頁</button></div><div class="map"><div class="road" style="left:5%;top:42%;width:88%;height:32px"></div><div class="road" style="left:47%;top:10%;width:32px;height:76%"></div><div class="sign" style="left:7%;top:29%">🪧<div class="hint">中${me.grade}地理島</div></div><div class="npc" style="left:18%;top:58%" onclick="clue()">🦉<div class="hint">貓頭鷹老師</div></div><div class="npc" style="left:70%;top:17%" onclick="clue()">🐼<div class="hint">熊貓嚮導</div></div><div class="monster" style="left:72%;top:65%" onclick="encounter()">👾<div class="hint">迷途小怪</div></div><div class="monster" style="left:32%;top:15%" onclick="encounter()">🦖<div class="hint">雲霧龍</div></div><div class="player" id="player" style="left:45%;top:70%">🧑‍🚀</div><div class="mapnote">接近 NPC 或怪物，或直接點擊牠們開始互動。</div></div><div class="move"><button onclick="move(0,-1)">▲</button><button onclick="move(-1,0)">◀</button><button onclick="move(1,0)">▶</button><button onclick="move(0,1)">▼</button></div></main>`);document.onkeydown=e=>{let d={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}}}
function move(dx,dy){if(!game)return;game.x=Math.max(2,Math.min(92,game.x+dx*4));game.y=Math.max(2,Math.min(88,game.y+dy*4));let p=document.getElementById('player');if(p){p.style.left=game.x+'%';p.style.top=game.y+'%'}}function clue(){if(!game)return;game.clues=Math.min(3,game.clues+1);modal(`<h2>🦉 動物 NPC 的地理線索</h2><p>仔細觀察地圖、天氣和人類活動之間的關係。</p><p>已收集 ${game.clues}/3 個線索。</p><button onclick="closeModal()">繼續探索</button>`)}function encounter(){if(!game)return;if(game.idx>=game.qs.length){finish();return}ask(game.qs[game.idx])}
function ask(q){let t=30;modal(`<h2>⚔️ 可愛怪物挑戰</h2><div id="timer" class="badge" style="font-size:1.3em">⏱️ 30 秒</div><div class="bar"><i id="timebar" style="width:100%"></i></div><p><b>${esc(q.text)}</b></p><div class="answers">${q.options.map(o=>`<button onclick="answer('${q.id}','${encodeURIComponent(o)}')">${esc(o)}</button>`).join('')}</div></div>`);window.activeTimer=setInterval(()=>{t--;let el=document.getElementById('timer');if(!el){clearInterval(window.activeTimer);return}el.textContent=`⏱️ ${t} 秒`;if(t<=0){clearInterval(window.activeTimer);answer(q.id,'',true)}},1000)}function answer(qid,v,timeout=false){clearInterval(window.activeTimer);let q=Object.values(db.questions).flat().find(x=>x.id===qid),a=decodeURIComponent(v||''),correct=a===q.answer;game.idx++;if(correct){game.score+=100;game.coins+=50;modal('<h2>✨ 答對了！</h2><p>獲得 50 金幣和 100 分。</p><button onclick="closeModal()">繼續</button>')}else{game.lives--;modal(`<h2>${timeout?'⏰ 時間到了！':'💫 再接再厲！'}</h2><p>正確答案：${esc(q.answer)}。剩下 ${game.lives} 條生命。</p><button onclick="${game.lives>0?'closeModal()':'startGame()'}">${game.lives>0?'繼續':'重新開始'}</button>`)}updateHUD();if(game.idx>=game.qs.length&&game.lives>0)setTimeout(finish,300)}function updateHUD(){if(!game)return;life.textContent='❤️ '.repeat(game.lives)+'🖤 '.repeat(3-game.lives);score.textContent='⭐ 分數：'+game.score;coin.textContent='💰 本局金幣：'+game.coins;prog.textContent='進度：'+game.idx+'/'+game.qs.length}async function finish(){let earned=game.coins;me.coins=(me.coins||0)+earned;try{await syncProfile()}catch(e){}game=null;modal(`<h2>🏆 冒險完成！</h2><p>你獲得 ${earned} 金幣。</p><button onclick="home()">返回主頁</button>`)}
async function syncProfile(){if(me.role==='teacher')return;let f=await waitFirebase();await f.updateDoc(f.doc(f.firestore,'users',me.uid),{coins:me.coins||0,purchases:me.purchases||[],checkInDate:me.checkin||'',updatedAt:f.serverTimestamp()})}async function dailyCheckin(){if(me.checkin===today()){modal('<h2>今天已簽到</h2><p>明天再回來可獲得 2 金幣！</p><button onclick="closeModal()">關閉</button>');return}me.checkin=today();me.coins=(me.coins||0)+2;try{await syncProfile();modal('<h2>🎁 簽到成功</h2><p>獲得 2 金幣，資料已同步。</p><button onclick="home()">太好了</button>')}catch(e){alert(firebaseError(e))}}
async function shop(){modal('<h2>🛒 地理商店</h2><p>正在讀取共用商品…</p>');await loadSharedShop();modal(`<h2>🛒 地理商店</h2><p>你的金幣：${me.coins||0}</p><div class="grid">${db.shop.map(s=>`<div class="card"><b>${esc(s.name)}</b><p>${esc(s.desc||'')}</p><span class="badge">💰 ${s.cost}</span><br><button onclick="buy('${s.id}')">購買</button></div>`).join('')}</div><button class="soft" onclick="closeModal()">關閉</button>`)}async function buy(i){let s=db.shop.find(x=>x.id===i);if(!s||me.coins<s.cost){alert('金幣不足或商品不存在。');return}me.coins-=s.cost;me.purchases=(me.purchases||[]).concat(i);try{await syncProfile();alert('購買成功：'+s.name);shop()}catch(e){alert(firebaseError(e))}}
function readNews(i){let n=db.news.find(x=>x.id===i)||db.news[0];modal(`<h2>📰 ${esc(n.title)}</h2><p>${esc(n.summary)}</p><button onclick="closeModal()">關閉</button>`)}function openChat(){modal('<h2>💬 一對一聊天</h2><p>私訊同步將在下一階段啟用。</p><button onclick="closeModal()">關閉</button>')}
loginPage();
</script><script type="module">

const firebaseConfig={apiKey:"AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4",authDomain:"hk-geography-quest.firebaseapp.com",projectId:"hk-geography-quest",storageBucket:"hk-geography-quest.firebasestorage.app",messagingSenderId:"418307975863",appId:"1:418307975863:web:6e8c259e0ba723d7ec3b32"};try{const firebaseApp=initializeApp(firebaseConfig),auth=getAuth(firebaseApp),firestore=getFirestore(firebaseApp);window.firebaseServices={auth,firestore,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,doc,setDoc,getDoc,collection,getDocs,updateDoc,serverTimestamp};window.dispatchEvent(new Event('firebase-ready'))}catch(error){console.error('Firebase initialization failed:',error)}
