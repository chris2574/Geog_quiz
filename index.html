<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>香港地理 Quest｜雲端題庫版</title>
<style>
:root{--navy:#12213c;--blue:#2377d8;--sky:#dff4ff;--cream:#fffdf5;--gold:#ffca35;--green:#23985b;--red:#df4559;--muted:#52647a}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:linear-gradient(#bdeaff,#effaff);color:var(--navy);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:20px}.hero,.card{background:var(--cream);border:4px solid var(--navy);border-radius:18px;box-shadow:7px 7px 0 #80b9db}.hero{padding:24px;text-align:center;background:linear-gradient(135deg,#fffdf5,#dff5ff)}h1{margin:0;color:var(--blue);font-size:clamp(2rem,6vw,3.5rem)}h2{margin-top:0}.sub{color:var(--muted)}.card{padding:22px;margin-top:18px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.field{display:block;margin:10px 0;font-weight:bold}.field input,.field select,.field textarea{width:100%;display:block;margin-top:5px;padding:11px;border:2px solid #91a7c1;border-radius:8px;background:#fff;font:inherit;color:var(--navy)}.field textarea{min-height:82px}button{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #12437f;margin:3px}button:hover{filter:brightness(1.06)}button.gold{background:var(--gold);color:#493000;box-shadow:0 3px 0 #a86c00}button.green{background:var(--green);box-shadow:0 3px 0 #12633a}button.danger{background:var(--red);box-shadow:0 3px 0 #972b3b}.notice{white-space:pre-wrap;padding:12px;border-radius:9px;background:#eaf1f6;color:var(--navy);min-height:45px}.notice.ok{background:#dcf5e6;color:#13613a}.notice.err{background:#ffe1e5;color:#9a2031}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button.active{outline:3px solid var(--gold)}.stage{max-width:720px;margin:auto;text-align:center;background:#fff;border:3px dashed #77a5c4;border-radius:14px;padding:24px}.progress{height:15px;background:#d9e6ef;border-radius:99px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:var(--green);width:0;transition:.3s}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choices button{min-height:54px}.score{font-size:1.15rem;color:#154d8e;font-weight:bold}table{border-collapse:collapse;width:100%;background:#fff;margin-top:10px}th,td{border:1px solid #a9b6c5;padding:8px;text-align:left;vertical-align:top}th{background:#d8efff}.small{font-size:.88rem;color:var(--muted)}.empty{padding:20px;background:#fff3d0;border:2px solid #e2b74a;border-radius:10px;color:#745000}.answer-result{margin-top:12px;font-weight:bold;min-height:24px}@media(max-width:600px){.wrap{padding:12px}.card{padding:15px}.choices{grid-template-columns:1fr}.hero{padding:18px}th,td{font-size:.9rem;padding:6px}}
</style>
</head>
<body><main class="wrap">
<header class="hero"><h1>🗺️ 香港地理 Quest</h1><p class="sub">教師雲端題庫・學生年級專屬挑戰</p></header>
<section class="card"><div id="notice" class="notice">正在連接 Firebase…</div></section>
<section id="authView" class="card"><h2>登入</h2><p class="sub">使用 Firebase 帳戶登入。系統會從 <code>users/{uid}</code> 讀取你的角色及學生年級。</p><div class="grid"><label class="field">電郵<input id="email" type="email" autocomplete="username" placeholder="teacher@example.com"></label><label class="field">密碼<input id="password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></label></div><button class="gold" onclick="login()">登入 Quest</button></section>
<section id="teacherView" class="hidden"><section class="card"><h2>👩‍🏫 教師控制台</h2><p id="teacherInfo" class="sub"></p><button onclick="logout()">登出</button></section><section class="card"><h2 id="editorTitle">新增雲端題目</h2><input id="editId" type="hidden"><div class="grid"><label class="field">適用年級<select id="qGrade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">題型<select id="qType"><option value="single">單選題</option><option value="multi">多項選擇題</option><option value="open">開放式題目</option></select></label><label class="field">課題<input id="qTopic" placeholder="例如：天氣及氣候"></label><label class="field">難度<select id="qDifficulty"><option>基本</option><option>進階</option><option>挑戰</option></select></label></div><label class="field">題目<textarea id="qText" placeholder="輸入題目內容"></textarea></label><label class="field">選項（每行一項；開放式題目可留空）<textarea id="qOptions" placeholder="選項 A&#10;選項 B&#10;選項 C&#10;選項 D"></textarea></label><label class="field">正確答案（多項選擇以 | 分隔）<input id="qAnswer" placeholder="例如：選項 B"></label><button class="gold" onclick="saveQuestion()">儲存題目</button><button id="cancelEdit" class="hidden" onclick="resetEditor()">取消修改</button></section><section class="card"><h2>題庫管理</h2><label class="field">按年級篩選<select id="teacherFilter" onchange="loadTeacherQuestions()"><option value="all">全部年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><button onclick="loadTeacherQuestions()">重新讀取題庫</button><div id="teacherQuestions" class="small">正在等待讀取。</div></section></section>
<section id="studentView" class="hidden"><section class="card"><h2>🎒 學生地圖入口</h2><p id="studentInfo" class="sub"></p><button onclick="logout()">登出</button></section><section class="card"><div id="gameEmpty" class="hidden empty"></div><div id="gameStage" class="stage hidden"><div class="score"><span id="topicLabel"></span>　｜　得分：<span id="score">0</span></div><div class="progress"><div id="bar"></div></div><p id="count" class="small"></p><h2 id="questionText">載入中…</h2><div id="choices" class="choices"></div><div id="openBox" class="hidden"><label class="field">你的答案<textarea id="openAnswer" placeholder="輸入答案"></textarea></label><button class="green" onclick="submitOpen()">提交答案</button></div><div id="result" class="answer-result"></div><button id="nextBtn" class="gold hidden" onclick="nextQuestion()">下一題</button></div><div id="gameEnd" class="hidden stage"><h2>🎉 挑戰完成！</h2><p id="endText"></p><button class="gold" onclick="startGame()">再玩一次</button></div></section></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
let auth,db,user=null,profile=null,gameQuestions=[],gameIndex=0,gameScore=0,answered=false;
const CONFIG={apiKey:'AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4',authDomain:'hk-geography-quest.firebaseapp.com',projectId:'hk-geography-quest',storageBucket:'hk-geography-quest.firebasestorage.app',messagingSenderId:'418307975863',appId:'1:418307975863:web:6e8c259e0ba723d7ec3b32'};
function $(id){return document.getElementById(id)}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function note(text,kind=''){const el=$('notice');el.textContent=text;el.className='notice '+kind}function friendly(e){const map={'permission-denied':'Firestore Rules 拒絕這項操作。請檢查 Rules 和 users 文件的 role。','auth/invalid-credential':'電郵或密碼不正確。','auth/user-not-found':'找不到此帳戶。','auth/wrong-password':'密碼不正確。'};return (map[e.code]||e.code||'發生錯誤')+(e.message?'\n'+e.message:'')}
function hideAll(){['authView','teacherView','studentView'].forEach(id=>$(id).classList.add('hidden'))}
try{firebase.initializeApp(CONFIG);auth=firebase.auth();db=firebase.firestore();note('Firebase 已連接。請登入。','ok')}catch(e){note('Firebase 初始化失敗：\n'+e.message,'err')}
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){note('請輸入電郵及密碼。','err');return}note('正在登入並讀取帳戶資料…');try{const c=await auth.signInWithEmailAndPassword(email,password);await showAccount(c.user)}catch(e){note(friendly(e),'err')}}
async function showAccount(u){try{const doc=await db.collection('users').doc(u.uid).get();if(!doc.exists){await auth.signOut();note('此帳戶沒有 users/{uid} 設定檔，無法判斷教師或學生身份。','err');return}user=u;profile=doc.data()||{};const role=String(profile.role||'').toLowerCase();hideAll();if(role==='teacher'){$('teacherView').classList.remove('hidden');$('teacherInfo').textContent='已登入教師：'+(profile.displayName||u.email)+'（UID：'+u.uid+'）';note('✅ 教師登入成功。可管理雲端 questions 題庫。','ok');loadTeacherQuestions();return}if(role==='student'){const grade=Number(profile.grade);if(![1,2,3].includes(grade)){$('authView').classList.remove('hidden');note('學生帳戶缺少有效 grade（應為 1、2 或 3）。請在 users/{uid} 設定 grade。','err');return}$('studentView').classList.remove('hidden');$('studentInfo').textContent='歡迎，'+(profile.displayName||u.email)+'！你的地圖：中'+grade+'。正在載入專屬題庫…';note('✅ 學生登入成功，正載入中'+grade+'題庫。','ok');loadStudentQuestions(grade);return}await auth.signOut();$('authView').classList.remove('hidden');note('users/{uid}.role 必須是 teacher 或 student。','err')}catch(e){hideAll();$('authView').classList.remove('hidden');note(friendly(e),'err')}}
auth&&auth.onAuthStateChanged(u=>{if(!u)return;if(!user)showAccount(u)});
async function logout(){try{await auth.signOut()}finally{user=null;profile=null;gameQuestions=[];hideAll();$('authView').classList.remove('hidden');note('已登出。')}}
function questionData(){const type=$('qType').value,answer=$('qAnswer').value.trim();return{grade:Number($('qGrade').value),type,topic:$('qTopic').value.trim()||'未分類',difficulty:$('qDifficulty').value,text:$('qText').value.trim(),options:$('qOptions').value.split('\n').map(x=>x.trim()).filter(Boolean),answer:type==='multi'?answer.split('|').map(x=>x.trim()).filter(Boolean):answer,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:user.uid}}
async function saveQuestion(){if(!user){note('請先登入教師帳戶。','err');return}const q=questionData();if(!q.text){note('請填寫題目內容。','err');return}if(q.type!=='open'&&!q.answer){note('單選題或多項選擇題必須填寫正確答案。','err');return}if(q.type!=='open'&&!q.options.length){note('單選題或多項選擇題必須至少有一個選項。','err');return}try{const id=$('editId').value;if(id){await db.collection('questions').doc(id).update(q);note('✅ 題目已更新。','ok')}else{q.createdAt=firebase.firestore.FieldValue.serverTimestamp();q.createdBy=user.uid;await db.collection('questions').add(q);note('✅ 題目已新增至 Firestore questions。','ok')}resetEditor();loadTeacherQuestions()}catch(e){note(friendly(e),'err')}}
function resetEditor(){$('editId').value='';$('editorTitle').textContent='新增雲端題目';$('qGrade').value='1';$('qType').value='single';$('qTopic').value='';$('qDifficulty').value='基本';$('qText').value='';$('qOptions').value='';$('qAnswer').value='';$('cancelEdit').classList.add('hidden')}
async function loadTeacherQuestions(){const out=$('teacherQuestions');out.textContent='正在讀取 questions…';try{const snap=await db.collection('questions').get(),filter=$('teacherFilter').value,items=[];snap.forEach(d=>{const q=d.data();if(filter==='all'||String(q.grade)===filter)items.push({id:d.id,...q})});items.sort((a,b)=>(a.grade-b.grade)||String(a.topic).localeCompare(String(b.topic)));if(!items.length){out.innerHTML='<div class="empty">這個年級暫時沒有題目。請在上方新增題目。</div>';return}out.innerHTML='<table><tr><th>年級</th><th>課題／題目</th><th>題型</th><th>答案</th><th>操作</th></tr>'+items.map(q=>'<tr><td>中'+escapeHtml(q.grade)+'</td><td><b>'+escapeHtml(q.topic)+'</b><br>'+escapeHtml(q.text)+'</td><td>'+escapeHtml(q.type)+'</td><td>'+escapeHtml(Array.isArray(q.answer)?q.answer.join(' | '):q.answer||'開放式')+'</td><td><button onclick="editQuestion(\''+q.id+'\')">修改</button><button class="danger" onclick="deleteQuestion(\''+q.id+'\')">刪除</button></td></tr>').join('')+'</table>'}catch(e){out.textContent=friendly(e);out.className='notice err'}}
async function editQuestion(id){try{const s=await db.collection('questions').doc(id).get();if(!s.exists){note('找不到這個題目。','err');return}const q=s.data();$('editId').value=id;$('editorTitle').textContent='修改題目：'+id;$('qGrade').value=q.grade;$('qType').value=q.type||'single';$('qTopic').value=q.topic||'';$('qDifficulty').value=q.difficulty||'基本';$('qText').value=q.text||'';$('qOptions').value=(q.options||[]).join('\n');$('qAnswer').value=Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'');$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}catch(e){note(friendly(e),'err')}}
async function deleteQuestion(id){if(!confirm('確定要刪除這條題目嗎？此動作不能復原。'))return;try{await db.collection('questions').doc(id).delete();note('✅ 題目已刪除。','ok');loadTeacherQuestions()}catch(e){note(friendly(e),'err')}}
async function loadStudentQuestions(grade){$('gameEmpty').classList.add('hidden');$('gameStage').classList.add('hidden');$('gameEnd').classList.add('hidden');try{const snap=await db.collection('questions').where('grade','==',Number(grade)).get();gameQuestions=[];snap.forEach(d=>{const q=d.data();if(q.text)gameQuestions.push({id:d.id,...q})});gameQuestions.sort(()=>Math.random()-.5);if(!gameQuestions.length){$('gameEmpty').innerHTML='<h2>目前未有中'+grade+'題庫</h2><p>教師尚未為這個年級新增題目，因此遊戲未能開始。</p><p class="small">請通知教師在教師控制台新增 <code>grade: '+grade+'</code> 的 questions 題目後再試。</p>';$('gameEmpty').classList.remove('hidden');note('中'+grade+'題庫暫時是空的；已顯示清楚提示。','err');return}note('✅ 已載入中'+grade+'題庫，共 '+gameQuestions.length+' 題。','ok');startGame()}catch(e){$('gameEmpty').textContent='無法讀取中'+grade+'題庫：'+friendly(e);$('gameEmpty').classList.remove('hidden');note(friendly(e),'err')}}
function startGame(){gameIndex=0;gameScore=0;$('score').textContent='0';$('gameEnd').classList.add('hidden');$('gameStage').classList.remove('hidden');renderQuestion()}
function renderQuestion(){answered=false;const q=gameQuestions[gameIndex];$('topicLabel').textContent='中'+q.grade+'・'+(q.topic||'未分類');$('count').textContent='第 '+(gameIndex+1)+' / '+gameQuestions.length+' 題';$('bar').style.width=((gameIndex/gameQuestions.length)*100)+'%';$('questionText').textContent=q.text;$('result').textContent='';$('nextBtn').classList.add('hidden');$('choices').innerHTML='';$('openBox').classList.add('hidden');if(q.type==='open'){$('openBox').classList.remove('hidden');$('openAnswer').value='';return}const opts=Array.isArray(q.options)?q.options:[];if(!opts.length){$('result').textContent='此題沒有選項，無法作答。請通知教師修改這題。';$('nextBtn').classList.remove('hidden');return}opts.forEach(option=>{const b=document.createElement('button');b.textContent=option;b.onclick=()=>submitChoice(option);$('choices').appendChild(b)})}
function equalAnswer(a,b){return String(a).trim()===String(b).trim()}function submitChoice(choice){if(answered)return;const q=gameQuestions[gameIndex];if(q.type==='multi'){alert('此簡化遊戲介面暫以單一選項方式作答；請使用單選題或開放式題目進行遊戲。');return}finishAnswer(equalAnswer(choice,q.answer),q.answer)}function submitOpen(){if(answered)return;const q=gameQuestions[gameIndex],v=$('openAnswer').value.trim();if(!v){$('result').textContent='請先輸入答案。';return}if(q.answer){finishAnswer(equalAnswer(v,q.answer),q.answer)}else{answered=true;$('result').textContent='已提交開放式答案，請由教師評閱。';$('nextBtn').classList.remove('hidden')}}
function finishAnswer(correct,answer){answered=true;if(correct){gameScore+=10;$('score').textContent=gameScore;$('result').textContent='✅ 答對！ +10 分';$('result').style.color='#168049'}else{$('result').textContent='❌ 未答對。正確答案：'+(Array.isArray(answer)?answer.join('、'):answer);$('result').style.color='#b22639'};[...$('choices').querySelectorAll('button')].forEach(b=>b.disabled=true);$('nextBtn').classList.remove('hidden')}
function nextQuestion(){gameIndex++;if(gameIndex>=gameQuestions.length){$('gameStage').classList.add('hidden');$('gameEnd').classList.remove('hidden');$('bar').style.width='100%';$('endText').textContent='你完成了 '+gameQuestions.length+' 題，得到 '+gameScore+' 分！';return}renderQuestion()}
</script></body></html>
