<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>香港地理 Quest｜完整雲端版</title><style>
:root{--ink:#14233f;--blue:#2475d9;--gold:#ffc833;--green:#2faf69;--red:#e74b5b;--card:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#dff4ff;color:var(--ink);font-family:ui-monospace,Consolas,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:bold;box-shadow:0 3px 0 #123d77}button:active{transform:translateY(2px);box-shadow:0 1px 0 #123d77}.danger{background:var(--red)}.soft{background:#eaf4ff;color:var(--ink);box-shadow:0 3px 0 #9bb8d2}.gold{background:var(--gold);color:#4b3100;box-shadow:0 3px 0 #a66f00}.green{background:var(--green);box-shadow:0 3px 0 #12613a}.screen{min-height:100vh;padding:20px}.login{max-width:520px;margin:8vh auto;background:var(--card);padding:25px;border:4px solid var(--ink);box-shadow:8px 8px 0 #80b2d5;border-radius:14px}.logo{text-align:center;font-size:2em;font-weight:900;color:var(--blue)}.tabs,.tools,.hud{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0}.tabs button{flex:1}.field{display:block;margin:12px 0;font-weight:bold}.field input,.field select,.field textarea{display:block;width:100%;padding:10px;margin-top:6px;border:2px solid #91a7c1;border-radius:7px;background:#fff}.field textarea{min-height:74px}.hint{font-size:.87em;color:#496078}.error{min-height:22px;color:#b21f34;font-weight:bold;white-space:pre-wrap}.topbar{position:sticky;top:0;z-index:4;background:#fffdf5;border-bottom:4px solid var(--ink);display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 18px}.topbar .brand{font-weight:900;font-size:1.2em;margin-right:auto}.topbar button{padding:7px 9px}.page{max-width:1180px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:16px;box-shadow:5px 5px 0 #9ec3dc}.card h2,.card h3{margin-top:0}.hero{height:250px;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(#83d4ff 0 60%,#82c767 60%);position:relative;padding:26px;color:#fff;text-shadow:2px 2px #19365b}.hero:before{content:"";position:absolute;inset:auto 8% 20px 8%;height:65px;background:#5d9a58;clip-path:polygon(0 100%,18% 30%,28% 70%,45% 0,60% 70%,75% 20%,100% 100%)}.hero h1,.hero p{position:relative;z-index:1;margin:0 0 10px}.hero-badge,.badge{display:inline-block;background:#fff;color:var(--ink);padding:4px 7px;border-radius:5px;border:2px solid var(--ink);margin:3px;text-shadow:none}.hero-badge{position:relative;z-index:1}.ticker{background:#152b50;color:#fff;padding:9px;border-radius:7px;white-space:nowrap;overflow:hidden}.map{height:530px;position:relative;overflow:hidden;background:linear-gradient(#7fd4ff 0 30%,#8ed176 30% 100%);border:4px solid var(--ink);border-radius:12px}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,#64b457 32px 34px),repeating-linear-gradient(90deg,transparent 0 31px,#64b457 32px 34px);opacity:.42}.road{position:absolute;background:#dfc482;border:3px solid #987c49;border-radius:20px}.player,.npc,.monster,.sign{position:absolute;z-index:2;text-align:center;font-size:34px;line-height:36px;user-select:none}.player{transition:left .09s,top .09s}.npc,.monster{cursor:pointer}.sign{font-size:27px}.mapnote{position:absolute;z-index:3;bottom:10px;left:10px;background:#fffdf5;border:2px solid var(--ink);padding:7px;border-radius:6px}.move{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:13px}.move button{padding:10px}.move button:first-child{grid-column:2}.move button:last-child{grid-column:2}.modal{position:fixed;z-index:10;inset:0;background:#0009;display:grid;place-items:center;padding:14px}.dialog{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:#fffdf5;border:4px solid var(--ink);border-radius:12px;padding:20px}.answers{display:grid;gap:10px}.answers button{text-align:left}.bar{height:16px;background:#d5e3ed;border:2px solid var(--ink);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}.urgent{animation:flash .65s infinite;background:#ffdae0!important}@keyframes flash{50%{background:#ff3652!important;color:#fff}}table{width:100%;border-collapse:collapse;background:#fff;font-size:.9em}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left;vertical-align:top}th{background:#d9efff}.announcement{background:#fff5c7;border-left:5px solid var(--gold);padding:10px;border-radius:5px}.comic-panel{position:relative;overflow:hidden;background:#071328;border:4px solid var(--ink);border-radius:12px;min-height:360px}.comic-panel img{width:100%;display:block;max-height:62vh;object-fit:contain;background:#061126}.comic-caption{position:absolute;top:14px;left:14px;right:14px;background:linear-gradient(90deg,#071328f5,#071328cf);border-left:5px solid var(--gold);color:#fff;padding:12px 14px;border-radius:6px;text-shadow:1px 1px #000;z-index:2}.comic-caption h2{margin:0 0 5px;color:#ffe184;font-size:1.15em}.comic-caption p{margin:0;line-height:1.5}.comic-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.comic-progress{font-weight:bold}.comic-intro{background:linear-gradient(135deg,#132b58,#356bc0);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:24px;text-align:center}.comic-intro h1{color:#ffe184}.comic-page-label{display:inline-block;background:#ffe184;color:#14233f;border:2px solid #14233f;border-radius:5px;padding:4px 8px;font-weight:bold;margin-bottom:10px}.sync-status{font-size:.85em;padding:5px 8px;border-radius:5px;background:#e2f5e9;color:#12613a;border:1px solid #75c799}.empty{padding:15px;border:2px solid #e3bd57;background:#fff4d4;border-radius:8px;color:#704f00}@media(max-width:600px){.screen{padding:12px}.topbar{padding:9px}.topbar .brand{width:100%}.map{height:430px}.hero{height:205px;padding:18px}.hero h1{font-size:1.35em}.hero p{font-size:.86em}.login{margin:3vh auto}.comic-caption{top:8px;left:8px;right:8px;padding:8px 10px;font-size:.82em}.comic-panel img{min-height:310px;object-fit:cover}.comic-controls{flex-wrap:wrap}}
</style></head><body><div id="app"></div><div id="modal"></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const config={apiKey:"AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4",authDomain:"hk-geography-quest.firebaseapp.com",projectId:"hk-geography-quest",storageBucket:"hk-geography-quest.firebasestorage.app",messagingSenderId:"418307975863",appId:"1:418307975863:web:6e8c259e0ba723d7ec3b32"};const fb=initializeApp(config),auth=getAuth(fb),fs=getFirestore(fb);
const COMIC=[{kind:'intro',title:'《願望之石：地理 Quest 的開始》',text:'在香港這座山海相連的城市裡，地理不只是課本上的知識，而是一場等待被發現的冒險。傳說中，願望之石會因為好奇心、合作和愛護環境而發光。'},{img:'dreamina-2026-08-16-7070-Beautiful-anime-style-mystery-adventure.jpg',title:'第一頁：圖書館裡的發現',text:'放學後，兩位學生在地理圖書館跟老師研究神秘的發光儀器。'},{img:'dreamina-2026-08-16-2782-Dynamic-anime-style-key-visual-manga-sp.jpg',title:'第二頁：怪盜現身',text:'怪盜霧影狐把願望之石帶走，留下地理線索。'},{img:'dreamina-2026-08-16-8059-Dynamic-anime-action-scene-shonen-manga.jpg',title:'第三頁：知識風暴',text:'閱讀資料、辨認地圖符號，並與同學合作。'},{img:'dreamina-2026-08-16-9466-Dramatic-anime-climax-scene-dark-fantas.jpg',title:'第四頁：追向地理世界',text:'進入年級地圖，完成任務，讓願望之石重現光芒！'}];
const data={news:[{id:'n1',title:'香港天文台天氣資訊',date:'2026-08-16',cat:'天氣與氣候',summary:'閱讀天氣資料，思考天氣如何影響日常生活與戶外活動。'}],shop:[{id:'s1',name:'探險家帽章',cost:80,desc:'像素探險家紀念飾品'},{id:'s2',name:'地圖放大鏡',cost:120,desc:'給認真觀察者的獎勵'}],settings:{temp:'30°C',humidity:'78%',rain:'0 mm',warning:'暫無特別天氣警告'}};
let me=null,game=null,bannerTimer=null,comicPage=0;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const app=h=>$('app').innerHTML=h;const modal=h=>$('modal').innerHTML=h?`<div class="modal"><div class="dialog">${h}</div></div>`:'';const closeModal=()=>modal('');const today=()=>new Date().toISOString().slice(0,10);
function errorText(e){const m={'auth/email-already-in-use':'此姓名帳戶已存在。','auth/invalid-credential':'帳戶名稱／電郵或密碼不正確。','auth/invalid-email':'電郵格式不正確。','auth/weak-password':'密碼強度不足。','permission-denied':'沒有資料庫存取權限，請檢查 Firestore Rules。'};return m[e.code]||('操作失敗：'+(e.message||e.code||'未知錯誤'))}function accountEmail(name){const hex=[...new TextEncoder().encode(name.trim().normalize('NFKC').toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('');return 'student_'+hex+'@hkgeographyquest.student'}
async function profile(uid){const s=await getDoc(doc(fs,'users',uid));return s.exists()?s.data():null}async function setProfile(){await updateDoc(doc(fs,'users',me.uid),{coins:me.coins||0,purchases:me.purchases||[],checkInDate:me.checkin||'',updatedAt:serverTimestamp()})}
function loginPage(){clearInterval(bannerTimer);me=null;app(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><p class="hint">8-bit 地理冒險學習平台 · 尋回被怪盜偷走的願望之石！</p><div class="tabs"><button onclick="loginTab('student')">學生登入</button><button class="soft" onclick="loginTab('reg')">學生申請帳戶</button><button class="gold" onclick="loginTab('teacher')">教師登入</button></div><div id="authBox"></div></section></main>`);loginTab('student')}
window.loginTab=t=>{const b=$('authBox');if(t==='teacher'){b.innerHTML=`<h2>教師 Firebase 登入</h2><label class="field">教師電郵<input id="tEmail" type="email" autocomplete="username"></label><label class="field">密碼<input id="tPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')teacherLogin()"></label><div id="err" class="error"></div><button class="gold" style="width:100%" onclick="teacherLogin()">教師登入</button>`;return}if(t==='reg'){b.innerHTML=`<label class="field">學生姓名<input id="rName" placeholder="例如：陳小明／test"></label><label class="field">班別<select id="rClass">${['1A','1B','1C','1D','2A','2B','2C','2D','3A','3B','3C','3D'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">密碼<input id="rPass" type="password" placeholder="至少 6 個字元" onkeydown="if(event.key==='Enter')register()"></label><div id="err" class="error"></div><button style="width:100%" onclick="register()">申請帳戶</button><p class="hint">帳戶會以姓名產生系統電郵並同步到 Firebase。</p>`;return}b.innerHTML=`<label class="field">學生姓名／帳戶<input id="liUser" autocomplete="username" placeholder="輸入註冊時的姓名"></label><label class="field">密碼<input id="liPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')studentLogin()"></label><div id="err" class="error"></div><button style="width:100%" onclick="studentLogin()">登入</button><p class="hint">若你在 Firebase Console 手動建立學生帳戶，請使用「教師登入」分頁並輸入完整電郵；或以本頁的學生申請帳戶建立帳戶。</p>`}
async function session(u){const p=await profile(u.uid);if(!p){await signOut(auth);throw{code:'permission-denied',message:'找不到 users profile'}}me={uid:u.uid,name:p.displayName||u.email,role:String(p.role||'student').toLowerCase(),className:p.className||'',grade:Number(p.grade||0),coins:Number(p.coins||0),checkin:p.checkInDate||'',purchases:p.purchases||[],email:u.email};if(me.role==='teacher')teacherHome();else if(me.role==='student'&&[1,2,3].includes(me.grade))home();else{await signOut(auth);throw{code:'permission-denied',message:'學生 profile 必須包含 grade: 1、2 或 3'}}}
window.studentLogin=async()=>{const name=$('liUser').value.trim(),pass=$('liPass').value;if(!name||!pass){$('err').textContent='請輸入帳戶名稱和密碼。';return}$('err').textContent='正在登入…';try{await session(await signInWithEmailAndPassword(auth,accountEmail(name),pass))}catch(e){$('err').textContent=errorText(e)}};window.teacherLogin=async()=>{const email=$('tEmail').value.trim(),pass=$('tPass').value;if(!email||!pass){$('err').textContent='請輸入教師電郵和密碼。';return}$('err').textContent='正在驗證教師身份…';try{await session(await signInWithEmailAndPassword(auth,email,pass))}catch(e){$('err').textContent=errorText(e)}};window.register=async()=>{const name=$('rName').value.trim(),cl=$('rClass').value,pass=$('rPass').value;if(name.length<2){$('err').textContent='請輸入至少兩個字的姓名。';return}if(pass.length<6){$('err').textContent='密碼至少需要六個字元。';return}$('err').textContent='正在建立帳戶…';try{const u=await createUserWithEmailAndPassword(auth,accountEmail(name),pass),g=Number(cl[0]);await setDoc(doc(fs,'users',u.user.uid),{displayName:name,className:cl,grade:g,role:'student',coins:2,purchases:[],checkInDate:'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await session(u.user)}catch(e){$('err').textContent=errorText(e)}};
function nav(){return `<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button class="soft" onclick="${me.role==='teacher'?'teacherHome()':'home()'}">主頁</button>${me.role==='teacher'?'<button class="gold" onclick="teacherPanel()">教師控制台</button>':'<button class="soft" onclick="openChat()">聊天</button><button class="gold" onclick="dailyCheckin()">每天簽到</button>'}<button class="danger" onclick="logout()">登出</button></header>`}window.logout=async()=>{await signOut(auth);closeModal();loginPage()};
window.teacherHome=()=>{app(nav()+`<main class="page"><section class="hero"><h1>教師首頁</h1><p>你好，${esc(me.name)}。你的 Firebase 教師身份已驗證。</p><span class="hero-badge">🔒 教師權限</span></section><section class="grid" style="margin-top:16px"><article class="card"><h2>👩‍🏫 題庫控制台</h2><p>直接管理 Firestore 的 questions collection。</p><button class="gold" onclick="teacherPanel()">前往題庫控制台</button></article><article class="card"><h2>☁️ 雲端狀態</h2><p><span class="sync-status">已以教師身份登入 Firebase</span></p><p class="hint">學生會按 users/{uid}.grade 載入專屬題庫。</p></article></section></main>`)};
window.home=()=>{closeModal();clearInterval(bannerTimer);game=null;app(nav()+`<main class="page"><section class="hero" id="hero"><h1>探索我們的城市與自然</h1><p>💡 由地圖、數據與故事開始你的地理旅程。</p><span class="hero-badge">香港自然景觀</span></section><div class="ticker">📢 香港天文台天氣資訊　｜　探索城市與自然的關係</div><section class="grid" style="margin-top:16px"><article class="card"><h2>📖 漫畫式劇情</h2><p>怪盜「霧影狐」偷走了願望之石。與同伴合作、解開地理線索，找回它吧。</p><button onclick="openComic(0)">閱讀故事</button> <button onclick="tutorial()">新手引導</button> <button class="gold" onclick="startGame()">開始冒險</button></article><article class="card"><h2>🌦️ 香港即時天氣（教師示範）</h2><p>氣溫：<b>${data.settings.temp}</b>　濕度：<b>${data.settings.humidity}</b></p><p>雨量：<b>${data.settings.rain}</b>　警告：<b>${data.settings.warning}</b></p></article><article class="card"><h2>📰 地理新聞速報</h2>${data.news.map(n=>`<div class="announcement"><b>${esc(n.title)}</b><br><span class="hint">${n.date} · ${n.cat}</span><p>${esc(n.summary)}</p><button class="soft" onclick="readNews('${n.id}')">閱讀及判斷</button></div>`).join('')}</article></section><section class="card" style="margin-top:16px"><h2>🧭 我的地圖</h2><p><b>${esc(me.name)}</b>（${esc(me.className||'學生')}） <span class="sync-status">☁️ Firebase 帳戶已同步</span></p><p>只可進入中${me.grade}地圖；按下按鈕後將讀取 Firestore 的中${me.grade}題庫。</p><p><span class="badge">💰 ${me.coins} 金幣</span><span class="badge">❤️ 3 生命</span></p><button class="gold" onclick="startGame()">進入中${me.grade}地圖</button> <button class="soft" onclick="shop()">🛒 商店</button></section></main>`)};
window.teacherPanel=()=>{app(nav()+`<main class="page"><h1>👩‍🏫 教師題庫控制台</h1><p><span class="sync-status">🔒 可讀取、建立、修改及刪除 Firestore questions</span></p><section class="card"><h2 id="editorTitle">新增雲端題目</h2><input id="editId" type="hidden"><div class="grid"><label class="field">適用年級<select id="qGrade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">題型<select id="qType"><option value="single">單選題</option><option value="multi">多項選擇題</option><option value="open">開放式題目</option></select></label><label class="field">課題<input id="qTopic" placeholder="例如：天氣及氣候"></label><label class="field">難度<select id="qDifficulty"><option>基本</option><option>進階</option><option>挑戰</option></select></label></div><label class="field">題目<textarea id="qText"></textarea></label><label class="field">選項（每行一項；開放式題可留空）<textarea id="qOptions"></textarea></label><label class="field">正確答案（多項選擇以 | 分隔）<input id="qAnswer"></label><button class="gold" onclick="saveQuestion()">儲存題目</button><button class="soft" onclick="resetEditor()">取消修改</button></section><section class="card"><h2>雲端題庫</h2><label class="field">篩選年級<select id="qFilter" onchange="loadQuestions()"><option value="all">全部年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><button onclick="loadQuestions()">重新讀取題庫</button><div id="qList" class="hint">正在讀取題庫…</div></section></main>`);loadQuestions()};
function editorData(){const type=$('qType').value,a=$('qAnswer').value.trim();return{grade:Number($('qGrade').value),type,topic:$('qTopic').value.trim()||'未分類',difficulty:$('qDifficulty').value,text:$('qText').value.trim(),options:$('qOptions').value.split('\n').map(x=>x.trim()).filter(Boolean),answer:type==='multi'?a.split('|').map(x=>x.trim()).filter(Boolean):a,updatedAt:serverTimestamp(),updatedBy:me.uid}}window.resetEditor=()=>{$('editId').value='';$('editorTitle').textContent='新增雲端題目';$('qGrade').value='1';$('qType').value='single';$('qTopic').value='';$('qDifficulty').value='基本';$('qText').value='';$('qOptions').value='';$('qAnswer').value=''};
window.saveQuestion=async()=>{const q=editorData();if(!q.text){alert('請填寫題目。');return}if(q.type!=='open'&&(!q.options.length||!q.answer)){alert('單選題及多項選擇題需要選項與正確答案。');return}try{const id=$('editId').value;if(id)await updateDoc(doc(fs,'questions',id),q);else await addDoc(collection(fs,'questions'),{...q,createdAt:serverTimestamp(),createdBy:me.uid});resetEditor();await loadQuestions();alert('題目已儲存。')}catch(e){alert(errorText(e))}};
window.loadQuestions=async()=>{const out=$('qList');if(!out)return;out.textContent='正在讀取 Firestore questions…';try{const s=await getDocs(collection(fs,'questions')),filter=$('qFilter').value,rows=[];s.forEach(d=>{const q=d.data();if(filter==='all'||String(q.grade)===filter)rows.push({id:d.id,...q})});rows.sort((a,b)=>a.grade-b.grade);out.innerHTML=rows.length?`<table><tr><th>年級</th><th>課題／題目</th><th>類型</th><th>答案</th><th>操作</th></tr>${rows.map(q=>`<tr><td>中${q.grade}</td><td><b>${esc(q.topic)}</b><br>${esc(q.text)}</td><td>${esc(q.type)}</td><td>${esc(Array.isArray(q.answer)?q.answer.join(' | '):q.answer||'開放式')}</td><td><button onclick="editQuestion('${q.id}')">修改</button> <button class="danger" onclick="deleteQuestion('${q.id}')">刪除</button></td></tr>`).join('')}</table>`:'<div class="empty">這個篩選下沒有題目。請新增題目。</div>'}catch(e){out.innerHTML='<div class="empty">'+esc(errorText(e))+'</div>'}};
window.editQuestion=async id=>{try{const s=await getDoc(doc(fs,'questions',id));if(!s.exists())return;const q=s.data();$('editId').value=id;$('editorTitle').textContent='修改題目';$('qGrade').value=q.grade;$('qType').value=q.type||'single';$('qTopic').value=q.topic||'';$('qDifficulty').value=q.difficulty||'基本';$('qText').value=q.text||'';$('qOptions').value=(q.options||[]).join('\n');$('qAnswer').value=Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'');window.scrollTo({top:0,behavior:'smooth'})}catch(e){alert(errorText(e))}};window.deleteQuestion=async id=>{if(!confirm('確定刪除這題？'))return;try{await deleteDoc(doc(fs,'questions',id));loadQuestions()}catch(e){alert(errorText(e))}};
async function studentQuestions(){const s=await getDocs(query(collection(fs,'questions'),where('grade','==',Number(me.grade)))),qs=[];s.forEach(d=>{const q=d.data();if(q.text)qs.push({id:d.id,...q})});return qs.sort(()=>Math.random()-.5)}window.startGame=async()=>{closeModal();clearInterval(bannerTimer);app(nav()+`<main class="page"><section class="card"><h2>🗺️ 正在進入中${me.grade}地圖</h2><p>正在從 Firestore 載入中${me.grade}題庫…</p></section></main>`);try{const qs=await studentQuestions();if(!qs.length){app(nav()+`<main class="page"><section class="card empty"><h2>中${me.grade}題庫尚未準備好</h2><p>教師尚未新增中${me.grade}題目，因此目前不能開始冒險。</p><p>請通知教師在 questions collection 新增 <code>grade: ${me.grade}</code> 的題目。</p><button class="gold" onclick="home()">返回主頁</button></section></main>`);return}game={x:45,y:70,lives:3,score:0,coins:0,idx:0,qs};renderMap()}catch(e){app(nav()+`<main class="page"><section class="card empty"><h2>無法讀取題庫</h2><p>${esc(errorText(e))}</p><button class="gold" onclick="home()">返回主頁</button></section></main>`)} };
function renderMap(){const total=game.qs.length;app(nav()+`<main class="page"><div class="hud"><span class="badge" id="life">❤️ ❤️ ❤️</span><span class="badge" id="score">⭐ 分數：0</span><span class="badge" id="coin">💰 本局金幣：0</span><span class="badge" id="prog">進度：0/${total}</span><button class="soft" onclick="shop()">商店</button><button class="soft" onclick="openComic(0)">漫畫</button><button class="soft" onclick="home()">返回主頁</button></div><div class="map"><div class="road" style="left:5%;top:42%;width:88%;height:32px"></div><div class="road" style="left:47%;top:10%;width:32px;height:76%"></div><div class="sign" style="left:7%;top:29%">🪧<div class="hint">中${me.grade}地理島</div></div><div class="npc" style="left:18%;top:58%" onclick="clue()">🦉<div class="hint">貓頭鷹老師</div></div><div class="npc" style="left:70%;top:17%" onclick="clue()">🐼<div class="hint">熊貓嚮導</div></div><div class="monster" style="left:72%;top:65%" onclick="encounter()">👾<div class="hint">迷途小怪</div></div><div class="monster" style="left:32%;top:15%" onclick="encounter()">🦖<div class="hint">雲霧龍</div></div><div class="player" id="player" style="left:45%;top:70%">🧑‍🚀</div><div class="mapnote">點擊怪物開始作答；點擊 NPC 取得線索。</div></div><div class="move"><button onclick="move(0,-1)">▲</button><button onclick="move(-1,0)">◀</button><button onclick="move(1,0)">▶</button><button onclick="move(0,1)">▼</button></div></main>`);document.onkeydown=e=>{const d={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}}}window.move=(dx,dy)=>{if(!game)return;game.x=Math.max(2,Math.min(92,game.x+dx*4));game.y=Math.max(2,Math.min(88,game.y+dy*4));const p=$('player');if(p){p.style.left=game.x+'%';p.style.top=game.y+'%'}};window.clue=()=>modal(`<h2>🦉 地理線索</h2><p>仔細觀察天氣、地圖、自然環境與人類活動之間的關係。</p><button onclick="closeModal()">繼續探索</button>`);
window.encounter=()=>{if(!game)return;if(game.idx>=game.qs.length){finish();return}ask(game.qs[game.idx])};function ask(q){let t=30;let body=`<h2>⚔️ 地理挑戰</h2><div id="timer" class="badge">⏱️ 30 秒</div><div class="bar"><i id="timebar" style="width:100%"></i></div><p><b>${esc(q.text)}</b></p>`;if(q.type==='open')body+=`<label class="field">你的答案<textarea id="openAns"></textarea></label><button class="green" onclick="submitOpen('${q.id}')">提交答案</button>`;else body+=`<div class="answers">${(q.options||[]).map((o,i)=>`<button onclick="answer('${q.id}',${i})">${esc(o)}</button>`).join('')}</div>`;modal(body);window.timerId=setInterval(()=>{t--;const el=$('timer'),bar=$('timebar');if(!el){clearInterval(window.timerId);return}el.textContent='⏱️ '+t+' 秒';if(bar)bar.style.width=(t/30*100)+'%';if(t<=0){clearInterval(window.timerId);answer(q.id,-1,true)}},1000)}window.submitOpen=id=>{const q=game.qs.find(x=>x.id===id),v=$('openAns').value.trim();if(!v)return;clearInterval(window.timerId);if(!q.answer){game.idx++;modal('<h2>已提交</h2><p>這是開放式題目，請由教師評閱。</p><button onclick="closeModal()">繼續</button>');updateHUD();return}complete(q,v===String(q.answer).trim(),q.answer)};window.answer=(id,index,timeout=false)=>{clearInterval(window.timerId);const q=game.qs.find(x=>x.id===id),selected=index>=0?(q.options||[])[index]:'';if(q.type==='multi'){modal(`<h2>多項選擇提示</h2><p>目前遊戲地圖請優先使用單選題或開放式題目。正確答案：${esc((q.answer||[]).join('、'))}</p><button onclick="closeModal()">繼續</button>`);game.idx++;updateHUD();return}complete(q,selected===q.answer,q.answer,timeout)};function complete(q,ok,ans,timeout=false){game.idx++;if(ok){game.score+=100;game.coins+=50;modal('<h2>✨ 答對了！</h2><p>獲得 50 金幣和 100 分。</p><button onclick="closeModal()">繼續</button>')}else{game.lives--;modal(`<h2>${timeout?'⏰ 時間到了！':'💫 再接再厲！'}</h2><p>正確答案：${esc(Array.isArray(ans)?ans.join('、'):ans||'由教師評閱')}。剩下 ${game.lives} 條生命。</p><button onclick="${game.lives>0?'closeModal()':'startGame()'}">${game.lives>0?'繼續':'重新開始'}</button>`)}updateHUD();if(game.idx>=game.qs.length&&game.lives>0)setTimeout(finish,300)}function updateHUD(){if(!game)return;$('life').textContent='❤️ '.repeat(game.lives)+'🖤 '.repeat(3-game.lives);$('score').textContent='⭐ 分數：'+game.score;$('coin').textContent='💰 本局金幣：'+game.coins;$('prog').textContent='進度：'+game.idx+'/'+game.qs.length}async function finish(){if(!game)return;const earned=game.coins;me.coins+=earned;try{await setProfile()}catch(e){}game=null;modal(`<h2>🏆 冒險完成！</h2><p>你獲得 ${earned} 金幣。</p><button onclick="home()">返回主頁</button>`)}
window.openComic=p=>{comicPage=Math.max(0,Math.min(COMIC.length-1,p));const x=COMIC[comicPage],b=x.kind?`<div class="comic-intro"><div class="comic-page-label">故事背景</div><h1>${esc(x.title)}</h1><p>${esc(x.text)}</p></div>`:`<div class="comic-panel"><img src="${x.img}" alt="${esc(x.title)}"><div class="comic-caption"><h2>${esc(x.title)}</h2><p>${esc(x.text)}</p></div></div>`;modal(`${b}<div class="comic-controls"><button class="soft" onclick="${comicPage?'openComic('+(comicPage-1)+')':'closeModal()'}">${comicPage?'← 上一頁':'關閉'}</button><span class="comic-progress">第 ${comicPage+1}/${COMIC.length} 頁</span><button class="gold" onclick="${comicPage===COMIC.length-1?'closeModal()':'openComic('+(comicPage+1)+')'}">${comicPage===COMIC.length-1?'開始冒險！':'下一頁 →'}</button></div>`)};window.tutorial=()=>modal('<h2>🎮 新手引導</h2><ol><li>用按鈕、方向鍵或 WASD 移動角色。</li><li>點擊 NPC 取得地理線索。</li><li>點擊怪物開始雲端題庫挑戰。</li><li>答對可獲得金幣；題庫按你的年級載入。</li></ol><button onclick="closeModal()">明白了！</button>');window.readNews=()=>modal(`<h2>📰 ${data.news[0].title}</h2><p>${data.news[0].summary}</p><button onclick="closeModal()">關閉</button>`);window.openChat=()=>modal('<h2>💬 一對一聊天</h2><p>私訊功能將在下一階段啟用。</p><button onclick="closeModal()">關閉</button>');window.dailyCheckin=async()=>{if(me.checkin===today()){modal('<h2>今天已簽到</h2><p>明天再回來可獲得 2 金幣。</p><button onclick="closeModal()">關閉</button>');return}me.checkin=today();me.coins+=2;try{await setProfile();modal('<h2>🎁 簽到成功</h2><p>獲得 2 金幣，資料已同步。</p><button onclick="home()">太好了</button>')}catch(e){alert(errorText(e))}};window.shop=()=>modal(`<h2>🛒 地理商店</h2><p>你的金幣：${me.coins}</p><div class="grid">${data.shop.map(s=>`<div class="card"><b>${esc(s.name)}</b><p>${esc(s.desc)}</p><span class="badge">💰 ${s.cost}</span><br><button onclick="buy('${s.id}')">購買</button></div>`).join('')}</div><button class="soft" onclick="closeModal()">關閉</button>`);window.buy=async id=>{const s=data.shop.find(x=>x.id===id);if(!s||me.coins<s.cost){alert('金幣不足。');return}me.coins-=s.cost;me.purchases.push(id);try{await setProfile();alert('購買成功：'+s.name);shop()}catch(e){alert(errorText(e))}};window.closeModal=closeModal;
loginPage();
</script></body></html>
