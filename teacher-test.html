<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香港地理 Quest｜教師登入診斷版</title>
<style>
body{margin:0;background:#dff4ff;color:#14233f;font-family:Arial,"Microsoft JhengHei",sans-serif}.box{max-width:560px;margin:8vh auto;background:#fffdf5;border:4px solid #14233f;border-radius:14px;padding:25px;box-shadow:8px 8px #80b2d5}.logo{text-align:center;font-size:28px;font-weight:bold;color:#2475d9}.field{display:block;font-weight:bold;margin:14px 0}.field input{display:block;width:100%;padding:11px;margin-top:6px;border:2px solid #91a7c1;border-radius:7px;box-sizing:border-box;font-size:16px}button{padding:11px 15px;border:0;border-radius:7px;background:#ffc833;color:#4b3100;font-weight:bold;cursor:pointer;box-shadow:0 3px #a66f00;font-size:16px;width:100%}.status{white-space:pre-wrap;min-height:72px;padding:10px;border-radius:6px;background:#edf3f7;color:#14233f}.status.error{background:#ffe2e6;color:#a61d32}.status.ok{background:#e2f5e9;color:#12613a}.hint{color:#496078;font-size:14px;line-height:1.5}code,pre{background:#edf3f7;padding:4px;border-radius:4px;overflow:auto}hr{border:0;border-top:1px solid #bdd0df;margin:20px 0}
</style>
</head>
<body>
<main class="box">
  <div class="logo">🗺️ 香港地理 Quest</div>
  <h2>教師 Firebase 登入診斷</h2>
  <p class="hint">此版本使用非模組 Firebase SDK，避免瀏覽器或 GitHub Pages 的 module script 載入問題。</p>
  <label class="field">教師 Firebase 電郵<input id="email" type="email" autocomplete="username"></label>
  <label class="field">密碼<input id="password" type="password" autocomplete="current-password"></label>
  <button id="loginBtn" type="button">登入測試</button>
  <p id="status" class="status">正在載入 Firebase SDK…</p>
  <hr>
  <p class="hint">正確資料位置：<code>users/{Firebase Authentication UID}</code>，文件欄位需是 <code>role: "teacher"</code>。</p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
  var status=document.getElementById('status');
  function show(text,type){status.className='status '+(type||'');status.textContent=text}
  var cfg={apiKey:'AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4',authDomain:'hk-geography-quest.firebaseapp.com',projectId:'hk-geography-quest',storageBucket:'hk-geography-quest.firebasestorage.app',messagingSenderId:'418307975863',appId:'1:418307975863:web:6e8c259e0ba723d7ec3b32'};
  var auth,db;
  try{
    if(!window.firebase) throw new Error('Firebase SDK 未能由 Google CDN 載入。');
    firebase.initializeApp(cfg);
    auth=firebase.auth();
    db=firebase.firestore();
    show('Firebase SDK 載入成功。請輸入教師電郵和密碼。','ok');
  }catch(e){show('Firebase 初始化失敗：\n'+e.message,'error');return}
  function explain(e){
    var m={'auth/invalid-credential':'Authentication：電郵或密碼不正確。','auth/user-not-found':'Authentication：找不到這個電郵帳戶。','auth/wrong-password':'Authentication：密碼不正確。','auth/too-many-requests':'Authentication：嘗試次數太多，請稍後再試。','auth/network-request-failed':'網絡連線失敗。','permission-denied':'Firestore Rules 拒絕讀取教師 profile。','unavailable':'Firestore 暫時無法連線。'};
    return (m[e.code]||e.code||'未知錯誤')+'\n'+(e.message||'');
  }
  document.getElementById('loginBtn').addEventListener('click',function(){
    var email=document.getElementById('email').value.trim();
    var password=document.getElementById('password').value;
    if(!email||!password){show('請輸入電郵和密碼。','error');return}
    show('正在驗證 Firebase Authentication…');
    auth.signInWithEmailAndPassword(email,password).then(function(cred){
      var uid=cred.user.uid;
      show('Authentication 登入成功。\nUID：'+uid+'\n正在讀取 Firestore users/'+uid+'…');
      return db.collection('users').doc(uid).get().then(function(snap){
        if(!snap.exists){show('Authentication 成功，但找不到教師 profile：\nusers/'+uid+'\n\n請將這個 UID 設為 users collection 的文件 ID。','error');return}
        var data=snap.data()||{};
        if(String(data.role||'').toLowerCase()!=='teacher'){
          show('Authentication 成功，但 role 不符合。\n目前 role：'+(data.role||'未設定')+'\n需要：teacher','error');return
        }
        show('✅ 教師登入測試成功！\nUID：'+uid+'\n顯示名稱：'+(data.displayName||'')+'\n角色：'+data.role+'\n\nAuthentication、Firestore 文件和 Rules 均正常。','ok');
      });
    }).catch(function(e){show(explain(e),'error')});
  });
})();
</script>
</body>
</html>
