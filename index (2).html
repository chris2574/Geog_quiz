<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港地理 Quest｜完整遊戲及題庫同步版</title><style>
:root{--ink:#14233f;--blue:#2475d9;--gold:#ffc833;--green:#2faf69;--red:#e74b5b;--card:#fffdf5}*{box-sizing:border-box}body{margin:0;background:#dff4ff;color:var(--ink);font-family:ui-monospace,Consolas,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:bold;box-shadow:0 3px #123d77;margin:3px}.danger{background:var(--red)}.soft{background:#eaf4ff;color:var(--ink);box-shadow:0 3px #9bb8d2}.gold{background:var(--gold);color:#4b3100;box-shadow:0 3px #a66f00}.screen{min-height:100vh;padding:20px}.login{max-width:520px;margin:8vh auto;background:var(--card);padding:25px;border:4px solid var(--ink);box-shadow:8px 8px #80b2d5;border-radius:14px}.logo{text-align:center;font-size:2em;font-weight:900;color:var(--blue)}.tabs,.tools,.hud{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0}.tabs button{flex:1}.field{display:block;margin:12px 0;font-weight:bold}.field input,.field select,.field textarea{display:block;width:100%;padding:10px;margin-top:6px;border:2px solid #91a7c1;border-radius:7px;background:#fff}.field textarea{min-height:75px}.hint{font-size:.87em;color:#496078}.error{min-height:22px;color:#b21f34;font-weight:bold;white-space:pre-wrap}.topbar{position:sticky;top:0;z-index:4;background:#fffdf5;border-bottom:4px solid var(--ink);display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 18px}.topbar .brand{font-weight:900;font-size:1.2em;margin-right:auto}.page{max-width:1180px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:16px;box-shadow:5px 5px #9ec3dc}.hero{height:250px;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:linear-gradient(#83d4ff 0 60%,#82c767 60%);padding:26px;color:#fff;text-shadow:2px 2px #19365b}.hero h1{margin:0 0 10px}.hero-badge,.badge,.sync-status{display:inline-block;background:#fff;color:var(--ink);padding:5px 8px;border-radius:5px;border:2px solid var(--ink);margin:3px}.sync-status{background:#e2f5e9;color:#12613a;border-color:#75c799}.sync-status.warn,.empty{background:#fff4d4;color:#704f00;border:2px solid #e3bd57;border-radius:8px;padding:15px}table{width:100%;border-collapse:collapse;background:#fff;font-size:.9em}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left;vertical-align:top}th{background:#d9efff}.map{height:500px;position:relative;overflow:hidden;background:linear-gradient(#7fd4ff 0 30%,#8ed176 30% 100%);border:4px solid var(--ink);border-radius:12px}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,#64b457 32px 34px),repeating-linear-gradient(90deg,transparent 0 31px,#64b457 32px 34px);opacity:.42}.road{position:absolute;background:#dfc482;border:3px solid #987c49;border-radius:20px}.player,.npc,.monster,.sign{position:absolute;z-index:2;text-align:center;font-size:34px;line-height:36px}.npc,.monster{cursor:pointer}.player{transition:left .1s,top .1s}.mapnote{position:absolute;z-index:3;bottom:10px;left:10px;background:#fffdf5;border:2px solid var(--ink);padding:7px;border-radius:6px}.move{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:13px}.move button:first-child{grid-column:2}.move button:last-child{grid-column:2}.modal{position:fixed;z-index:10;inset:0;background:#0009;display:grid;place-items:center;padding:14px}.dialog{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:#fffdf5;border:4px solid var(--ink);border-radius:12px;padding:20px}.answers{display:grid;gap:10px}.answers button{text-align:left}@media(max-width:600px){.screen{padding:12px}.topbar .brand{width:100%}.login{margin:3vh auto}.map{height:420px}}
</style></head><body><div id="app"></div><div id="modal"></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,collection,getDocs,addDoc,updateDoc,deleteDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDjjGSI9BAtcOSzsosg3w97Nu2XtmE5GH4",authDomain:"hk-geography-quest.firebaseapp.com",projectId:"hk-geography-quest",storageBucket:"hk-geography-quest.firebasestorage.app",messagingSenderId:"418307975863",appId:"1:418307975863:web:6e8c259e0ba723d7ec3b32"};const firebaseApp=initializeApp(cfg),auth=getAuth(firebaseApp),db=getFirestore(firebaseApp);let me=null,game=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function ferr(e){return(e?.code||'操作失敗')+'\n'+(e?.message||'未知 Firebase 錯誤')}function view(h){$('app').innerHTML=h}function modal(h){$('modal').innerHTML=h?`<div class="modal"><div class="dialog">${h}</div></div>`:''}function closeModal(){modal('')}function studentEmail(n){const hex=[...new TextEncoder().encode(n.trim().normalize('NFKC').toLowerCase())].map(x=>x.toString(16).padStart(2,'0')).join('');return`student_${hex}@hkgeographyquest.student`}
function loginPage(){view(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><p class="hint">完整學生遊戲・教師題庫編輯・Firebase 同步</p><div class="tabs"><button onclick="loginTab('student')">學生登入</button><button class="soft" onclick="loginTab('register')">學生申請帳戶</button><button class="gold" onclick="loginTab('teacher')">教師登入</button></div><div id="authBox"></div></section></main>`);loginTab('student')}window.loginTab=t=>{if(t==='teacher'){$('authBox').innerHTML=`<h2>教師 Firebase 登入</h2><label class="field">教師電郵<input id="tEmail" type="email"></label><label class="field">密碼<input id="tPass" type="password" onkeydown="if(event.key==='Enter')teacherLogin()"></label><div id="authError" class="error"></div><button class="gold" style="width:100%" onclick="teacherLogin()">教師登入</button>`;return}if(t==='register'){$('authBox').innerHTML=`<h2>學生申請帳戶</h2><label class="field">學生姓名<input id="rName"></label><label class="field">班別<select id="rClass"><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option></select></label><label class="field">密碼<input id="rPass" type="password"></label><div id="authError" class="error"></div><button style="width:100%" onclick="registerStudent()">申請帳戶</button>`;return}$('authBox').innerHTML=`<h2>學生登入</h2><label class="field">學生姓名／帳戶<input id="sName"></label><label class="field">密碼<input id="sPass" type="password" onkeydown="if(event.key==='Enter')studentLogin()"></label><div id="authError" class="error"></div><button style="width:100%" onclick="studentLogin()">學生登入</button>`};async function enter(cred){const p=await getDoc(doc(db,'users',cred.user.uid));if(!p.exists())throw Error('找不到 users/{uid} profile。');const x=p.data();me={uid:cred.user.uid,email:cred.user.email,name:x.displayName||cred.user.email,role:String(x.role||'student').toLowerCase(),grade:Number(x.grade||0),className:x.className||'',coins:Number(x.coins||0),purchases:x.purchases||[]};if(me.role==='teacher')teacherHome();else if(me.role==='student'&&[1,2,3].includes(me.grade))home();else throw Error('學生 profile 必須有 grade 1、2 或 3。')}window.teacherLogin=async()=>{try{await enter(await signInWithEmailAndPassword(auth,$('tEmail').value.trim(),$('tPass').value))}catch(e){$('authError').textContent=ferr(e)}};window.studentLogin=async()=>{try{await enter(await signInWithEmailAndPassword(auth,studentEmail($('sName').value),$('sPass').value))}catch(e){$('authError').textContent=ferr(e)}};window.registerStudent=async()=>{try{const n=$('rName').value.trim(),cl=$('rClass').value,p=$('rPass').value;if(n.length<2||p.length<6)throw Error('請輸入有效姓名及至少六位密碼。');const c=await createUserWithEmailAndPassword(auth,studentEmail(n),p);await setDoc(doc(db,'users',c.user.uid),{displayName:n,className:cl,grade:Number(cl[0]),role:'student',coins:2,purchases:[],createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await enter(c)}catch(e){$('authError').textContent=ferr(e)}};window.logout=async()=>{await signOut(auth);me=null;game=null;loginPage()};function nav(){return`<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button class="soft" onclick="${me.role==='teacher'?'teacherHome()':'home()'}">主頁</button>${me.role==='teacher'?'<button class="gold" onclick="teacherPanel()">教師控制台</button>':'<button class="soft" onclick="shop()">🛒 商店</button>'}<button class="danger" onclick="logout()">登出</button></header>`}function teacherHome(){view(nav()+`<main class="page"><section class="hero"><h1>教師首頁</h1><p>Firebase 教師身份已確認。</p></section><section class="card"><button class="gold" onclick="teacherPanel()">前往教師控制台</button></section></main>`)}function home(){view(nav()+`<main class="page"><section class="hero"><h1>探索我們的城市與自然</h1><p>由地圖、數據與故事開始你的地理旅程。</p><span class="hero-badge">香港自然景觀</span></section><div class="grid" style="margin-top:16px"><section class="card"><h2>📖 漫畫式劇情</h2><p>怪盜霧影狐偷走了願望之石。與同伴合作，解開地理線索吧！</p><button onclick="story()">閱讀故事</button><button class="gold" onclick="startGame()">開始冒險</button></section><section class="card"><h2>🌦️ 香港天氣</h2><p>氣溫：30°C　濕度：78%</p><p>雨量：0 mm　暫無特別天氣警告</p></section><section class="card"><h2>📰 地理新聞速報</h2><p>閱讀天氣資料，思考天氣如何影響日常生活。</p></section></div><section class="card" style="margin-top:16px"><h2>🧭 我的地圖</h2><p><b>${esc(me.name)}</b>（${esc(me.className)}）　<span class="sync-status">☁️ Firebase 已同步</span></p><p><span class="badge">💰 ${me.coins} 金幣</span><span class="badge">❤️ 3 生命</span></p><button class="gold" onclick="startGame()">進入中${me.grade}地圖</button><button class="soft" onclick="shop()">商店</button></section></main>`)}
function teacherPanel(){view(nav()+`<main class="page"><h1>👩‍🏫 教師控制台</h1><p><span class="sync-status">Firebase 教師權限已確認</span></p><div class="tools"><button onclick="teacherTab('overview')">控制台總覽</button><button onclick="teacherTab('questions')">題庫／編輯</button><button onclick="teacherTab('shop')">商店管理</button></div><div id="teacherContent"></div></main>`);teacherTab('overview')}
window.teacherTab=async tab=>{const c=$('teacherContent');if(tab==='questions'){c.innerHTML=`<section class="card"><h2 id="qTitle">新增雲端題目</h2><input id="qId" type="hidden"><div class="grid"><label class="field">適用年級<select id="qGrade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">題型<select id="qType"><option value="single">單選題</option><option value="multi">多項選擇題</option><option value="open">開放式題目</option></select></label><label class="field">課題<input id="qTopic"></label><label class="field">難度<select id="qDiff"><option>基本</option><option>進階</option><option>挑戰</option></select></label></div><label class="field">題目內容<textarea id="qText"></textarea></label><label class="field">選項（每行一項）<textarea id="qOpts"></textarea></label><label class="field">正確答案（多項以 | 分隔）<input id="qAns"></label><button class="gold" onclick="saveQuestion()">儲存題目</button><button class="soft" onclick="resetQuestion()">取消修改</button></section><section class="card"><h2>Firestore questions</h2><select id="qFilter" onchange="loadQuestions()"><option value="all">全部年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select><button onclick="loadQuestions()">重新讀取</button><div id="qList">正在讀取…</div></section>`;return loadQuestions()}if(tab==='shop'){c.innerHTML=`<section class="card"><h2 id="shopTitle">新增商店商品</h2><input id="shopId" type="hidden"><div class="grid"><label class="field">商品名稱<input id="shopName"></label><label class="field">價格<input id="shopCost" type="number" min="0" step="1"></label></div><label class="field">說明<textarea id="shopDesc"></textarea></label><label class="field">圖片網址<input id="shopImg" type="url"></label><button class="gold" onclick="saveShopItem()">儲存商品</button><button class="soft" onclick="resetShopForm()">取消修改</button></section><section class="card"><h2>Firestore shopItems</h2><button onclick="loadShopItems()">重新讀取</button><div id="shopList">正在讀取…</div></section>`;return loadShopItems()}c.innerHTML='<section class="card"><h2>控制台總覽</h2><p>題庫及商店均已接入 Firestore。</p></section>'};window.saveQuestion=async()=>{try{const type=$('qType').value,a=$('qAns').value.trim(),q={grade:Number($('qGrade').value),type,topic:$('qTopic').value.trim()||'未分類',difficulty:$('qDiff').value,text:$('qText').value.trim(),options:$('qOpts').value.split('\n').map(x=>x.trim()).filter(Boolean),answer:type==='multi'?a.split('|').map(x=>x.trim()).filter(Boolean):a,updatedAt:serverTimestamp(),updatedBy:me.uid};if(!q.text)throw Error('請輸入題目。');if(type!=='open'&&(!q.options.length||!q.answer))throw Error('需要選項及答案。');const id=$('qId').value;if(id)await updateDoc(doc(db,'questions',id),q);else await addDoc(collection(db,'questions'),{...q,createdAt:serverTimestamp(),createdBy:me.uid});resetQuestion();await loadQuestions();alert('題目已同步。')}catch(e){alert(ferr(e))}};window.resetQuestion=()=>{if(!$('qId'))return;$('qId').value='';$('qTitle').textContent='新增雲端題目';$('qGrade').value='1';$('qType').value='single';$('qTopic').value='';$('qDiff').value='基本';$('qText').value='';$('qOpts').value='';$('qAns').value=''};window.loadQuestions=async()=>{const o=$('qList');if(!o)return;try{const f=$('qFilter').value,s=await getDocs(collection(db,'questions')),a=s.docs.map(d=>({id:d.id,...d.data()})).filter(q=>f==='all'||String(q.grade)===f);o.innerHTML=a.length?`<table><tr><th>年級</th><th>課題／題目</th><th>類型</th><th>答案</th><th>操作</th></tr>${a.map(q=>`<tr><td>中${q.grade}</td><td><b>${esc(q.topic||'')}</b><br>${esc(q.text||'')}</td><td>${esc(q.type||'')}</td><td>${esc(Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'開放式'))}</td><td><button onclick="editQuestion('${q.id}')">修改</button><button class="danger" onclick="deleteQuestion('${q.id}')">刪除</button></td></tr>`).join('')}</table>`:'<div class="empty">沒有題目。</div>'}catch(e){o.innerHTML='<p class="error">'+esc(ferr(e))+'</p>'}};window.editQuestion=async id=>{const s=await getDoc(doc(db,'questions',id));if(!s.exists())return;const q=s.data();$('qId').value=id;$('qTitle').textContent='修改題目：'+id;$('qGrade').value=q.grade;$('qType').value=q.type||'single';$('qTopic').value=q.topic||'';$('qDiff').value=q.difficulty||'基本';$('qText').value=q.text||'';$('qOpts').value=(q.options||[]).join('\n');$('qAns').value=Array.isArray(q.answer)?q.answer.join(' | '):(q.answer||'');scrollTo({top:0,behavior:'smooth'})};window.deleteQuestion=async id=>{if(!confirm('確定刪除題目？'))return;await deleteDoc(doc(db,'questions',id));loadQuestions()};
window.saveShopItem=async()=>{try{const n=$('shopName').value.trim(),cost=Number($('shopCost').value),p={name:n,cost,desc:$('shopDesc').value.trim(),img:$('shopImg').value.trim(),updatedAt:serverTimestamp(),updatedBy:me.uid};if(!n||!Number.isInteger(cost)||cost<0)throw Error('請輸入有效商品名稱及價格。');const id=$('shopId').value;if(id)await updateDoc(doc(db,'shopItems',id),p);else await addDoc(collection(db,'shopItems'),{...p,createdAt:serverTimestamp(),createdBy:me.uid});resetShopForm();loadShopItems();alert('商品已同步。')}catch(e){alert(ferr(e))}};window.resetShopForm=()=>{if(!$('shopId'))return;$('shopId').value='';$('shopTitle').textContent='新增商店商品';$('shopName').value='';$('shopCost').value='';$('shopDesc').value='';$('shopImg').value=''};window.loadShopItems=async()=>{const o=$('shopList');if(!o)return;try{const s=await getDocs(collection(db,'shopItems')),a=s.docs.map(d=>({id:d.id,...d.data()}));o.innerHTML=a.length?`<table><tr><th>商品</th><th>價格</th><th>說明</th><th>操作</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.cost}</td><td>${esc(x.desc||'')}</td><td><button onclick="editShopItem('${x.id}')">修改</button><button class="danger" onclick="deleteShopItem('${x.id}')">刪除</button></td></tr>`).join('')}</table>`:'<div class="empty">尚未有商品。</div>'}catch(e){o.innerHTML='<p class="error">'+esc(ferr(e))+'</p>'}};window.editShopItem=async id=>{const s=await getDoc(doc(db,'shopItems',id));if(!s.exists())return;const x=s.data();$('shopId').value=id;$('shopTitle').textContent='修改商品：'+id;$('shopName').value=x.name||'';$('shopCost').value=x.cost??'';$('shopDesc').value=x.desc||'';$('shopImg').value=x.img||'';scrollTo({top:0,behavior:'smooth'})};window.deleteShopItem=async id=>{if(!confirm('確定刪除商品？'))return;await deleteDoc(doc(db,'shopItems',id));loadShopItems()};async function updateStudentProfile(){await updateDoc(doc(db,'users',me.uid),{coins:me.coins||0,purchases:me.purchases||[],updatedAt:serverTimestamp()})}window.shop=async()=>{try{const s=await getDocs(collection(db,'shopItems')),a=s.docs.map(d=>({id:d.id,...d.data()}));modal(`<h2>🛒 商店</h2><p>你的金幣：${me.coins}</p><div class="grid">${a.map(x=>`<div class="card"><b>${esc(x.name)}</b><p>${esc(x.desc||'')}</p><span class="badge">💰 ${x.cost}</span></div>`).join('')}</div><button onclick="closeModal()">關閉</button>`)}catch(e){modal('<p>'+esc(ferr(e))+'</p><button onclick="closeModal()">關閉</button>')}};window.startGame=async()=>{try{const s=await getDocs(query(collection(db,'questions'),where('grade','==',me.grade))),qs=s.docs.map(d=>({id:d.id,...d.data()}));if(!qs.length){modal(`<h2>中${me.grade}題庫尚未準備好</h2><p>請通知教師新增此年級題目。</p><button onclick="closeModal()">關閉</button>`);return}game={qs,idx:0,coins:0,score:0,lives:3,x:45,y:70};renderMap()}catch(e){modal('<p>'+esc(ferr(e))+'</p><button onclick="closeModal()">關閉</button>')}};function renderMap(){view(nav()+`<main class="page"><div class="hud"><span class="badge" id="lives">❤️ ❤️ ❤️</span><span class="badge" id="score">⭐ 0</span><span class="badge" id="progress">0/${game.qs.length}</span></div><div class="map"><div class="road" style="left:5%;top:42%;width:88%;height:32px"></div><div class="road" style="left:47%;top:10%;width:32px;height:76%"></div><div class="sign" style="left:7%;top:29%">🪧<div class="hint">中${me.grade}地理島</div></div><div class="npc" style="left:18%;top:58%" onclick="clue()">🦉</div><div class="monster" style="left:72%;top:65%" onclick="encounter()">👾</div><div class="player" id="player" style="left:45%;top:70%">🧑‍🚀</div><div class="mapnote">點擊 👾 開始同步題庫挑戰。</div></div><div class="move"><button onclick="move(0,-1)">▲</button><button onclick="move(-1,0)">◀</button><button onclick="move(1,0)">▶</button><button onclick="move(0,1)">▼</button></div></main>`)}window.move=(x,y)=>{if(!game)return;game.x=Math.max(2,Math.min(92,game.x+x*4));game.y=Math.max(2,Math.min(88,game.y+y*4));$('player').style.left=game.x+'%';$('player').style.top=game.y+'%'};window.clue=()=>modal('<h2>🦉 地理線索</h2><p>觀察地圖、天氣與人類活動的關係。</p><button onclick="closeModal()">繼續</button>');window.encounter=()=>{if(game&&game.idx<game.qs.length)ask(game.qs[game.idx])};function ask(q){if(q.type==='open'){modal(`<h2>⚔️ 地理挑戰</h2><p><b>${esc(q.text)}</b></p><textarea id="openAnswer" style="width:100%;min-height:90px"></textarea><button onclick="submitOpen()">提交</button>`);return}modal(`<h2>⚔️ 地理挑戰</h2><p><b>${esc(q.text)}</b></p><div class="answers">${(q.options||[]).map((o,i)=>`<button onclick="answer(${i})">${esc(o)}</button>`).join('')}</div>`)}window.submitOpen=()=>{const q=game.qs[game.idx],v=$('openAnswer').value.trim();game.idx++;if(q.answer&&v===q.answer){game.coins+=50;game.score+=100}updateGame();nextGame()};window.answer=i=>{const q=game.qs[game.idx],selected=(q.options||[])[i],ok=Array.isArray(q.answer)?q.answer.includes(selected):selected===q.answer;game.idx++;if(ok){game.coins+=50;game.score+=100}else game.lives--;updateGame();nextGame()};function updateGame(){if($('lives'))$('lives').textContent='❤️ '.repeat(game.lives)+'🖤 '.repeat(3-game.lives);if($('score'))$('score').textContent='⭐ '+game.score;if($('progress'))$('progress').textContent=game.idx+'/'+game.qs.length}function nextGame(){closeModal();if(game.idx>=game.qs.length||game.lives<=0){const coins=game.coins;me.coins+=coins;updateStudentProfile().catch(()=>{});game=null;modal(`<h2>🏆 遊戲完成</h2><p>本局獲得 ${coins} 金幣。</p><button onclick="home()">返回主頁</button>`)}}window.story=()=>modal('<h2>📖 願望之石</h2><p>怪盜霧影狐偷走了願望之石；請用地理知識找回它。</p><button onclick="closeModal()">關閉</button>');loginPage();</script></body></html>
