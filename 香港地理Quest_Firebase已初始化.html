<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>香港地理 Quest — Firebase 初始化版</title><style>

;padding:26px;color:#fff;text-shadow:2px 2px #19365b}.hero:before{content:"";position:absolute;inset:auto 8% 20px 8%;height:65px;background:#5d9a58;clip-path:polygon(0 100%,18% 30%,28% 70%,45% 0,60% 70%,75% 20%,100% 100%)}.hero h1,.hero p{position:relative;z-index:1;margin:0 0 10px}.hero .hero-badge{position:relative;z-index:1;display:inline-block;background:#fff;color:var(--ink);padding:5px 8px;border-radius:5px;border:2px solid var(--ink);margin:0;text-shadow:none;line-height:1.15;white-space:nowrap}.badge{display:inline-block;background:#fff;color:var(--ink);padding:4px 7px;border-radius:5px;border:2px solid var(--ink);margin:3px}.ticker{background:#152b50;color:#fff;padding:9px;border-radius:7px;white-space:nowrap;overflow:hidden}.map{height:530px;position:relative;overflow:hidden;background:linear-gradient(#7fd4ff 0 30%,#8ed176 30% 100%);border:4px solid var(--ink);border-radius:12px}.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,#64b457 32px 34px),repeating-linear-gradient(90deg,transparent 0 31px,#64b457 32px 34px);opacity:.42}.road{position:absolute;background:#dfc482;border:3px solid #987c49;border-radius:20px}.player,.npc,.monster,.sign{position:absolute;z-index:2;text-align:center;font-size:34px;line-height:36px;user-select:none}.player{transition:left .09s,top .09s}.npc,.monster{cursor:pointer}.sign{font-size:27px}.mapnote{position:absolute;z-index:3;bottom:10px;left:10px;background:#fffdf5;border:2px solid var(--ink);padding:7px;border-radius:6px}.move{display:grid;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:13px}.move button{padding:10px}.move button:first-child{grid-column:2}.move button:last-child{grid-column:2}.modal{position:fixed;z-index:10;inset:0;background:#0009;display:grid;place-items:center;padding:14px}.dialog{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:#fffdf5;border:4px solid var(--ink);border-radius:12px;padding:20px}.answers{display:grid;gap:10px}.answers button{text-align:left}.bar{height:16px;background:#d5e3ed;border:2px solid var(--ink);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}.urgent{animation:flash .65s infinite;background:#ffdae0!important}@keyframes flash{50%{background:#ff3652!important;color:#fff}}table{width:100%;border-collapse:collapse;background:#fff;font-size:.9em}th,td{border:1px solid #a9b6c5;padding:7px;text-align:left}th{background:#d9efff}.question-row.good{background:#c9f3d7}.question-row.bad{background:#ffd0d5}.chat{height:240px;overflow:auto;background:#edf7ff;border:2px solid #8eacc7;padding:8px;border-radius:7px}.msg{padding:7px;margin:6px 0;background:#fff;border-radius:6px}.msg.mine{background:#d5f3df;margin-left:15%}.bannerimg{max-height:180px;max-width:100%;object-fit:cover;border-radius:7px}.question-media{max-width:100%;max-height:210px;border:2px solid var(--ink);border-radius:6px;cursor:zoom-in}.announcement{background:#fff5c7;border-left:5px solid var(--gold);padding:10px;border-radius:5px}.comic-panel{position:relative;overflow:hidden;background:#071328;border:4px solid var(--ink);border-radius:12px;min-height:360px}.comic-panel img{width:100%;display:block;max-height:62vh;object-fit:contain;background:#061126}.comic-caption{position:absolute;top:14px;left:14px;right:14px;background:linear-gradient(90deg,#071328f5,#071328cf);border-left:5px solid var(--gold);color:#fff;padding:12px 14px;border-radius:6px;text-shadow:1px 1px #000;z-index:2}.comic-caption h2{margin:0 0 5px;color:#ffe184;font-size:1.15em}.comic-caption p{margin:0;line-height:1.5}.comic-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.comic-progress{font-weight:bold}.comic-intro{background:linear-gradient(135deg,#132b58,#356bc0);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:24px;text-align:center}.comic-intro h1{color:#ffe184}.comic-page-label{display:inline-block;background:#ffe184;color:#14233f;border:2px solid #14233f;border-radius:5px;padding:4px 8px;font-weight:bold;margin-bottom:10px}@media(max-width:600px){.screen{padding:12px}.topbar{padding:9px}.topbar .brand{width:100%}.map{height:430px}.hero{height:205px;padding:18px}.hero h1{font-size:1.35em}.hero p{font-size:.86em}.hero .hero-badge{font-size:.82em;max-width:100%;overflow:hidden;text-overflow:ellipsis}.login{margin:3vh auto}.comic-caption{top:8px;left:8px;right:8px;padding:8px 10px;font-size:.82em}.comic-caption h2{font-size:1em}.comic-panel img{min-height:310px;object-fit:cover}.comic-controls{flex-wrap:wrap}}
</style></head><body><div id="app"></div><div id="modal"></div><script>
const KEY='hkgeoquest_v2';const COMIC=[{kind:'intro',title:'《願望之石：地理 Quest 的開始》',text:'在香港這座山海相連的城市裡，地理不只是課本上的知識，而是一場等待被發現的冒險。傳說中，願望之石會因為好奇心、合作和愛護環境而發光。'},{img:'dreamina-2026-08-16-7070-Beautiful-anime-style-mystery-adventure.jpg',title:'第一頁：圖書館裡的發現',text:'放學後，兩位學生在地理圖書館跟老師研究一個神秘的發光儀器。老師說：「這是願望之石的導航儀；它會帶領願意探索世界的人發現線索。」'},{img:'dreamina-2026-08-16-2782-Dynamic-anime-style-key-visual-manga-sp.jpg',title:'第二頁：怪盜現身',text:'當夜幕降臨校園，神秘怪盜霧影狐趁大家不注意，把閃耀的願望之石帶走了！他留下訊息：「想找回它，就用地理知識走遍每一條線索吧！」'},{img:'dreamina-2026-08-16-8059-Dynamic-anime-action-scene-shonen-manga.jpg',title:'第三頁：知識風暴',text:'翌日，怪盜留下的混亂線索化成「紙頁風暴」！主角明白，不能靠蠻力解決問題；要冷靜閱讀資料、辨認地圖符號，並與同學合作。'},{img:'dreamina-2026-08-16-9466-Dramatic-anime-climax-scene-dark-fantas.jpg',title:'第四頁：追向地理世界',text:'循著導航儀的光芒，主角看見霧影狐把願望之石帶往迷霧世界的入口。下一步，就是進入中一、中二或中三級地圖，完成任務、收集線索，讓願望之石重現光芒！'}];
const base={users:[{name:'地理老師',username:'chaeyoung423',password:'a030511',role:'teacher',className:'教師'}],banners:[{id:'b1',title:'香港自然景觀：山海相連',tip:'留意山地、海岸與人類活動的關係。',alt:'香港山海景觀像素橫幅',grade:'all',img:''},{id:'b2',title:'探索我們的城市與自然',tip:'由地圖、數據與故事開始你的地理旅程。',alt:'香港地理探索',grade:'all',img:''}],news:[{id:'n1',title:'香港天文台天氣資訊',date:'2026-08-16',source:'香港天文台',url:'https://www.hko.gov.hk/',summary:'閱讀天氣資料，思考天氣如何影響日常生活與戶外活動。',cat:'天氣與氣候',grade:'all',judge:'天氣資料可以幫助我們規劃戶外活動。',answer:'正確'}],questions:{1:[{id:'q1',topic:'香港自然環境',difficulty:'基本',type:'single',text:'香港夏季普遍炎熱潮濕，主要受哪一種季風影響？',options:['東南季風','西北季風','極地東風','信風'],answer:'東南季風',media:'',alt:''},{id:'q2',topic:'地圖技能',difficulty:'基本',type:'single',text:'地圖上的圖例主要有甚麼用途？',options:['說明符號意思','量度溫度','記錄人物名稱','改變比例'],answer:'說明符號意思',media:'',alt:''}],2:[{id:'q3',topic:'河流地貌',difficulty:'基本',type:'single',text:'河流上游通常有甚麼特徵？',options:['坡度較陡、流速較快','河道最闊','沉積最多','水流靜止'],answer:'坡度較陡、流速較快',media:'',alt:''},{id:'q4',topic:'天氣與氣候',difficulty:'基本',type:'single',text:'「今日有驟雨」最適合描述為甚麼？',options:['天氣','氣候','植被','人口'],answer:'天氣',media:'',alt:''}],3:[{id:'q5',topic:'城市問題',difficulty:'基本',type:'single',text:'哪一項最能紓緩繁忙市區的空氣污染？',options:['使用公共交通工具','增加私家車使用','露天焚燒垃圾','長開引擎'],answer:'使用公共交通工具',media:'',alt:''},{id:'q6',topic:'可持續發展',difficulty:'基本',type:'single',text:'可持續發展最強調甚麼？',options:['兼顧現在需要與未來世代','只追求短期利潤','完全停止發展','只重視單一群體'],answer:'兼顧現在需要與未來世代',media:'',alt:''}]},runs:[],messages:[],shop:[{id:'s1',name:'探險家帽章',cost:80,desc:'像素探險家紀念飾品',img:''},{id:'s2',name:'地圖放大鏡',cost:120,desc:'給認真觀察者的獎勵',img:''}],fieldTrips:[],settings:{temp:'30°C',humidity:'78%',rain:'0 mm',warning:'暫無特別天氣警告',music:['NMIXX（示範音樂清單）','TWICE（示範音樂清單）','像素冒險 BGM']}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||base,me=null,game=null,bannerIndex=0,bannerTimer=null,comicPage=0;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function id(){return Math.random().toString(36).slice(2,10)}function now(){return new Date().toLocaleString('zh-Hant-HK')}function forbidden(t){return /粗口|色情|性愛|淫|屌|仆街|f+u+c+k|shit/i.test(t||'')}function app(h){document.getElementById('app').innerHTML=h}function modal(h){document.getElementById('modal').innerHTML=h?`<div class="modal"><div class="dialog">${h}</div></div>`:''}function closeModal(){modal('')}
function loginPage(){app(`<main class="screen"><section class="login"><div class="logo">🗺️ 香港地理 Quest</div><p class="hint">8-bit 地理冒險學習平台 · 尋回被怪盜偷走的願望之石！</p><div class="tabs"><button onclick="loginTab('login')">登入</button><button class="soft" onclick="loginTab('reg')">學生申請帳戶</button></div><div id="auth"></div></section></main>`);loginTab('login')}
function loginTab(t){document.getElementById('auth').innerHTML=t==='login'?`<label class="field">帳戶<input id="liUser" autocomplete="username" placeholder="學生姓名或教師帳戶"></label><label class="field">密碼<input id="liPass" type="password" autocomplete="current-password" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')login()"></label><div id="err" class="error"></div><button style="width:100%" onclick="login()">登入（Enter）</button>`:`<label class="field">學生姓名（中文或英文）<input id="rName" placeholder="例如：陳小明／test"></label><label class="field">班別<select id="rClass">${['1A','1B','1C','1D','2A','2B','2C','2D','3A','3B','3C','3D'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">密碼<input id="rPass" type="password" placeholder="至少一個英文字及六位數字" onkeydown="if(event.key==='Enter')register()"></label><div id="err" class="error"></div><button style="width:100%" onclick="register()">申請帳戶</button><p class="hint">可使用中文、英文或中英文混合姓名；班別會自動決定可進入的年級地圖。</p>`}
function login(){let u=liUser.value.trim(),p=liPass.value,x=db.users.find(v=>(v.username===u||v.name===u)&&v.password===p);if(!x){err.textContent='帳戶或密碼不正確，請再試一次。';return}me=x;home()}function register(){let name=rName.value.trim(),cl=rClass.value,p=rPass.value;if(!/^[A-Za-z\u4e00-\u9fff][A-Za-z\u4e00-\u9fff .'-]{1,39}$/.test(name)){err.textContent='請輸入 2 至 40 個中文字或英文字；可包含空格、句點、連字號或撇號。';return}if(!/(?=.*[A-Za-z])(?=(?:.*\d){6,}).{7,}/.test(p)){err.textContent='密碼需要至少一個英文字及六位數字。';return}if(db.users.some(x=>x.name.toLowerCase()===name.toLowerCase())){err.textContent='此姓名帳戶已存在，請聯絡老師。';return}let g=+cl[0];db.users.push({name,username:name,password:p,role:'student',className:cl,grade:g,coins:2,checkin:'',purchases:[]});save();me=db.users.at(-1);home()}
function nav(){return `<header class="topbar"><span class="brand">🗺️ 香港地理 Quest</span><button class="soft" onclick="home()">主頁</button><button class="soft" onclick="openChat()">聊天</button>${me.role==='teacher'?`<button class="gold" onclick="teacherPanel()">教師面板</button>`:`<button class="gold" onclick="dailyCheckin()">每天簽到</button>`}<button class="danger" onclick="me=null;closeModal();loginPage()">登出</button></header>`}
function home(){closeModal();document.onkeydown=null;clearInterval(window.activeTimer);clearInterval(bannerTimer);game=null;app(nav()+`<main class="page"><section class="hero" id="hero"></section><div class="ticker" id="ticker"></div><section class="grid" style="margin-top:16px"><article class="card"><h2>📖 漫畫式劇情</h2><p>怪盜「霧影狐」偷走了能實現美好願望的願望之石，並把它藏在三個地理世界！與同伴合作、解開地理線索，找回願望之石吧。</p><button onclick="openComic(0)">閱讀故事</button> <button onclick="tutorial()">新手引導</button> <button class="gold" onclick="startGame()">開始冒險</button></article><article class="card"><h2>🌦️ 香港即時天氣（教師示範）</h2><p>氣溫：<b>${esc(db.settings.temp)}</b>　濕度：<b>${esc(db.settings.humidity)}</b></p><p>雨量：<b>${esc(db.settings.rain)}</b>　警告：<b>${esc(db.settings.warning)}</b></p><p class="hint">教師可在控制台更新課堂示範資料。</p></article><article class="card"><h2>📰 地理新聞速報</h2>${db.news.slice(0,3).map(n=>`<div class="announcement"><b>${esc(n.title)}</b><br><span class="hint">${esc(n.date)} · ${esc(n.cat)}</span><p>${esc(n.summary)}</p><button class="soft" onclick="readNews('${n.id}')">閱讀及判斷</button></div>`).join('')}</article></section><section class="card" style="margin-top:16px"><h2>🧭 我的地圖</h2>${me.role==='teacher'?'<p>教師可進入控制台管理三個年級的地圖、題庫與學習資料。</p><button onclick="teacherPanel()">前往教師面板</button>':`<p><b>${esc(me.name)}</b>（${me.className}）只可進入中${me.grade}地圖，確保題目配合你的學習進度。</p><p><span class="badge">💰 ${me.coins||0} 金幣</span><span class="badge">❤️ 3 生命</span></p><button class="gold" onclick="startGame()">進入中${me.grade}地圖</button> <button class="soft" onclick="shop()">商店</button>`}</section></main>`);renderBanner();bannerTimer=setInterval(renderBanner,5000)}
function renderBanner(){let bs=db.banners.filter(x=>x.grade==='all'||x.grade===(me.grade||1)),b=bs[bannerIndex%Math.max(1,bs.length)]||db.banners[0];bannerIndex++;let h=document.getElementById('hero');if(!h)return;h.innerHTML=`${b.img?`<img class="bannerimg" src="${b.img}" alt="${esc(b.alt)}" style="position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;opacity:.68">`:''}<h1>${esc(b.title)}</h1><p>💡 ${esc(b.tip)}</p><span class="hero-badge">香港自然景觀</span>`;let t=document.getElementById('ticker');if(t)t.textContent='📢 '+db.news.map(n=>n.title).join('　｜　')}
function openComic(p){comicPage=Math.max(0,Math.min(COMIC.length-1,p));let x=COMIC[comicPage],body=x.kind==='intro'?`<div class="comic-intro"><div class="comic-page-label">故事背景</div><h1>${esc(x.title)}</h1><p>${esc(x.text)}</p></div>`:`<div class="comic-panel"><img src="${x.img}" alt="${esc(x.title)}"><div class="comic-caption"><h2>${esc(x.title)}</h2><p>${esc(x.text)}</p></div></div>`;modal(`${body}<div class="comic-controls"><button class="soft" onclick="${comicPage===0?'closeModal()':`openComic(${comicPage-1})`}">${comicPage===0?'關閉':'← 上一頁'}</button><span class="comic-progress">第 ${comicPage+1}／${COMIC.length} 頁</span><button class="gold" onclick="${comicPage===COMIC.length-1?'closeModal()':`openComic(${comicPage+1})`}">${comicPage===COMIC.length-1?'開始冒險！':'下一頁 →'}</button></div>`)}
function tutorial(){modal(`<h2>🎮 新手引導</h2><ol><li>用 WASD／方向鍵／手機按鈕移動角色。</li><li>靠近 🦉 NPC 取得三個地理線索；靠近可愛怪物作答。</li><li>每題限時 30 秒；答對得 50 金幣。錯誤或超時會先扣分，再扣生命。</li><li>生命歸零需重新開始本次冒險；遊玩紀錄都會保留。</li></ol><button onclick="closeModal()">明白了！</button>`)}
function startGame(){if(me.role==='teacher'){modal('<h2>教師帳戶</h2><p>請以學生帳戶進行地圖冒險；你可在教師面板預覽及管理題目。</p><button onclick="closeModal()">關閉</button>');return}clearInterval(bannerTimer);let qs=db.questions[me.grade]||[];game={x:45,y:70,lives:3,score:0,coins:0,idx:0,clues:0,answered:[],qs:[...qs].sort(()=>Math.random()-.5)};app(nav()+`<main class="page"><div class="hud"><span class="badge" id="life">❤️ ❤️ ❤️</span><span class="badge" id="score">⭐ 分數：0</span><span class="badge" id="coin">💰 本局金幣：0</span><span class="badge" id="prog">進度：0/${qs.length}</span><button class="soft" onclick="shop()">商店</button><button class="soft" onclick="music()">音效</button><button class="soft" onclick="readAllNews()">新聞</button><button class="soft" onclick="openComic(0)">漫畫</button><button class="soft" onclick="home()">返回主頁</button></div><div class="map"><div class="road" style="left:5%;top:42%;width:88%;height:32px"></div><div class="road" style="left:47%;top:10%;width:32px;height:76%"></div><div class="sign" style="left:7%;top:29%">🪧<div class="hint">中${me.grade}地理島</div></div><div class="npc" style="left:18%;top:58%" onclick="clue()">🦉<div class="hint">貓頭鷹老師</div></div><div class="npc" style="left:70%;top:17%" onclick="clue()">🐼<div class="hint">熊貓嚮導</div></div><div class="monster" style="left:72%;top:65%" onclick="encounter()">👾<div class="hint">迷途小怪</div></div><div class="monster" style="left:32%;top:15%" onclick="encounter()">🦖<div class="hint">雲霧龍</div></div><div class="player" id="player" style="left:45%;top:70%">🧑‍🚀</div><div class="mapnote">接近 NPC 或怪物，或直接點擊牠們開始互動。</div></div><div class="move"><button onclick="move(0,-1)">▲</button><button onclick="move(-1,0)">◀</button><button onclick="move(1,0)">▶</button><button onclick="move(0,1)">▼</button></div></main>`);document.onkeydown=e=>{let d={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}}}
function move(dx,dy){if(!game)return;game.x=Math.max(2,Math.min(92,game.x+dx*4));game.y=Math.max(2,Math.min(88,game.y+dy*4));let p=document.getElementById('player');if(p){p.style.left=game.x+'%';p.style.top=game.y+'%'}}function clue(){if(!game)return;game.clues=Math.min(3,game.clues+1);let lines=['線索一：仔細觀察地圖的圖例，它能協助你理解符號。','線索二：天氣是短時間的狀況，氣候則是長時間的平均特徵。','線索三：人類活動和自然環境互相影響，要從不同角度分析。'];modal(`<h2>🦉 動物 NPC 的地理線索</h2><p>${lines[game.clues-1]}</p><p>已收集 ${game.clues}/3 個線索。</p><button onclick="closeModal()">繼續探索</button>`)}function encounter(){if(!game)return;if(game.idx>=game.qs.length){finish();return}ask(game.qs[game.idx])}
function ask(q){let t=30;modal(`<h2>⚔️ 可愛怪物挑戰</h2><div id="timer" class="badge" style="font-size:1.3em">⏱️ 30 秒</div><div class="bar"><i id="timebar" style="width:100%"></i></div><p><b>${esc(q.text)}</b></p>${q.media?mediaHTML(q):''}<div class="answers" id="answers">${answersHTML(q)}</div><p class="hint">30 秒內回答；答錯或超時會扣分／生命。回答不可包含不當用詞。</p></div>`);clearInterval(window.activeTimer);window.activeTimer=setInterval(()=>{t--;let el=document.getElementById('timer'),bar=document.getElementById('timebar');if(!el){clearInterval(window.activeTimer);return}el.textContent=`⏱️ ${t} 秒`;bar.style.width=(t/30*100)+'%';if(t<=10)el.classList.add('urgent');if(t<=0){clearInterval(window.activeTimer);answer(q,null,true)}},1000)}function mediaHTML(q){return q.media.startsWith('data:application/pdf')?`<p><a href="${q.media}" target="_blank">📄 開啟附加 PDF</a></p>`:`<img class="question-media" src="${q.media}" alt="${esc(q.alt||'題目圖片')}" onclick="window.open(this.src)">`}
function answersHTML(q){if(q.type==='open')return `<textarea id="openAns" placeholder="輸入你的答案"></textarea><button onclick="answerOpen('${q.id}')">提交答案</button>`;if(q.type==='multi')return q.options.map(o=>`<label class="badge"><input type="checkbox" value="${esc(o)}"> ${esc(o)}</label>`).join('')+`<button onclick="answerMulti('${q.id}')">提交選擇</button>`;return q.options.map(o=>`<button onclick="answerById('${q.id}','${encodeURIComponent(o)}')">${esc(o)}</button>`).join('')}function getQ(qid){return Object.values(db.questions).flat().find(q=>q.id===qid)}function answerById(qid,v){answer(getQ(qid),decodeURIComponent(v))}function answerMulti(qid){let q=getQ(qid),v=[...document.querySelectorAll('#answers input:checked')].map(x=>x.value);answer(q,v)}function answerOpen(qid){let q=getQ(qid),v=openAns.value.trim();if(forbidden(v)){alert('請勿輸入不當用詞。');return}answer(q,v)}
function answer(q,v,timeout=false){if(!game)return;clearInterval(window.activeTimer);let correct=q.type==='multi'?JSON.stringify((v||[]).sort())===JSON.stringify((Array.isArray(q.answer)?q.answer:[q.answer]).sort()):String(v||'').trim().toLowerCase()===String(q.answer).trim().toLowerCase();game.answered.push({qid:q.id,correct,answer:v,timeout});if(correct){game.score+=100;game.coins+=50;game.idx++;modal(`<h2>✨ 答對了！</h2><p>你獲得 50 金幣和 100 分。怪物友善地讓路了！</p><button onclick="closeModal()">繼續</button>`)}else{game.score=Math.max(0,game.score-30);game.lives--;game.idx++;modal(`<h2>${timeout?'⏰ 時間到了！':'💫 再接再厲！'}</h2><p>${game.lives>0?`答案是：<b>${esc(Array.isArray(q.answer)?q.answer.join('、'):q.answer)}</b>。扣 30 分，剩下 ${game.lives} 條生命。`:'生命歸零，本次冒險需要重新開始；之前的遊玩紀錄仍會保留。'}</p><button onclick="${game.lives>0?'closeModal()':'recordAndRestart()'}">${game.lives>0?'繼續探索':'重新開始'}</button>`)}updateHUD();if(game.idx>=game.qs.length&&game.lives>0)setTimeout(finish,350)}function updateHUD(){if(!game)return;let a=document.getElementById('life');if(a)a.textContent='❤️ '.repeat(game.lives)+'🖤 '.repeat(3-game.lives);document.getElementById('score').textContent='⭐ 分數：'+game.score;document.getElementById('coin').textContent='💰 本局金幣：'+game.coins;document.getElementById('prog').textContent='進度：'+game.idx+'/'+game.qs.length}function recordRun(){if(!game)return;db.runs.push({id:id(),student:me.name,className:me.className,grade:me.grade,score:game.score,coins:game.coins,answers:game.answered,time:now()});me.coins=(me.coins||0)+game.coins;save()}function recordAndRestart(){recordRun();closeModal();startGame()}function finish(){if(!game)return;let perfect=game.answered.length&&game.answered.every(a=>a.correct);if(perfect)game.coins+=10;recordRun();document.onkeydown=null;let score=game.score,coins=game.coins;game=null;modal(`<h2>🏆 冒險完成！</h2><p>分數：${score}；獲得：${coins} 金幣${perfect?'（全對額外 +10 金幣）':''}</p><p>願望之石已重現光芒！感謝你用地理知識守護香港的山海與城市。</p><button onclick="feedback()">留下意見</button> <button class="gold" onclick="startGame()">再次遊玩</button> <button class="soft" onclick="home()">返回主頁</button>`)}
function feedback(){modal(`<h2>💬 課後意見</h2><p>你最不明白哪一題？還有甚麼想問老師？</p><textarea id="feedbackText" placeholder="請以合宜語言分享你的想法"></textarea><button onclick="sendFeedback()">發送給老師</button> <button class="soft" onclick="home()">返回主頁</button>`)}function sendFeedback(){let text=feedbackText.value.trim();if(!text)return;if(forbidden(text)){alert('請勿輸入不當用詞。');return}db.messages.push({id:id(),from:me.name,to:'teacher',text,time:now()});save();modal('<h2>已發送</h2><p>老師會在一對一聊天中收到你的訊息。</p><button onclick="home()">返回主頁</button>')}
function dailyCheckin(){let day=new Date().toDateString();if(me.checkin===day){modal('<h2>今天已簽到</h2><p>明天再回來可獲得 2 金幣！</p><button onclick="closeModal()">關閉</button>');return}me.checkin=day;me.coins=(me.coins||0)+2;save();modal('<h2>🎁 簽到成功</h2><p>你獲得 2 金幣！</p><button onclick="home()">太好了</button>')}
function shop(){let items=db.shop.map(s=>`<div class="card"><b>${esc(s.name)}</b>${s.img?`<img class="question-media" src="${s.img}" alt="商品圖片">`:''}<p>${esc(s.desc)}</p><span class="badge">💰 ${s.cost}</span><br><button onclick="buy('${s.id}')">購買</button></div>`).join('');modal(`<h2>🛒 地理商店</h2><p>你的金幣：<b>${me.coins||0}</b></p><div class="grid">${items||'<p>老師尚未設定商品。</p>'}</div><button class="soft" onclick="closeModal()">關閉</button>`)}function buy(sid){let s=db.shop.find(x=>x.id===sid);if((me.coins||0)<s.cost){alert('金幣不足！');return}me.coins-=s.cost;me.purchases=(me.purchases||[]).concat(sid);save();alert('購買成功：'+s.name);shop()}function music(){modal(`<h2>🎵 音樂與音效</h2><p>請選擇低音量的背景音樂（此示範版本不串流受版權保護的歌曲）。</p>${db.settings.music.map(m=>`<button class="soft" onclick="alert('已選擇：${esc(m)}（示範設定）')">${esc(m)}</button>`).join(' ')}<p class="hint">老師可加入已獲授權使用的音樂／音效名稱。</p><button onclick="closeModal()">關閉</button>`)}
function readAllNews(){modal(`<h2>📰 地理新聞速報</h2>${db.news.map(n=>newsBlock(n)).join('<hr>')}<button onclick="closeModal()">關閉</button>`)}function readNews(nid){let n=db.news.find(x=>x.id===nid)||db.news[0];modal(`<h2>📰 ${esc(n.title)}</h2>${newsBlock(n)}<button onclick="closeModal()">關閉</button>`)}function newsBlock(n){return `<p><b>${esc(n.date)}</b> · ${esc(n.source)} · ${esc(n.cat)}</p><p>${esc(n.summary)}</p>${n.url?`<p><a href="${esc(n.url)}" target="_blank">開啟原文連結</a></p>`:''}<p>${esc(n.judge||'')}</p>${n.judge?`<button class="soft" onclick="alert('答案：${esc(n.answer)}')">查看判斷答案</button>`:''}`}
function openChat(){let isT=me.role==='teacher',conv=isT?db.messages:db.messages.filter(m=>m.from===me.name||m.to===me.name);modal(`<h2>💬 一對一聊天</h2><p class="hint">學生只能與老師對話，其他同學不會看到訊息。</p>${isT?`<select id="chatStudent"><option value="">請選擇學生</option>${db.users.filter(x=>x.role==='student').map(u=>`<option value="${esc(u.name)}">${esc(u.name)}（${u.className}）</option>`).join('')}</select>`:''}<div class="chat">${conv.map(m=>`<div class="msg ${m.from===me.name?'mine':''}"><b>${esc(m.from==='teacher'?'老師':m.from)}</b> <span class="hint">${esc(m.time)}</span><br>${esc(m.text)}</div>`).join('')||'暫時沒有訊息。'}</div><textarea id="chatText" placeholder="輸入訊息（禁止不當用詞）"></textarea><button onclick="sendChat()">發送</button> <button class="soft" onclick="closeModal()">關閉</button>`)}function sendChat(){let t=chatText.value.trim();if(!t||forbidden(t)){alert('請輸入合宜的訊息。');return}let target=me.role==='teacher'?document.getElementById('chatStudent').value:'teacher';if(!target){alert('請先選擇學生。');return}db.messages.push({id:id(),from:me.role==='teacher'?'teacher':me.name,to:target,text:t,time:now()});save();openChat()}
function teacherPanel(){clearInterval(bannerTimer);closeModal();app(nav()+`<main class="page"><h1>👩‍🏫 教師控制台</h1><div class="tools"><button onclick="teacherTab('results')">學生成績</button><button onclick="teacherTab('questions')">題庫／編輯</button><button onclick="teacherTab('banner')">橫幅管理</button><button onclick="teacherTab('news')">新聞速報</button><button onclick="teacherTab('shop')">商店管理</button><button onclick="teacherTab('weather')">即時控制台</button><button onclick="teacherTab('field')">實地考察</button><button onclick="openChat()">私訊回覆</button></div><div id="teacherContent"></div></main>`);teacherTab('results')}
function teacherTab(tab){let c=document.getElementById('teacherContent');if(tab==='results'){let students=db.users.filter(x=>x.role==='student'),stats=Object.values(db.questions).flat().map(q=>{let aa=db.runs.flatMap(r=>r.answers.filter(a=>a.qid===q.id));return{q,n:aa.length,rate:aa.length?Math.round(aa.filter(a=>a.correct).length/aa.length*100):null}}),valid=stats.filter(x=>x.rate!==null),min=Math.min(...valid.map(x=>x.rate),100),max=Math.max(...valid.map(x=>x.rate),0);c.innerHTML=`<div class="grid"><section class="card"><h2>學生帳戶及密碼</h2><table><tr><th>姓名</th><th>班別</th><th>密碼（示範）</th><th>金幣</th></tr>${students.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.className}</td><td>${esc(s.password)}</td><td>${s.coins||0}</td></tr>`).join('')}</table><p class="hint">正式使用時，應採用安全雜湊密碼及重設密碼流程，不應明文展示密碼。</p></section><section class="card"><h2>題目表現熱點</h2><table><tr><th>題目</th><th>作答數</th><th>正確率</th></tr>${stats.map(x=>`<tr class="question-row ${x.rate===max&&x.n?'good':x.rate===min&&x.n?'bad':''}"><td>${esc(x.q.text)}</td><td>${x.n}</td><td>${x.rate===null?'未有資料':x.rate+'%'}</td></tr>`).join('')}</table><p class="hint">綠色代表最多人答對；紅色代表表現最不理想。</p></section></div><section class="card"><h2>遊玩紀錄</h2><button class="gold" onclick="exportCSV()">匯出 CSV</button><table><tr><th>學生</th><th>班別</th><th>年級</th><th>分數</th><th>金幣</th><th>時間</th><th></th></tr>${db.runs.map(r=>`<tr><td>${esc(r.student)}</td><td>${r.className}</td><td>中${r.grade}</td><td>${r.score}</td><td>${r.coins}</td><td>${esc(r.time)}</td><td><button class="danger" onclick="deleteRun('${r.id}')">刪除本次</button></td></tr>`).join('')}</table><p>${students.map(s=>`<button class="danger" onclick="deleteStudentRuns('${encodeURIComponent(s.name)}')">刪除 ${esc(s.name)} 全部紀錄</button>`).join(' ')}</p></section>`}else if(tab==='questions'){c.innerHTML=`<section class="card"><h2>新增／編輯題目</h2><div class="grid"><label class="field">年級<select id="qGrade"><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">課題<input id="qTopic" placeholder="例如：天氣與氣候"></label><label class="field">難度<select id="qDiff"><option>基本</option><option>進階</option><option>挑戰</option></select></label><label class="field">題型<select id="qType"><option value="single">單選題／圖片＋單選／地圖點選</option><option value="multi">多項選擇／圖片＋多項</option><option value="open">開放式／圖片標註／配對排序（文字判定）</option></select></label></div><label class="field">題目<textarea id="qText"></textarea></label><label class="field">選項（以 | 分隔；開放式可留空）<input id="qOpts" placeholder="選項 A | 選項 B | 選項 C"></label><label class="field">正確答案（多項選擇以 | 分隔）<input id="qAns"></label><label class="field">上載 JPEG／PNG／GIF／PDF<input type="file" id="qFile" accept="image/jpeg,image/png,image/gif,application/pdf"></label><label class="field">圖片替代文字<input id="qAlt"></label><button onclick="addQuestion()">新增題目</button></section>${[1,2,3].map(g=>`<section class="card"><h2>中${g}題庫</h2><table><tr><th>課題</th><th>題目</th><th>題型</th><th>操作</th></tr>${db.questions[g].map(q=>`<tr><td>${esc(q.topic)}</td><td>${esc(q.text)}</td><td>${q.type}</td><td><button class="soft" onclick="previewQ('${q.id}')">預覽</button> <button class="danger" onclick="deleteQ(${g},'${q.id}')">刪除</button></td></tr>`).join('')}</table></section>`).join('')}`}else if(tab==='banner'){c.innerHTML=`<section class="card"><h2>新增橫幅</h2><label class="field">標題<input id="bTitle"></label><label class="field">地理提示<input id="bTip"></label><label class="field">替代文字<input id="bAlt"></label><label class="field">顯示年級<select id="bGrade"><option value="all">所有年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">JPEG／PNG／GIF<input id="bFile" type="file" accept="image/jpeg,image/png,image/gif"></label><button onclick="addBanner()">新增橫幅</button></section><section class="grid">${db.banners.map(b=>`<article class="card">${b.img?`<img class="bannerimg" src="${b.img}" alt="${esc(b.alt)}">`:''}<b>${esc(b.title)}</b><p>${esc(b.tip)}</p><button class="danger" onclick="delBanner('${b.id}')">刪除</button></article>`).join('')}</section>`}else if(tab==='news'){c.innerHTML=`<section class="card"><h2>新增地理新聞速報</h2><label class="field">標題<input id="nTitle"></label><label class="field">日期<input id="nDate" type="date"></label><label class="field">新聞來源<input id="nSource"></label><label class="field">原文連結<input id="nUrl" type="url"></label><label class="field">教師摘要<textarea id="nSummary"></textarea></label><label class="field">議題分類<input id="nCat" placeholder="天氣與氣候"></label><label class="field">適用年級<select id="nGrade"><option value="all">所有年級</option><option value="1">中一</option><option value="2">中二</option><option value="3">中三</option></select></label><label class="field">學生判斷題<input id="nJudge"></label><label class="field">正確分類答案<input id="nAnswer"></label><button onclick="addNews()">發布新聞</button></section><section class="card">${db.news.map(n=>`<p><b>${esc(n.title)}</b> <button class="danger" onclick="delNews('${n.id}')">刪除</button></p>`).join('')}</section>`}else if(tab==='shop'){c.innerHTML=`<section class="card"><h2>新增商品</h2><label class="field">商品名稱<input id="sName"></label><label class="field">金幣價格<input id="sCost" type="number" min="0"></label><label class="field">商品描述<textarea id="sDesc"></textarea></label><label class="field">圖片<input id="sFile" type="file" accept="image/jpeg,image/png,image/gif"></label><button onclick="addShop()">新增商品</button></section><section class="grid">${db.shop.map(s=>`<article class="card"><b>${esc(s.name)}</b><p>${s.cost} 金幣</p><button class="danger" onclick="delShop('${s.id}')">刪除</button></article>`).join('')}</section>`}else if(tab==='weather'){c.innerHTML=`<section class="card"><h2>即時控制台示範</h2><p>可為課堂演示更新香港天氣數據和背景音樂清單。</p><label class="field">氣溫<input id="wTemp" value="${esc(db.settings.temp)}"></label><label class="field">濕度<input id="wHum" value="${esc(db.settings.humidity)}"></label><label class="field">雨量<input id="wRain" value="${esc(db.settings.rain)}"></label><label class="field">警告<input id="wWarn" value="${esc(db.settings.warning)}"></label><label class="field">音樂／音效清單（每行一項；僅加入已獲授權使用的內容）<textarea id="wMusic">${esc(db.settings.music.join('\n'))}</textarea></label><button onclick="saveWeather()">儲存設定</button></section>`}else if(tab==='field'){c.innerHTML=`<section class="card"><h2>校園實地考察任務</h2><label class="field">任務名稱<input id="fTitle"></label><label class="field">任務說明<textarea id="fDesc"></textarea></label><label class="field">適用年級<select id="fGrade"><option>1</option><option>2</option><option>3</option></select></label><button onclick="addField()">新增任務</button></section><section class="card">${db.fieldTrips.map(f=>`<p><b>中${f.grade}：${esc(f.title)}</b> — ${esc(f.desc)} <button class="danger" onclick="delField('${f.id}')">刪除</button></p>`).join('')||'尚未設定任務。'}</section>`}}
function fileData(el,cb){let f=el.files[0];if(!f){cb('');return}let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}function addQuestion(){let g=+qGrade.value,type=qType.value,text=qText.value.trim(),ans=qAns.value.trim(),opts=qOpts.value.split('|').map(x=>x.trim()).filter(Boolean);if(!text||!ans){alert('請填寫題目和正確答案。');return}fileData(qFile,media=>{db.questions[g].push({id:id(),topic:qTopic.value||'未分類',difficulty:qDiff.value,type,text,options:opts,answer:type==='multi'?ans.split('|').map(x=>x.trim()):ans,media,alt:qAlt.value});save();teacherTab('questions')})}function previewQ(qid){let q=getQ(qid);modal(`<h2>題目預覽</h2><p><b>${esc(q.text)}</b></p>${q.media?mediaHTML(q):''}<div class="answers">${answersHTML(q)}</div><button class="soft" onclick="closeModal()">關閉</button>`)}function deleteQ(g,qid){if(confirm('刪除此題？')){db.questions[g]=db.questions[g].filter(q=>q.id!==qid);save();teacherTab('questions')}}function addBanner(){if(!bTitle.value.trim())return alert('請輸入標題');fileData(bFile,img=>{db.banners.push({id:id(),title:bTitle.value,tip:bTip.value,alt:bAlt.value,grade:bGrade.value,img});save();teacherTab('banner')})}function delBanner(i){db.banners=db.banners.filter(b=>b.id!==i);save();teacherTab('banner')}function addNews(){if(!nTitle.value)return alert('請輸入標題');db.news.push({id:id(),title:nTitle.value,date:nDate.value,source:nSource.value,url:nUrl.value,summary:nSummary.value,cat:nCat.value,grade:nGrade.value,judge:nJudge.value,answer:nAnswer.value});save();teacherTab('news')}function delNews(i){db.news=db.news.filter(n=>n.id!==i);save();teacherTab('news')}function addShop(){if(!sName.value)return alert('請輸入商品名稱');fileData(sFile,img=>{db.shop.push({id:id(),name:sName.value,cost:+sCost.value||0,desc:sDesc.value,img});save();teacherTab('shop')})}function delShop(i){db.shop=db.shop.filter(s=>s.id!==i);save();teacherTab('shop')}function saveWeather(){db.settings={temp:wTemp.value,humidity:wHum.value,rain:wRain.value,warning:wWarn.value,music:wMusic.value.split('\n').filter(Boolean)};save();alert('已儲存')}function addField(){db.fieldTrips.push({id:id(),title:fTitle.value,desc:fDesc.value,grade:fGrade.value});save();teacherTab('field')}function delField(i){db.fieldTrips=db.fieldTrips.filter(f=>f.id!==i);save();teacherTab('field')}function deleteRun(i){db.runs=db.runs.filter(r=>r.id!==i);save();teacherTab('results')}function deleteStudentRuns(n){n=decodeURIComponent(n);if(confirm('刪除 '+n+' 的全部遊玩紀錄？')){db.runs=db.runs.filter(r=>r.student!==n);save();teacherTab('results')}}function exportCSV(){let rows=[['學生','班別','年級','分數','金幣','時間'],...db.runs.map(r=>[r.student,r.className,r.grade,r.score,r.coins,r.time])],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='香港地理Quest_學生成績.csv';a.click()}
loginPage();
